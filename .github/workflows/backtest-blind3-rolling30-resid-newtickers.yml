name: Backtest blind3 rolling30 residual QQQ and new tickers

on:
  push:
    branches: [migracion-github-actions]
    paths:
      - 'scripts/backtest_blind3_rolling30_resid_newtickers.py'
      - '.github/workflows/backtest-blind3-rolling30-resid-newtickers.yml'
      - 'data/analysis/googlefinance_alt_6030_returns_20260303_20260820.csv'
      - 'data/analysis/googlefinance_alt_rolling30_live_returns.csv'
      - 'data/rolling90/sbs_profuturo_f3.csv'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migracion-github-actions
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy yfinance
      - name: Run backtest
        run: python scripts/backtest_blind3_rolling30_resid_newtickers.py
      - name: Commit results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/backtest_blind3_rolling30_full.csv analysis/backtest_blind3_rolling30_common.csv analysis/backtest_blind3_rolling30_resid_newtickers.json public/data/backtest_blind3_rolling30_resid_newtickers.json
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Update blind3 rolling30 residual and new-tickers backtest'
            git pull --rebase origin migracion-github-actions
            git push origin HEAD:migracion-github-actions
          fi
