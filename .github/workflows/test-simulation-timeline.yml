name: Validar línea temporal del simulador

on:
  pull_request:
    branches:
      - migracion-github-actions
    paths:
      - "scripts/build_operation_series.py"
      - "scripts/postprocess_mobile_ui_v3.py"
      - "scripts/postprocess_trade_history.py"
      - "scripts/postprocess_trade_notebook_basis.py"
      - "scripts/validate_operation_timeline.py"
      - ".github/workflows/test-simulation-timeline.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias mínimas
        run: pip install pandas

      - name: Compilar scripts modificados
        run: |
          python -m py_compile scripts/build_operation_series.py
          python -m py_compile scripts/postprocess_mobile_ui_v3.py
          python -m py_compile scripts/postprocess_trade_history.py
          python -m py_compile scripts/validate_operation_timeline.py

      - name: Reconstruir línea temporal completa
        run: python scripts/build_operation_series.py

      - name: Validar gráfico, simulación y valores SBS
        run: python scripts/validate_operation_timeline.py
