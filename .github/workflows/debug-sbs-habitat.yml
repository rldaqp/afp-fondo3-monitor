name: Inspeccionar fuente diaria SBS Hábitat

on:
  workflow_dispatch:
  push:
    branches:
      - migracion-github-actions
    paths:
      - ".github/workflows/debug-sbs-habitat.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar página diaria SBS
        run: |
          curl -L --fail --retry 3 \
            -A "Mozilla/5.0 AFP-Habitat-Fondo3-GitHubActions" \
            "https://www.sbs.gob.pe/app/spp/variablesSPP_net/PagSS/variables_spp.aspx" \
            -o variables_spp.html
          wc -c variables_spp.html
          grep -Eio '<form[^>]*>|<input[^>]*>|<select[^>]*>|<script[^>]*src[^>]*>|href="[^"]+"' variables_spp.html | head -n 300 || true

      - name: Guardar HTML para inspección
        uses: actions/upload-artifact@v4
        with:
          name: sbs-variables-page
          path: variables_spp.html
          retention-days: 1
