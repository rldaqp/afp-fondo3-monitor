name: Probar polinomial Excel Rolling 30
on:
  workflow_dispatch:
  push:
    branches: [migracion-github-actions]
    paths:
      - scripts/test_excel_poly_rolling30.py
      - .github/workflows/test-excel-poly-rolling30.yml
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migracion-github-actions
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests lxml yfinance
      - name: Ejecutar prueba
        run: python scripts/test_excel_poly_rolling30.py
      - name: Guardar resultado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/test_excel_poly_rolling30.json
          if ! git diff --cached --quiet; then
            git commit -m "Guardar prueba polinomial Excel Rolling 30"
            git push origin HEAD:migracion-github-actions
          fi