name: Analizar divergencia EPU vs SPBLSCUP

on:
  push:
    branches:
      - migracion-github-actions
    paths:
      - "scripts/analyze_epu_spbl_disagreement.py"
      - ".github/workflows/analyze-epu-spbl-disagreement.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migracion-github-actions
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance
      - name: Ejecutar análisis
        run: python scripts/analyze_epu_spbl_disagreement.py
      - name: Guardar resultado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189822+github-actions[bot]@users.noreply.github.com"
          git add analysis/epu_spbl_disagreement_analysis.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Actualizar análisis divergencia EPU SPBLSCUP"
            git pull --rebase origin migracion-github-actions
            git push origin HEAD:migracion-github-actions
          fi
