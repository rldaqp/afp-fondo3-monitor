name: Comparar SPY vs Nasdaq QQQ

on:
  workflow_dispatch:
  push:
    branches:
      - migracion-github-actions
    paths:
      - ".github/workflows/compare-spy-qqq.yml"
      - "scripts/compare_spy_qqq_relevance.py"
      - "data/rolling90/markets.csv"
      - "data/rolling90/sbs_profuturo_f3.csv"
      - "data/rolling90/sbs_habitat_f3.csv"

permissions:
  contents: write

concurrency:
  group: compare-spy-qqq
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: migracion-github-actions
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Comparar SPY y Nasdaq QQQ
        run: python scripts/compare_spy_qqq_relevance.py

      - name: Validar resultado
        run: |
          test -s data/rolling90/spy_qqq_relevance.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('data/rolling90/spy_qqq_relevance.json').read_text(encoding='utf-8'))
          assert p['nasdaq_proxy'].startswith('QQQ')
          for fund in ('PROFUTURO','HABITAT'):
              r=p['results'][fund]
              assert r['rolling_90']['SPY']['n_predictions'] > 10
              assert r['rolling_90']['QQQ']['n_predictions'] > 10
              assert r['rolling_90']['BOTH']['n_predictions'] > 10
          print(json.dumps(p['recommendation'], ensure_ascii=False, indent=2))
          PY

      - name: Guardar análisis
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rolling90/spy_qqq_relevance.json
          if git diff --cached --quiet; then
            echo "Sin cambios en el contraste."
          else
            git commit -m "Actualizar contraste SPY vs Nasdaq QQQ"
            git pull --rebase origin migracion-github-actions
            git push origin HEAD:migracion-github-actions
          fi
