name: Actualizar Profuturo Fondo 3 independiente

on:
  workflow_dispatch:
  push:
    branches:
      - migracion-github-actions
    paths:
      - ".github/workflows/update-profuturo-only.yml"
      - "scripts/build_rolling90_pages.py"
      - "scripts/run_rolling90_live_v2.py"
      - "scripts/apply_sbs_reference_corrections.py"
      - "scripts/finalize_notebook_parity_v4.py"
      - "scripts/finalize_notebook_parity_v5.py"
      - "scripts/finalize_fx_hybrid.py"
      - "scripts/build_model_insights.py"
      - "scripts/build_operation_series.py"
      - "scripts/postprocess_mobile_ui_v3.py"
      - "scripts/postprocess_mobile_ui_v4.py"
      - "scripts/postprocess_fx_hybrid_ui.py"
      - "scripts/postprocess_model_insights_ui.py"
      - "scripts/postprocess_trade_history.py"
      - "scripts/postprocess_trade_cloud_sync.py"
      - "scripts/postprocess_trade_notebook_basis.py"
      - "data/rolling90/sbs_reference_corrections.csv"
      - "data/rolling90/notebook_training_reference.csv"
      - "requirements.txt"
  schedule:
    - cron: "10 5-23 * * 1-5"
    - cron: "10 0-4 * * 2-6"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: profuturo-fondo3-independiente
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Actualizar solo Profuturo
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          python scripts/run_rolling90_live_v2.py
          python scripts/apply_sbs_reference_corrections.py
          python scripts/finalize_fx_hybrid.py
          python scripts/build_model_insights.py
          git restore --source=HEAD -- public/data/live_market.json || true
          python scripts/build_operation_series.py
          sed -i "s/calc.onclick=calc;/document.getElementById('calc').onclick=calc;/" public/index.html
          python scripts/postprocess_mobile_ui_v3.py
          python scripts/postprocess_mobile_ui_v4.py
          python scripts/postprocess_fx_hybrid_ui.py
          python scripts/postprocess_model_insights_ui.py
          python scripts/postprocess_trade_history.py
          python scripts/postprocess_trade_cloud_sync.py
          python scripts/postprocess_trade_notebook_basis.py

      - name: Validar VC oficial y visor Profuturo
        run: |
          test -s data/rolling90/sbs_profuturo_f3.csv
          test -s public/index.html
          test -s public/data/latest.json
          test -s public/data/series.json
          test -s public/data/signals.json
          test -s public/data/operation_series.json
          test -s public/data/model_insights.json

          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          history = pd.read_csv("data/rolling90/sbs_profuturo_f3.csv")
          history["fecha"] = pd.to_datetime(history["fecha"], errors="coerce")
          history["valor_cuota"] = pd.to_numeric(history["valor_cuota"], errors="coerce")
          history = history.dropna().sort_values("fecha").drop_duplicates("fecha", keep="last")
          latest = json.loads(Path("public/data/latest.json").read_text(encoding="utf-8"))

          last = history.iloc[-1]
          assert last["fecha"] >= pd.Timestamp("2026-07-30"), last
          assert latest["latest_sbs_date"] == last["fecha"].strftime("%Y-%m-%d")
          assert abs(float(latest["latest_sbs_vc"]) - float(last["valor_cuota"])) < 1e-9
          assert int(latest["window"]) == 90
          assert latest["model"] == "OLS rolling 90"
          print(f"Último VC Profuturo: {last['fecha']:%Y-%m-%d} · {last['valor_cuota']:.7f}")
          PY

      - name: Guardar actualización de Profuturo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rolling90 public
          git reset public/data/live_market.json || true
          if git diff --cached --quiet; then
            echo "No hay cambios de Profuturo para confirmar."
          else
            git commit -m "Actualizar Profuturo Fondo 3 independiente"
            git pull --rebase origin migracion-github-actions
            git push origin HEAD:migracion-github-actions
          fi

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir sitio completo
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Publicar visor
        id: deployment
        uses: actions/deploy-pages@v4
