name: Forzar visor dual con histórico completo

on:
  workflow_dispatch:
  push:
    branches:
      - migracion-github-actions
    paths:
      - ".github/workflows/force-dual-history-view.yml"
      - "scripts/embed_dual_history.py"
      - "public/data/dual_history_fix_v2.js"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-ui-fondo3
  cancel-in-progress: false

jobs:
  rebuild-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: migracion-github-actions
          fetch-depth: 0

      - name: Incorporar histórico comparable completo
        run: |
          python scripts/embed_dual_history.py

      - name: Activar runtime histórico V2
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('public/index.html')
          html=p.read_text(encoding='utf-8')
          tag='<script src="data/dual_history_fix_v2.js?rev=DUALHISTV2"></script>'
          if tag not in html:
              html=html.replace('</body>',tag+'\n</body>',1)
          p.write_text(html,encoding='utf-8')
          PY

      - name: Validar histórico, botones y tickers
        run: |
          node --check public/data/dual_history_fix_v2.js
          python - <<'PY'
          import json
          from datetime import date, timedelta
          from pathlib import Path

          d=json.loads(Path('public/data/dual_rolling30_monitor.json').read_text(encoding='utf-8'))
          qa=d['models']['qqq']['history_one_step']
          nb=d['models']['new_tickers']['history_one_step']
          assert len(qa) >= 70, len(qa)
          assert len(nb) >= 70, len(nb)
          assert len(qa) == len(nb), (len(qa),len(nb))
          assert qa[0]['fecha'] <= '2026-04-20'
          assert qa[-1]['fecha'] >= '2026-08-19'

          expected_a={'SPY','EEM','EPU','MCHI','USD_PEN','QQQ'}
          expected_b={'.INX','CPER','EEM','NDX','SPBLSCUP','USD/PEN'}
          got_a={str(x.get('serie')) for x in d['models']['qqq'].get('intraday_assets',[])}
          got_b={str(x.get('serie')) for x in d['models']['new_tickers'].get('intraday_assets',[])}
          assert got_a == expected_a, (got_a,expected_a)
          assert got_b == expected_b, (got_b,expected_b)

          def merged_dates(model):
              dates={str(x['fecha'])[:10] for x in model.get('history_one_step',[]) if x.get('fecha')}
              dates.update(str(x['fecha'])[:10] for x in model.get('history_operational',[]) if x.get('fecha'))
              dates.update(str(x['fecha'])[:10] for x in model.get('forward_chain',[]) if x.get('fecha'))
              return sorted(dates)

          def range_counts(model):
              dates=merged_dates(model)
              last=date.fromisoformat(dates[-1])
              out={}
              for days in (7,15,30,90):
                  cutoff=last-timedelta(days=days)
                  out[str(days)]=sum(date.fromisoformat(x)>=cutoff for x in dates)
              out['all']=len(dates)
              vals=[out['7'],out['15'],out['30'],out['90'],out['all']]
              assert vals[0] < vals[1] < vals[2] < vals[3] <= vals[4], vals
              return out

          counts_a=range_counts(d['models']['qqq'])
          counts_b=range_counts(d['models']['new_tickers'])
          assert counts_a == counts_b, (counts_a,counts_b)

          js=Path('public/data/dual_history_fix_v2.js').read_text(encoding='utf-8')
          for token in ("7/15/30/90/Todo", "dualMarket_", "history_chart_meta", "stopImmediatePropagation"):
              assert token in js, token
          html=Path('public/index.html').read_text(encoding='utf-8')
          assert 'dual_history_fix_v2.js?rev=DUALHISTV2' in html
          print('VERIFICADO HISTORICO',len(qa),len(nb),qa[0]['fecha'],qa[-1]['fecha'])
          print('VERIFICADO RANGOS',counts_a)
          print('VERIFICADO TICKERS A',sorted(got_a))
          print('VERIFICADO TICKERS B',sorted(got_b))
          PY

      - name: Guardar histórico e integración en la rama
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/dual_rolling30_monitor.json public/index.html
          if git diff --cached --quiet; then
            echo "Histórico e index ya estaban actualizados."
          else
            git commit -m "Publicar histórico completo en visor dual"
            git pull --rebase origin migracion-github-actions
            git push origin HEAD:migracion-github-actions
          fi

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir visor verificado
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Publicar visor verificado
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Registrar verificación final
        if: success()
        env:
          DEPLOY_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin migracion-github-actions
          git reset --hard origin/migracion-github-actions
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone, date, timedelta
          from pathlib import Path

          d=json.loads(Path('public/data/dual_rolling30_monitor.json').read_text(encoding='utf-8'))
          q=d['models']['qqq']['history_one_step']; n=d['models']['new_tickers']['history_one_step']

          def merged_dates(model):
              dates={str(x['fecha'])[:10] for x in model.get('history_one_step',[]) if x.get('fecha')}
              dates.update(str(x['fecha'])[:10] for x in model.get('history_operational',[]) if x.get('fecha'))
              dates.update(str(x['fecha'])[:10] for x in model.get('forward_chain',[]) if x.get('fecha'))
              return sorted(dates)

          def range_counts(model):
              dates=merged_dates(model); last=date.fromisoformat(dates[-1]); out={}
              for days in (7,15,30,90):
                  cutoff=last-timedelta(days=days)
                  out[str(days)]=sum(date.fromisoformat(x)>=cutoff for x in dates)
              out['all']=len(dates)
              return out

          out={
            'verified_at_utc':datetime.now(timezone.utc).isoformat(),
            'page_url':os.environ.get('DEPLOY_URL'),
            'history_qqq':len(q),
            'history_new_tickers':len(n),
            'history_start':q[0]['fecha'],
            'history_end':q[-1]['fecha'],
            'range_counts_qqq':range_counts(d['models']['qqq']),
            'range_counts_new_tickers':range_counts(d['models']['new_tickers']),
            'tickers_qqq':[str(x.get('serie')) for x in d['models']['qqq'].get('intraday_assets',[])],
            'tickers_new_tickers':[str(x.get('serie')) for x in d['models']['new_tickers'].get('intraday_assets',[])],
            'runtime':'DUALHISTV2'
          }
          Path('public/data/dual_history_deploy_verified.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False))
          PY
          git add public/data/dual_history_deploy_verified.json
          git commit -m "Registrar verificación visor dual histórico" || true
          git pull --rebase origin migracion-github-actions || true
          git push origin HEAD:migracion-github-actions || true

