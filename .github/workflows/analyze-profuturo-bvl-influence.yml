name: Analizar influencia BVL Profuturo

on:
  push:
    branches:
      - migracion-github-actions
    paths:
      - "scripts/analyze_bvl_influence_profuturo.py"
      - ".github/workflows/analyze-profuturo-bvl-influence.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: analyze-profuturo-bvl-influence
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migracion-github-actions
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance
      - name: Ejecutar prueba BVL
        run: python scripts/analyze_bvl_influence_profuturo.py
      - name: Guardar resultado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189822+github-actions[bot]@users.noreply.github.com"
          git add analysis/profuturo_bvl_influence.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Actualizar análisis influencia BVL Profuturo"
            git pull --rebase origin migracion-github-actions
            git push origin HEAD:migracion-github-actions
          fi
