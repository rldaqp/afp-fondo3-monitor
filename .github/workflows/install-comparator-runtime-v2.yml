name: Instalar runtime comparador v2

on:
  workflow_dispatch:
  push:
    branches:
      - migracion-github-actions
    paths:
      - "public/comparador-fondos/comparator_runtime_v2.js"
      - "scripts/ensure_comparator_runtime.py"
      - ".github/workflows/install-comparator-runtime-v2.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: comparator-runtime-v2
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: migracion-github-actions
          fetch-depth: 0

      - name: Instalar runtime y validar
        run: |
          python scripts/ensure_dual_trade_runtime.py
          python scripts/ensure_comparator_runtime.py
          grep -q 'comparator_runtime_v2.js?rev=CMPV2-20260829' public/comparador-fondos/index.html
          grep -q 'comparador_fondo3_last_query_v2' public/comparador-fondos/comparator_runtime_v2.js
          grep -q 'Operaciones en Drive' public/comparador-fondos/comparator_runtime_v2.js
          grep -q 'fondo3_drive_sync_key_v1' public/comparador-fondos/comparator_runtime_v2.js

      - name: Guardar instalación en rama
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/comparador-fondos/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Fijar runtime v2 del comparador"
            git push origin HEAD:migracion-github-actions
          fi

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Publicar Pages
        id: deployment
        uses: actions/deploy-pages@v4
