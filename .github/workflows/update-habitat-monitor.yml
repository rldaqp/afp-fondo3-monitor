name: Actualizar AFP Hábitat Fondo 3

on:
  workflow_dispatch:
  push:
    branches:
      - migracion-github-actions
    paths:
      - ".github/workflows/update-habitat-monitor.yml"
      - "scripts/run_habitat_exact_pipeline.py"
      - "scripts/run_habitat_exact_pipeline_stable_ui.py"
      - "scripts/update_habitat_live_market.py"
      - "scripts/habitat_complete_official_calendar.py"
      - "scripts/validate_habitat_official.py"
      - "scripts/build_habitat_fixed_levels_returns_monitor.py"
      - "scripts/build_habitat_fixed_models_intraday.py"
      - "scripts/validate_habitat_fixed_models.py"
      - "scripts/build_fixed_levels_returns_monitor.py"
      - "scripts/fixed_market_quotes.py"
      - "data/fixed_models/spblscup_levels_2026.csv"
      - "public/habitat/index.html"
  schedule:
    - cron: "20 5-23 * * 1-5"
    - cron: "20 0-4 * * 2-6"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: habitat-fondo3-data-writes-v3
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: migracion-github-actions
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install exchange-calendars beautifulsoup4 lxml

      - name: Actualizar serie oficial Hábitat y fuentes base
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          python scripts/run_habitat_exact_pipeline_stable_ui.py
          python scripts/update_habitat_live_market.py
          # El pipeline histórico puede regenerar la UI antigua. Se restaura
          # deliberadamente el visor fijo niveles/retornos comprometido en Git.
          git restore public/habitat/index.html

      - name: Validar serie SBS Hábitat
        run: |
          python scripts/validate_habitat_official.py
          PYTHONPATH=scripts python -c "from habitat_complete_official_calendar import validate_official_estimate_calendar; validate_official_estimate_calendar()"
          test -s data/rolling90/sbs_habitat_f3.csv
          python - <<'PY'
          import pandas as pd
          p='data/rolling90/sbs_habitat_f3.csv'
          d=pd.read_csv(p)
          d['fecha']=pd.to_datetime(d['fecha'], errors='coerce')
          d['valor_cuota']=pd.to_numeric(d['valor_cuota'], errors='coerce')
          d=d.dropna(subset=['fecha','valor_cuota']).sort_values('fecha')
          assert len(d)>30
          assert not d['fecha'].duplicated().any()
          assert float(d.iloc[-1]['valor_cuota'])>0
          print('SBS Hábitat válido:', d.iloc[-1]['fecha'].date(), d.iloc[-1]['valor_cuota'])
          PY

      - name: Construir Hábitat con la misma lógica de Profuturo
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          python scripts/build_habitat_fixed_levels_returns_monitor.py
          python scripts/build_habitat_fixed_models_intraday.py
          python scripts/validate_habitat_fixed_models.py

      - name: Verificar paridad del visor
        run: |
          test -s public/habitat/data/fixed_models_2026.json
          test -s public/habitat/data/fixed_models_intraday.json
          test -s public/habitat/data/fixed_models_2026.csv
          grep -q "Hábitat Fondo 3 · Niveles vs Retornos" public/habitat/index.html
          grep -q "Modelo de niveles" public/habitat/index.html
          grep -q "Modelo de retornos" public/habitat/index.html
          grep -q "data/fixed_models_2026.json" public/habitat/index.html
          grep -q "data/fixed_models_intraday.json" public/habitat/index.html
          ! grep -q "Modelo A · Rolling 30" public/habitat/index.html
          ! grep -q "Modelo B · Rolling 30" public/habitat/index.html
          python - <<'PY'
          import json
          from pathlib import Path
          b=json.loads(Path('public/habitat/data/fixed_models_2026.json').read_text(encoding='utf-8'))
          l=json.loads(Path('public/habitat/data/fixed_models_intraday.json').read_text(encoding='utf-8'))
          assert b['fund']=='HÁBITAT Fondo 3'
          assert list(b['models'])==['niveles','retornos']
          assert b['factors']==['SPY','EEM','MCHI','QQQ','SPBLSCUP']
          assert l['fund']=='HÁBITAT Fondo 3'
          assert l['total_factors']==5
          assert len({x['ticker'] for x in l['tickers']})==5
          print('Paridad Hábitat OK:', l['signal_date'], l['fresh_factors'], '/5')
          PY

      - name: Guardar resultados de Hábitat
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189824+github-actions[bot]@users.noreply.github.com"
          git add \
            data/rolling90 \
            data/fixed_models/spblscup_levels_2026.csv \
            public/habitat
          if git diff --cached --quiet; then
            echo "No hay cambios de Hábitat para confirmar."
          else
            git commit -m "Actualizar Hábitat Fondo 3 niveles retornos"
            PUSHED=0
            for attempt in 1 2 3; do
              if git push origin HEAD:migracion-github-actions; then
                PUSHED=1
                break
              fi
              echo "Rama ocupada; reintento Hábitat ${attempt}/3..."
              git fetch origin migracion-github-actions
              if ! git rebase origin/migracion-github-actions; then
                git rebase --abort || true
                git reset --hard origin/migracion-github-actions
                break
              fi
              sleep 2
            done
            if [ "$PUSHED" -ne 1 ]; then
              echo "El siguiente ciclo reintentará la persistencia de datos."
            fi
          fi

      - name: Actualizar rama antes de publicar
        run: |
          git fetch origin migracion-github-actions
          git reset --hard origin/migracion-github-actions
          test -s public/index.html
          test -s public/habitat/index.html
          test -s public/habitat/data/fixed_models_2026.json
          test -s public/habitat/data/fixed_models_intraday.json
          grep -q "Profuturo Fondo 3" public/index.html
          grep -q "Hábitat Fondo 3" public/habitat/index.html
          grep -q "Modelo de niveles" public/habitat/index.html
          grep -q "Modelo de retornos" public/habitat/index.html

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir sitio completo a Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Publicar visor
        id: deployment
        uses: actions/deploy-pages@v4
