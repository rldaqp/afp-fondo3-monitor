name: Actualizar AFP Hábitat Fondo 3

on:
  workflow_dispatch:
  push:
    branches:
      - migracion-github-actions
    paths:
      - ".github/workflows/update-habitat-monitor.yml"
      - "scripts/run_habitat_exact_pipeline.py"
      - "scripts/run_habitat_exact_pipeline_stable_ui.py"
      - "scripts/update_habitat_live_market.py"
      - "scripts/habitat_complete_official_calendar.py"
      - "scripts/build_habitat_exact_parity.py"
      - "scripts/build_habitat_profuturo_parity.py"
      - "scripts/build_habitat_qqq_incremental_challenger.py"
      - "scripts/postprocess_habitat_qqq_incremental_ui.py"
      - "scripts/postprocess_habitat_weight_charts.py"
      - "scripts/build_habitat_dual_rolling30_monitor.py"
      - "scripts/postprocess_habitat_dual_from_profuturo.py"
      - "scripts/build_qqq_incremental_challenger.py"
      - "scripts/enrich_habitat_daily_sbs.py"
      - "scripts/postprocess_habitat_chart_clarity.py"
      - "scripts/postprocess_live_consistency.py"
      - "scripts/postprocess_habitat_sbs_indicators.py"
      - "scripts/postprocess_trade_cloud_fund_routing.py"
      - "scripts/postprocess_trade_runtime_fixes.py"
      - "scripts/validate_habitat_official.py"
      - "scripts/ensure_dual_trade_runtime.py"
      - "scripts/finalize_notebook_parity_v4.py"
      - "scripts/finalize_notebook_parity_v5.py"
      - "scripts/finalize_fx_hybrid.py"
      - "requirements.txt"
  schedule:
    - cron: "20 5-23 * * 1-5"
    - cron: "20 0-4 * * 2-6"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: fondo3-data-writes
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: migracion-github-actions
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generar base Hábitat y actualizar SBS/mercado
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          python scripts/run_habitat_exact_pipeline_stable_ui.py
          python scripts/update_habitat_live_market.py
          python scripts/build_habitat_qqq_incremental_challenger.py
          python scripts/postprocess_live_consistency.py
          python scripts/postprocess_trade_runtime_fixes.py habitat
          python scripts/postprocess_habitat_qqq_incremental_ui.py
          python scripts/postprocess_habitat_weight_charts.py

      - name: Validar base y fuentes de Hábitat antes de migrar UI
        run: |
          python scripts/validate_habitat_official.py
          PYTHONPATH=scripts python -c "from habitat_complete_official_calendar import validate_official_estimate_calendar; validate_official_estimate_calendar()"
          test -s public/habitat/data/live_market.json
          test -s public/habitat/data/latest.json
          python - <<'PY'
          import json
          from pathlib import Path
          latest=json.loads(Path('public/habitat/data/latest.json').read_text(encoding='utf-8'))
          live=json.loads(Path('public/habitat/data/live_market.json').read_text(encoding='utf-8'))
          assert float(latest['latest_sbs_vc']) > 0
          assert live.get('signal_date')
          print('Base Hábitat válida:', latest['latest_sbs_date'], latest['latest_sbs_vc'], live['signal_date'])
          PY

      - name: Construir modelos A y B Rolling 30 de Hábitat
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          python scripts/build_habitat_dual_rolling30_monitor.py
          python scripts/postprocess_habitat_dual_from_profuturo.py
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('public/habitat/data/dual_rolling30_monitor.json').read_text(encoding='utf-8'))
          assert d['fund']=='HÁBITAT Fondo 3'
          assert float(d['latest_sbs']['vc']) > 0
          assert set(d['models'])=={'qqq','new_tickers'}
          a=d['models']['qqq']; b=d['models']['new_tickers']
          assert a['features_display']==['SPY','EEM','EPU','MCHI','USD/PEN','QQQ']
          assert b['features_display']==['.INX','CPER','EEM','NDX','SPBLSCUP','USD/PEN']
          assert int(a['current']['train_n'])==30
          assert int(b['current']['train_n'])==30
          assert len(a['current']['coefficients'])==7
          assert len(b['current']['coefficients'])==7
          html=Path('public/habitat/index.html').read_text(encoding='utf-8')
          assert 'Modelo A · Rolling 30 + QQQ' in html
          assert 'Modelo B · Rolling 30 + nuevos tickers' in html
          assert 'Último VC SBS oficial' in html
          assert 'data/dual_rolling30_monitor.json' in html
          assert 'Pesos de los factores' in html or 'FACTOR_WEIGHT' in html
          print('Hábitat dual Rolling30 validado. SBS:', d['latest_sbs'])
          print('A:', a['current']['vc_estimated'], a['current']['signal'])
          print('B:', b['current']['vc_estimated'], b['current']['signal'])
          PY
          node --check public/habitat/data/dual_trade_runtime_v1.js

      - name: Guardar resultados de Hábitat
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rolling90 public/habitat
          if git diff --cached --quiet; then
            echo "No hay cambios de Hábitat para confirmar."
          else
            git commit -m "Actualizar Hábitat Fondo 3 con modelos A B Rolling30"
            PUSHED=0
            for attempt in 1 2 3; do
              if git push origin HEAD:migracion-github-actions; then
                PUSHED=1
                break
              fi
              echo "Rama ocupada; reintento Hábitat ${attempt}/3..."
              git reset --hard HEAD
              git clean -fd
              if ! git pull --rebase origin migracion-github-actions; then
                git rebase --abort || true
              fi
              sleep 2
            done
            if [ "$PUSHED" -ne 1 ]; then
              echo "Push Hábitat pendiente; el próximo ciclo reintentará sin generar fallo por carrera de escritura."
            fi
          fi

      - name: Actualizar rama y preservar operaciones Profuturo
        run: |
          git fetch origin migracion-github-actions
          git reset --hard origin/migracion-github-actions
          python scripts/ensure_dual_trade_runtime.py

      - name: Verificar ambos visores duales antes de publicar
        run: |
          test -s public/index.html
          test -s public/data/dual_rolling30_monitor.json
          test -s public/data/dual_trade_runtime_v1.js
          grep -q "Dos modelos Rolling 30" public/index.html
          grep -q "dual_rolling30_monitor.json" public/index.html
          grep -q "Conectar Drive" public/data/dual_trade_runtime_v1.js
          ! grep -q "OLS OFICIAL · ROLLING 90" public/index.html
          test -s public/habitat/index.html
          test -s public/habitat/data/dual_rolling30_monitor.json
          test -s public/habitat/data/dual_trade_runtime_v1.js
          grep -q "Hábitat Fondo 3" public/habitat/index.html
          grep -q "Modelo A · Rolling 30 + QQQ" public/habitat/index.html
          grep -q "Modelo B · Rolling 30 + nuevos tickers" public/habitat/index.html
          grep -q "dual_rolling30_monitor.json" public/habitat/index.html
          grep -q "const FUND='HABITAT';" public/habitat/data/dual_trade_runtime_v1.js
          grep -q "habitat_fondo3_trade_history_v3" public/habitat/data/dual_trade_runtime_v1.js
          ! grep -q "OLS OFICIAL · ROLLING 90" public/habitat/index.html

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir sitio completo a Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Publicar visor
        id: deployment
        uses: actions/deploy-pages@v4
