name: Actualizar AFP Hábitat Fondo 3

on:
  workflow_dispatch:
  push:
    branches:
      - migracion-github-actions
    paths:
      - ".github/workflows/update-habitat-monitor.yml"
      - "scripts/run_habitat_exact_pipeline.py"
      - "scripts/habitat_complete_official_calendar.py"
      - "scripts/build_habitat_exact_parity.py"
      - "scripts/build_habitat_profuturo_parity.py"
      - "scripts/enrich_habitat_daily_sbs.py"
      - "scripts/postprocess_habitat_chart_clarity.py"
      - "scripts/postprocess_habitat_sbs_indicators.py"
      - "scripts/validate_habitat_official.py"
      - "scripts/finalize_notebook_parity_v4.py"
      - "scripts/finalize_notebook_parity_v5.py"
      - "scripts/finalize_fx_hybrid.py"
      - "requirements.txt"
  schedule:
    - cron: "20 5-23 * * 1-5"
    - cron: "20 0-4 * * 2-6"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: habitat-fondo3-monitor
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generar Hábitat con VC SBS oficiales y OLS rolling 90
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          python scripts/run_habitat_exact_pipeline.py

      - name: Validar histórico oficial, OLS y visor
        run: |
          python scripts/validate_habitat_official.py
          PYTHONPATH=scripts python -c "from habitat_complete_official_calendar import validate_official_estimate_calendar; validate_official_estimate_calendar()"

      - name: Guardar resultados de Hábitat
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rolling90/sbs_habitat_f3.csv data/rolling90/sbs_habitat_f3_daily.csv public/habitat
          if git diff --cached --quiet; then
            echo "No hay cambios de Hábitat para confirmar."
          else
            git commit -m "Actualizar AFP Hábitat Fondo 3 con SBS oficial y OLS"
            git pull --rebase origin migracion-github-actions
            git push origin HEAD:migracion-github-actions
          fi

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir sitio completo a Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Publicar visor
        id: deployment
        uses: actions/deploy-pages@v4
