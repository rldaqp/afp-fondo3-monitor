name: Actualizar AFP Hábitat Fondo 3

on:
  workflow_dispatch:
  push:
    branches:
      - migracion-github-actions
    paths:
      - ".github/workflows/update-habitat-monitor.yml"
      - "scripts/build_habitat_monitor.py"
      - "scripts/run_habitat_statsnet.py"
      - "requirements.txt"
  schedule:
    - cron: "20 5-23 * * 1-5"
    - cron: "20 0-4 * * 2-6"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: habitat-fondo3-monitor
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Descargar histórico SBS y generar visor Hábitat
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          python scripts/run_habitat_statsnet.py

      - name: Validar visor independiente
        run: |
          test -s data/rolling90/sbs_habitat_f3.csv
          test -s public/habitat/index.html
          test -s public/habitat/data/latest.json
          test -s public/habitat/data/series.json
          test -s public/habitat/data/signals.json
          test -s public/habitat/data/model_insights.json
          grep -q "Hábitat Fondo 3" public/habitat/index.html
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          history = pd.read_csv("data/rolling90/sbs_habitat_f3.csv")
          latest = json.loads(Path("public/habitat/data/latest.json").read_text(encoding="utf-8"))
          series = json.loads(Path("public/habitat/data/series.json").read_text(encoding="utf-8"))
          insights = json.loads(Path("public/habitat/data/model_insights.json").read_text(encoding="utf-8"))

          assert len(history) >= 90, len(history)
          assert history["fecha"].is_unique
          assert pd.to_numeric(history["valor_cuota"], errors="coerce").gt(0).all()
          assert latest["afp"] == "Hábitat"
          assert int(latest["fund"]) == 3
          assert int(latest["training_n"]) == 90
          assert float(latest["latest_sbs_vc"]) > 0
          assert len(series) >= 90
          assert int(insights["quality"]["training_n"]) == 90
          print(f"Registros SBS Hábitat: {len(history)}")
          print(json.dumps(latest, ensure_ascii=False, indent=2))
          PY

      - name: Guardar resultados de Hábitat
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rolling90/sbs_habitat_f3.csv public/habitat
          if git diff --cached --quiet; then
            echo "No hay cambios de Hábitat para confirmar."
          else
            git commit -m "Actualizar AFP Hábitat Fondo 3"
            git pull --rebase origin migracion-github-actions
            git push origin HEAD:migracion-github-actions
          fi

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir sitio completo a Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Publicar visor
        id: deployment
        uses: actions/deploy-pages@v4
