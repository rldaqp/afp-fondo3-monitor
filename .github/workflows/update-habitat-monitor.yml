name: Actualizar AFP Hábitat Fondo 3

on:
  workflow_dispatch:
  push:
    branches:
      - migracion-github-actions
    paths:
      - ".github/workflows/update-habitat-monitor.yml"
      - "scripts/run_habitat_exact_pipeline.py"
      - "scripts/run_habitat_exact_pipeline_stable_ui.py"
      - "scripts/update_habitat_live_market.py"
      - "scripts/habitat_complete_official_calendar.py"
      - "scripts/build_habitat_exact_parity.py"
      - "scripts/build_habitat_profuturo_parity.py"
      - "scripts/build_habitat_qqq_incremental_challenger.py"
      - "scripts/postprocess_habitat_qqq_incremental_ui.py"
      - "scripts/build_qqq_incremental_challenger.py"
      - "scripts/enrich_habitat_daily_sbs.py"
      - "scripts/postprocess_habitat_chart_clarity.py"
      - "scripts/postprocess_live_consistency.py"
      - "scripts/postprocess_habitat_sbs_indicators.py"
      - "scripts/postprocess_trade_cloud_fund_routing.py"
      - "scripts/postprocess_trade_runtime_fixes.py"
      - "scripts/validate_habitat_official.py"
      - "scripts/finalize_notebook_parity_v4.py"
      - "scripts/finalize_notebook_parity_v5.py"
      - "scripts/finalize_fx_hybrid.py"
      - "requirements.txt"
  schedule:
    - cron: "20 5-23 * * 1-5"
    - cron: "20 0-4 * * 2-6"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: fondo3-data-writes
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: migracion-github-actions
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generar Hábitat con VC SBS oficiales y OLS rolling 90
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          # Hábitat ya no regenera su HTML tomando como plantilla el visor de
          # Profuturo, porque Profuturo ahora tiene una interfaz dual Rolling 30.
          # Se conserva el HTML Hábitat validado y se actualizan sus datos propios.
          python scripts/run_habitat_exact_pipeline_stable_ui.py
          python scripts/update_habitat_live_market.py
          python scripts/build_habitat_qqq_incremental_challenger.py
          python scripts/postprocess_live_consistency.py
          python scripts/postprocess_trade_runtime_fixes.py habitat
          python scripts/postprocess_habitat_qqq_incremental_ui.py

      - name: Validar histórico oficial OLS visor QQQ y Drive
        run: |
          python scripts/validate_habitat_official.py
          PYTHONPATH=scripts python -c "from habitat_complete_official_calendar import validate_official_estimate_calendar; validate_official_estimate_calendar()"
          grep -q "HABITAT_CHART_OFFICIAL_VS_OLS_V6" public/habitat/index.html
          grep -q "const FUND='HABITAT';" public/habitat/index.html
          grep -q "const DRIVE_SHEET='Habitat';" public/habitat/index.html
          grep -q "const KEY='habitat_fondo3_trade_history_v3';" public/habitat/index.html
          grep -q "const TRADE_KEY='habitat_fondo3_trade_history_v3';" public/habitat/index.html
          grep -q "const SNAP_KEY='habitat_fondo3_drive_sync_snapshot_v3';" public/habitat/index.html
          grep -q "const LEGACY_KEYS=\[\];" public/habitat/index.html
          grep -q "const ORIGIN='VISOR GITHUB · HABITAT';" public/habitat/index.html
          grep -q "u.searchParams.set('fund',FUND);" public/habitat/index.html
          grep -q "TRADE_CLOUD_FUND_ROUTING_V3" public/habitat/index.html
          grep -q "fondo3-local-trade-change" public/habitat/index.html
          grep -q "AKfycbxoYHkCu0cZPx_KsMlI0Jd5PEATgxBjZTR8oK8qs1cUjRHJbiK0t-bxkH5ACprgp81S7g" public/habitat/index.html
          grep -q "fuente:'PENDIENTE'" public/habitat/index.html
          ! grep -q "No existe una fecha efectiva de entrada en la línea del monitor." public/habitat/index.html
          grep -q "raw.githubusercontent.com/rldaqp/afp-fondo3-monitor/migracion-github-actions/public/habitat/data/live_market.json" public/habitat/index.html
          test -s public/habitat/data/qqq_incremental_challenger.json
          grep -q "QQQ INCREMENTAL · CHALLENGER" public/habitat/index.html
          grep -q "HABITAT_QQQ_INCREMENTAL_PANEL_V1" public/habitat/index.html
          ! grep -q "SPY_QQQ_CHALLENGER_PANEL START" public/habitat/index.html
          ! grep -q "Mercado USA · SPY vs Nasdaq QQQ" public/habitat/index.html
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          html = Path('public/habitat/index.html').read_text(encoding='utf-8')
          for script_id in ('tradeHistoryScript', 'tradeCloudScript'):
              m = re.search(rf'<script id="{script_id}">(.*?)</script>', html, re.S)
              assert m, script_id
              Path(f'/tmp/{script_id}.js').write_text(m.group(1), encoding='utf-8')
          assert "});$('tradeMsg').textContent='Operación guardada y sincronizada con Drive.'});" not in html

          hab = json.loads(Path('public/habitat/data/live_market.json').read_text(encoding='utf-8'))
          qqq = json.loads(Path('public/habitat/data/qqq_incremental_challenger.json').read_text(encoding='utf-8'))
          assert qqq['signal_date'] == hab['signal_date']
          assert qqq['official']['signal'] == hab['signal']
          assert abs(float(qqq['official']['return_estimated']) - float(hab['return_estimated'])) < 1e-12
          assert abs(float(qqq['official']['vc_estimated']) - float(hab['vc_estimated'])) < 1e-10
          assert abs(float(qqq['vc_base']) * (1.0 + float(qqq['official']['return_estimated'])) - float(qqq['official']['vc_estimated'])) < 1e-8
          assert int(qqq['training']['n']) == 90

          prof = json.loads(Path('public/data/live_market.json').read_text(encoding='utf-8'))
          if str(prof.get('mode','')).startswith('INTRAD'):
              assert str(hab.get('mode','')).startswith('INTRAD'), (prof.get('mode'), hab.get('mode'))
              assert hab.get('signal_date') == prof.get('signal_date')
              p = {x['serie']: x for x in prof.get('assets', [])}
              h = {x['serie']: x for x in hab.get('assets', [])}
              for serie in ('SPY','NEM','FCX','EPU','MCHI','EEM','USD_PEN'):
                  assert serie in p and serie in h, serie
                  if p[serie].get('precio_actual') is not None and h[serie].get('precio_actual') is not None:
                      assert abs(float(p[serie]['precio_actual']) - float(h[serie]['precio_actual'])) < 1e-9, serie
                  assert abs(float(p[serie]['retorno_modelo']) - float(h[serie]['retorno_modelo'])) < 1e-12, serie
          PY
          node --check /tmp/tradeHistoryScript.js
          node --check /tmp/tradeCloudScript.js

      - name: Guardar resultados de Hábitat
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rolling90 public/habitat
          if git diff --cached --quiet; then
            echo "No hay cambios de Hábitat para confirmar."
          else
            git commit -m "Actualizar AFP Hábitat Fondo 3 con SBS oficial y QQQ incremental"
            PUSHED=0
            for attempt in 1 2 3; do
              if git push origin HEAD:migracion-github-actions; then
                PUSHED=1
                break
              fi
              echo "Rama ocupada; reintento Hábitat ${attempt}/3..."
              git reset --hard HEAD
              git clean -fd
              if ! git pull --rebase origin migracion-github-actions; then
                git rebase --abort || true
              fi
              sleep 2
            done
            if [ "$PUSHED" -ne 1 ]; then
              echo "Push Hábitat pendiente; el próximo ciclo reintentará sin generar fallo por carrera de escritura."
            fi
          fi

      - name: Actualizar rama antes de publicar
        run: |
          git fetch origin migracion-github-actions
          git reset --hard origin/migracion-github-actions

      - name: Verificar visor dual Profuturo sin modificarlo
        run: |
          test -s public/index.html
          test -s public/data/dual_rolling30_monitor.json
          grep -q "Dos modelos Rolling 30" public/index.html
          grep -q "dual_rolling30_monitor.json" public/index.html
          ! grep -q "OLS OFICIAL · ROLLING 90" public/index.html

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir sitio completo a Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Publicar visor
        id: deployment
        uses: actions/deploy-pages@v4
