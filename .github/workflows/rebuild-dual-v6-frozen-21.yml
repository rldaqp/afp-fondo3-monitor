name: Reconstruir dual V6 con corte 21 congelado

on:
  push:
    branches: [migracion-github-actions]
    paths:
      - ".github/workflows/rebuild-dual-v6-frozen-21.yml"
  pull_request:
    branches: [migracion-github-actions]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: fondo3-data-writes
  cancel-in-progress: true

jobs:
  rebuild-frozen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migracion-github-actions
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-live.txt
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements-live.txt
      - name: Verificar y reconstruir con snapshot 21/08
        env:
          PYTHONUTF8: '1'
          PYTHONIOENCODING: 'utf-8'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin migracion-github-actions
          git reset --hard origin/migracion-github-actions

          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('public/data/live_market.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d['signal_date']=='2026-08-21', d['signal_date']
          assert len(d.get('experimental_assets',[]))>=6
          print('SNAPSHOT CONGELADO OK',d['signal_date'],d['mode'])
          PY

          python scripts/sync_sbs_official_latest.py
          python scripts/apply_sbs_reference_corrections.py
          # No se recalcula live_market: se usa exactamente el corte válido del 21/08.
          python scripts/build_dual_rolling30_monitor.py
          python scripts/patch_dual_rolling30_fx_operational.py
          python scripts/persist_dual_rolling30_shadow.py

          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('public/data/dual_rolling30_monitor.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d['signal_date']=='2026-08-21',d['signal_date']
          assert d['latest_sbs']['fecha']=='2026-08-19',d['latest_sbs']
          assert set(d['models'])=={'qqq','new_tickers'}
          for k in ('qqq','new_tickers'):
              h=d['models'][k]['history_one_step']
              assert len(h)>=70,(k,len(h))
              assert all(int(r.get('horizon_sessions',1))==1 for r in h),k
              assert len(d['models'][k]['intraday_assets'])==6,k
              assert not any(str(r.get('validation','')).upper().startswith('BACKTEST CIEGO 3') for r in h),k
          def fx(k,n):
              return next(a for a in d['models'][k]['intraday_assets'] if str(a.get('serie'))==n)
          a=fx('qqq','USD_PEN'); b=fx('new_tickers','USD/PEN')
          ar=float(a.get('retorno_modelo',a.get('retorno'))); br=float(b.get('retorno_modelo',b.get('retorno')))
          av=float(a['precio_actual']); bv=float(b['precio_actual'])
          assert abs(ar-br)<1e-12,(ar,br)
          assert abs(av-bv)<1e-9,(av,bv)
          d['history_chart_meta']={
            'source':'ROLLING30 ONE-STEP DIARIO',
            'horizon_sessions':1,
            'note':'Serie diaria: cada estimación histórica parte del VC SBS de la sesión inmediatamente anterior. Blind3 se conserva solo como métrica agregada.'
          }
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2),encoding='utf-8')
          print('V6 FINAL OK')
          print('A',d['models']['qqq']['current']['vc_estimated'],d['models']['qqq']['current']['return_estimated'])
          print('B',d['models']['new_tickers']['current']['vc_estimated'],d['models']['new_tickers']['current']['return_estimated'])
          print('FX',av,ar)
          PY

          git add data/rolling90/sbs_profuturo_f3.csv data/rolling90/dual_rolling30_shadow.csv public/data/sbs_sync_status.json public/data/dual_rolling30_monitor.json
          git commit -m 'Publicar V6 diario con corte válido 21 y FX común' || true
          git pull --rebase origin migracion-github-actions || true
          git push origin HEAD:migracion-github-actions

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Publicar Pages final
        id: deployment
        uses: actions/deploy-pages@v4
