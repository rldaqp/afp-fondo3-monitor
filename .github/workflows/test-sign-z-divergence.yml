name: Probar divergencias signo mas Z
on:
  workflow_dispatch:
  push:
    branches: [migracion-github-actions]
    paths:
      - 'scripts/test_sign_z_divergence.py'
      - '.github/workflows/test-sign-z-divergence.yml'
jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: migracion-github-actions
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: pip install pandas numpy
      - name: Ejecutar prueba
        run: python scripts/test_sign_z_divergence.py
      - name: Guardar resultados
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/sign_z_divergence_test.json analysis/sign_z_divergence_days.csv
          git diff --cached --quiet || git commit -m 'Guardar prueba signos y magnitud'
          git push origin HEAD:migracion-github-actions
