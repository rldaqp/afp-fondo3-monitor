name: Comparar Profuturo SPY vs QQQ por ventanas

on:
  workflow_dispatch:
  push:
    branches:
      - migracion-github-actions
    paths:
      - ".github/workflows/compare-profuturo-spy-qqq-windows.yml"
      - "scripts/compare_profuturo_spy_qqq_windows.py"
      - "data/rolling90/markets.csv"
      - "data/rolling90/sbs_profuturo_f3.csv"

permissions:
  contents: write

concurrency:
  group: compare-profuturo-spy-qqq-windows
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: migracion-github-actions
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Comparar SPY y QQQ en ventanas recientes
        run: python scripts/compare_profuturo_spy_qqq_windows.py

      - name: Validar resultado
        run: |
          test -s data/rolling90/profuturo_spy_qqq_windows.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('data/rolling90/profuturo_spy_qqq_windows.json').read_text(encoding='utf-8'))
          assert p['fund']=='PROFUTURO'
          for h in ('30','60','90','180'):
              assert p['windows'][h]['SPY']['n']==int(h)
              assert p['windows'][h]['QQQ']['n']==int(h)
          print(json.dumps(p['stability'], ensure_ascii=False, indent=2))
          PY

      - name: Guardar análisis
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rolling90/profuturo_spy_qqq_windows.json
          if git diff --cached --quiet; then
            echo "Sin cambios en la prueba."
          else
            git commit -m "Actualizar prueba Profuturo SPY vs QQQ por ventanas"
            git pull --rebase origin migracion-github-actions
            git push origin HEAD:migracion-github-actions
          fi
