name: Comparar Profuturo SPBLSCUP últimos 30

on:
  push:
    branches:
      - migracion-github-actions
    paths:
      - "scripts/compare_profuturo_variant_spblscup_last30.py"
      - ".github/workflows/compare-profuturo-spblscup-last30.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: compare-profuturo-spblscup-last30
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migracion-github-actions
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests yfinance
      - name: Ejecutar comparación
        run: python scripts/compare_profuturo_variant_spblscup_last30.py
      - name: Guardar resultado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/compare_profuturo_variant_spblscup_last30.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Actualizar comparación Profuturo SPBLSCUP últimos 30"
            git pull --rebase origin migracion-github-actions
            git push origin HEAD:migracion-github-actions
          fi
