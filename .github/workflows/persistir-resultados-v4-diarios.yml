name: Persistir resultados V4 diarios

on:
  push:
    branches:
      - modelo-salida-60-20-20
    paths:
      - ".github/workflows/persistir-resultados-v4-diarios.yml"

permissions:
  contents: write

jobs:
  persistir:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar rama experimental
        uses: actions/checkout@v4
        with:
          ref: modelo-salida-60-20-20

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install tabulate

      - name: Generar resultados completos
        run: |
          python src/modelo_salida/00_ejecutar_constructor_seguro.py
          python src/modelo_salida/06_modelo_selectivo_diario_v4.py
          python src/modelo_salida/07_walk_forward_selectivo_diario_v4.py

      - name: Guardar resultados reproducibles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            data/processed/modelo_salida/v4_resumen.csv \
            data/processed/modelo_salida/v4_candidatos_validacion.csv \
            data/processed/modelo_salida/v4_evidencia_zonas_rebote.csv \
            data/processed/modelo_salida/v4_predicciones_test_diarias.csv \
            data/processed/modelo_salida/v4_manifiesto.json \
            data/processed/modelo_salida/v4_walk_forward_predicciones_diarias.csv \
            data/processed/modelo_salida/v4_walk_forward_resumen.csv \
            data/processed/modelo_salida/v4_walk_forward_estabilidad.csv \
            data/processed/modelo_salida/v4_walk_forward_manifiesto.json \
            docs/modelo_salida_resultados_v4.md \
            docs/modelo_salida_resultados_v4_walk_forward.md
          if git diff --cached --quiet; then
            echo "Los resultados ya estaban guardados."
          else
            git commit -m "Persistir resultados reproducibles de la V4 diaria [skip ci]"
            git push
          fi
