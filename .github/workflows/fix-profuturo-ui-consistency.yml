name: Publicar Profuturo alineado

on:
  workflow_dispatch:
  push:
    branches:
      - migracion-github-actions
    paths:
      - ".github/workflows/fix-profuturo-ui-consistency.yml"
      - "scripts/patch_profuturo_retbase.py"
      - "scripts/complete_profuturo_20260828.py"
      - "public/index.html"
      - "public/data/fixed_trade_runtime_v1.js"
      - "public/data/fixed_models_2026.json"
      - "public/data/fixed_models_2026.csv"
      - "public/data/fixed_models_intraday.json"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publish-profuturo-aligned
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Descargar rama más reciente
        uses: actions/checkout@v4
        with:
          ref: migracion-github-actions

      - name: Completar serie 28 y 31 de agosto
        run: python scripts/complete_profuturo_20260828.py

      - name: Alinear bases diarias de ambos modelos
        run: python scripts/patch_profuturo_retbase.py

      - name: Persistir correcciones de Profuturo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html public/data/fixed_models_2026.json public/data/fixed_models_2026.csv
          if git diff --cached --quiet; then
            echo "Las correcciones ya estaban persistidas."
          else
            git commit -m "Completar serie Profuturo 28-31 agosto [skip ci]"
            git pull --rebase origin migracion-github-actions
            git push origin HEAD:migracion-github-actions
          fi

      - name: Validar serie y visor Profuturo
        run: |
          python - <<'PY'
          import json
          d=json.load(open('public/data/fixed_models_2026.json',encoding='utf-8'))
          r={x['fecha']:x for x in d['rows']}
          a=r['2026-08-28']; b=r['2026-08-31']
          for k in ('SPY','EEM','MCHI','QQQ','SPBLSCUP','vc_niveles','ret_vc_estimado','vc_retornos'):
              assert a[k] is not None, (k,a)
          assert b['ret_vc_estimado'] is not None
          assert b['vc_retornos'] is not None
          assert abs(a['vc_niveles']-71.43020083593653) < 1e-8
          assert abs(a['vc_retornos']-71.74441588181759) < 1e-8
          assert abs(b['vc_retornos']-71.70330290547179) < 1e-8
          print('Serie 28/08 y 31/08 validada.')
          PY
          grep -q "Modelo de niveles" public/index.html
          grep -q "Modelo de retornos" public/index.html
          grep -q "Variación vs. cierre anterior" public/index.html
          grep -q "Retorno diario · niveles vs retornos vs SBS" public/index.html
          grep -q "levelsR2" public/index.html
          grep -q "returnsR2" public/index.html
          grep -q "liveLevelBase" public/index.html
          grep -q "price_previous" public/index.html
          grep -q "retBase=finite(LIVE?.models?.retornos?.base_vc)" public/index.html
          grep -q "fixed_trade_runtime_v1.js" public/index.html
          grep -q "profuturo_fondo3_trade_history_v3" public/data/fixed_trade_runtime_v1.js
          grep -q "fondo3-local-trade-change" public/data/fixed_trade_runtime_v1.js
          grep -q "const FUND='PROFUTURO'" public/data/fixed_trade_runtime_v1.js

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir sitio completo
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
