name: Analizar Ridge y QQQ residualizado Profuturo

on:
  push:
    branches:
      - migracion-github-actions
    paths:
      - "scripts/analyze_profuturo_qqq_stability.py"
      - ".github/workflows/analyze-profuturo-qqq-stability.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profuturo-qqq-stability
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: migracion-github-actions

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar diagnóstico
        run: python scripts/analyze_profuturo_qqq_stability.py

      - name: Guardar artefacto diagnóstico
        uses: actions/upload-artifact@v4
        with:
          name: profuturo-qqq-stability
          path: analysis/qqq_ridge_residualized_profuturo.json
          retention-days: 30
