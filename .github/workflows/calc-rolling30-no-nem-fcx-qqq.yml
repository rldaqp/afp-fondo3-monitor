name: Calcular rolling 30 sin NEM FCX con QQQ

on:
  workflow_dispatch:
  push:
    branches:
      - migracion-github-actions
    paths:
      - ".github/workflows/calc-rolling30-no-nem-fcx-qqq.yml"
      - "scripts/build_rolling30_no_nem_fcx_qqq.py"
      - "data/rolling90/markets.csv"
      - "data/rolling90/sbs_profuturo_f3.csv"
      - "public/data/live_market.json"
      - "public/data/reduced_6030_challenger.json"

permissions:
  contents: write

concurrency:
  group: rolling30-no-nem-fcx-qqq
  cancel-in-progress: true

jobs:
  calculate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: migracion-github-actions
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance

      - name: Calcular rolling 30
        run: python scripts/build_rolling30_no_nem_fcx_qqq.py

      - name: Guardar resultado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/rolling30_no_nem_fcx_qqq.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Actualizar rolling 30 sin NEM FCX con QQQ"
            git pull --rebase origin migracion-github-actions
            git push origin HEAD:migracion-github-actions
          fi
