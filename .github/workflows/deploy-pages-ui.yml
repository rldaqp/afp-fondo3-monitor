name: Publicar visor móvil Fondo 3

on:
  workflow_dispatch:
  push:
    branches:
      - migracion-github-actions
    paths:
      - ".github/workflows/deploy-pages-ui.yml"
      - "public/index.html"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-ui-fondo3
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: migracion-github-actions

      - name: Reparar tarjeta SBS en el artefacto
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("public/index.html")
          html = path.read_text(encoding="utf-8")
          marker = "SBS_TOP_CARD_DEPLOY_FIX_V2"
          if marker not in html:
              script = r'''
          <!-- SBS_TOP_CARD_DEPLOY_FIX_V2 -->
          <script>
          (function(){
            'use strict';
            const $=id=>document.getElementById(id);
            const fmt=d=>{if(!d)return '—';const p=String(d).slice(0,10).split('-');return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:String(d)};
            function paint(l){
              if(!l)return;
              const v=Number(l.latest_sbs_vc),sv=$('sbsVc'),sd=$('sbsDate'),sw=$('window');
              if(sv)sv.textContent=Number.isFinite(v)?v.toFixed(7):'—';
              if(sd)sd.textContent=fmt(l.latest_sbs_date);
              if(sw)sw.textContent=`${fmt(l.training_start)} → ${fmt(l.training_end)}`;
            }
            function load(){
              fetch('data/latest.json?ts='+Date.now(),{cache:'no-store'})
                .then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})
                .then(paint)
                .catch(()=>{});
            }
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',load,{once:true});else load();
            setTimeout(load,600);
            setTimeout(load,1800);
          })();
          </script>
          '''
              html = html.replace("</body>", script + "\n</body>", 1)
              path.write_text(html, encoding="utf-8")
          PY

      - name: Inyectar nuevos tickers 60/30 en el artefacto
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          index = Path("public/index.html")
          live_path = Path("public/data/live_market.json")
          html = index.read_text(encoding="utf-8")
          live = json.loads(live_path.read_text(encoding="utf-8"))
          assert live.get("experimental_assets"), "live_market.json no contiene experimental_assets"

          marker = "EXPERIMENTAL_6030_DEPLOY_PANEL_V1"
          if marker not in html:
              panel = r'''
          <!-- EXPERIMENTAL_6030_DEPLOY_PANEL_V1 -->
          <section class="panel" id="marketExperimentalPanel">
            <div class="market-head">
              <div>
                <div class="chart-title">Nuevos tickers 60/30</div>
                <div class="market-mode" style="color:#93c5fd">EXPERIMENTAL · SEGUIMIENTO</div>
              </div>
              <div class="market-time">.INX · CPER · EEM · NDX · SPBLSCUP · USD/PEN</div>
            </div>
            <div id="marketExperimentalGrid" class="market-grid"></div>
            <div class="note" style="margin-top:9px">Seguimiento del nuevo 60/30. Estos tickers no reemplazan todavía al OLS principal ni al challenger vigente.</div>
          </section>
          '''
              audit = '<section class="panel"><b>Auditoría</b>'
              if audit in html:
                  html = html.replace(audit, panel + audit, 1)
              else:
                  html = html.replace('</main>', panel + '</main>', 1)

              script = r'''
          <script id="experimental6030DeployScript">
          (function(){
            'use strict';
            const wanted=['.INX','CPER','EEM','NDX','SPBLSCUP','USD/PEN'];
            const cls=x=>Number(x)>0?'pos':Number(x)<0?'neg':'zero';
            const price=a=>{
              if(a.precio_actual===null||a.precio_actual===undefined||!Number.isFinite(Number(a.precio_actual)))return '—';
              return Number(a.precio_actual).toFixed(a.serie==='USD/PEN'?4:2);
            };
            const ret=a=>{
              if(a.retorno===null||a.retorno===undefined||!Number.isFinite(Number(a.retorno)))return '<span class="zero">—</span>';
              const n=Number(a.retorno);
              return `<span class="${cls(n)}">${n>=0?'+':''}${(n*100).toFixed(2)}%</span>`;
            };
            function render(rows){
              const el=document.getElementById('marketExperimentalGrid');
              if(!el)return;
              const by=new Map((Array.isArray(rows)?rows:[]).map(x=>[x.serie,x]));
              el.innerHTML=wanted.map(name=>{
                const a=by.get(name)||{serie:name,precio_actual:null,retorno:null,estado:'Dato pendiente'};
                return `<div class="market-item"><div class="market-symbol">${a.serie}</div><div class="market-price">${price(a)}</div><div class="market-ret">${ret(a)}</div><div class="market-source">${a.estado||'Seguimiento experimental'}</div></div>`;
              }).join('');
            }
            function load(){
              fetch('data/live_market.json?exp6030='+Date.now(),{cache:'no-store'})
                .then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})
                .then(d=>render(d.experimental_assets))
                .catch(()=>render([]));
            }
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',load,{once:true});else load();
            setTimeout(load,800);
            setInterval(load,60000);
          })();
          </script>
          '''
              html = html.replace('</body>', script + '\n</body>', 1)
              index.write_text(html, encoding="utf-8")
          PY

      - name: Inyectar tercer modelo en comparación de VC
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path("public/index.html")
          html = index.read_text(encoding="utf-8")
          marker = "ALT_6030_COMPARE_DEPLOY_V1"
          if marker not in html:
              html = html.replace(
                  "OLS oficial vs Challenger 60/30 · sin NEM ni FCX + QQQ · cadena ciega sin reanclaje SBS dentro del bloque",
                  "OLS oficial vs dos modelos 60/30 · cadenas ciegas sin reanclaje SBS dentro del bloque",
                  1,
              )
              html = html.replace(
                  ".r6030-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}",
                  ".r6030-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}",
                  1,
              )
              html = html.replace(
                  ".r6030-grid{grid-template-columns:1fr 1fr}",
                  ".r6030-grid{grid-template-columns:1fr}",
                  1,
              )
              third_card = r'''
              <!-- ALT_6030_COMPARE_DEPLOY_V1 -->
              <div class="r6030-card" id="r6030AltCard" style="border-color:#3b82f6">
                <div class="r6030-label">60/30 NUEVOS TICKERS · EXPERIMENTAL</div>
                <div id="r6030AltSignal" class="r6030-signal">CARGANDO…</div>
                <div id="r6030AltVc" class="r6030-vc">VC —</div>
                <div id="r6030AltRet" class="r6030-ret">Retorno —</div>
                <div class="r6030-note">.INX · CPER · EEM · NDX · SPBLSCUP · USD/PEN</div>
              </div>
          '''
              needle = '  </div>\n  <div class="r6030-strip">'
              if needle not in html:
                  raise RuntimeError("No se encontró la grilla de comparación 60/30")
              html = html.replace(needle, third_card + '  </div>\n  <div class="r6030-strip">', 1)

              alt_date = '<div id="r6030AltDateResult" class="r6030-history-result" style="color:#93c5fd"></div>'
              date_needle = '<div id="r6030DateResult" class="r6030-history-result">Elige una fecha para comparar VC estimado, VC SBS y error.</div>'
              if date_needle in html:
                  html = html.replace(date_needle, date_needle + alt_date, 1)

              html = html.replace(
                  'El OLS rolling 90 continúa siendo oficial. El 60/30 es el único challenger y se contrasta en sombra contra SBS.',
                  'El OLS rolling 90 continúa siendo oficial. Se muestran en paralelo el challenger 60/30 vigente y el 60/30 experimental con nuevos tickers.',
                  1,
              )

              script = r'''
          <script id="alt6030CompareScript">
          (function(){
            'use strict';
            const $=id=>document.getElementById(id);
            const vc=x=>x==null||!Number.isFinite(Number(x))?'—':Number(x).toFixed(7);
            const pct=x=>x==null||!Number.isFinite(Number(x))?'—':(Number(x)*100).toFixed(3)+'%';
            const fmt=d=>{if(!d)return '—';const p=String(d).slice(0,10).split('-');return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:String(d)};
            const cls=s=>s==='SUBE'?'up':s==='BAJA'?'down':'flat';
            let altData=null,currentData=null;
            function renderDate(){
              const input=$('r6030Date'),box=$('r6030AltDateResult');if(!input||!box||!altData)return;
              const date=input.value;
              const op=(altData.operational_history||[]).find(x=>x.fecha===date);
              const hist=((altData.backtest_exact20||{}).rows||[]).find(x=>x.fecha===date);
              const r=op||hist;
              if(!r){box.textContent='Nuevos tickers: no hay observación para esa fecha.';return;}
              const actual=r.actual_vc;
              box.textContent=`Nuevos tickers 60/30 · VC ${vc(r.vc)} · retorno ${pct(r.return)}${actual!=null?' · SBS real '+vc(actual)+' · error '+Math.abs(Number(r.vc)-Number(actual)).toFixed(4):' · SBS real pendiente'}`;
            }
            function paint(){
              if(!altData)return;
              const m=altData.model||{},signal=m.signal||'—';
              const s=$('r6030AltSignal'),v=$('r6030AltVc'),r=$('r6030AltRet');
              if(s){s.textContent=signal;s.className='r6030-signal '+cls(signal)}
              if(v)v.textContent='VC '+vc(m.vc_estimated);
              if(r)r.textContent='Retorno '+pct(m.return_estimated);
              if(currentData){
                const sigs=[currentData.official&&currentData.official.signal,currentData.challenger&&currentData.challenger.signal,signal].filter(Boolean);
                const badge=$('r6030Badge');
                if(badge&&sigs.length===3)badge.textContent=(new Set(sigs).size===1)?'3 MODELOS · MISMA SEÑAL':'3 MODELOS · SEÑALES DISTINTAS';
              }
              renderDate();
            }
            function load(){
              Promise.all([
                fetch('data/alt_6030_experimental.json?ts='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('ALT '+r.status);return r.json()}),
                fetch('data/reduced_6030_challenger.json?ts='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null).catch(()=>null)
              ]).then(([a,c])=>{altData=a;currentData=c;paint();}).catch(()=>{
                const s=$('r6030AltSignal');if(s){s.textContent='DATOS EN PROCESO';s.className='r6030-signal flat'}
              });
            }
            const btn=$('r6030DateBtn'),input=$('r6030Date');
            if(btn)btn.addEventListener('click',()=>setTimeout(renderDate,0));
            if(input)input.addEventListener('change',renderDate);
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',load,{once:true});else load();
            setTimeout(load,1500);setInterval(load,60000);
          })();
          </script>
          '''
              html = html.replace('</body>', script + '\n</body>', 1)
              index.write_text(html, encoding="utf-8")
          PY

      - name: Validar visores y datos
        run: |
          test -s public/index.html
          test -s public/data/latest.json
          test -s public/data/series.json
          test -s public/data/signals.json
          test -s public/data/operation_series.json
          test -s public/data/live_market.json
          test -s public/data/reduced_6030_challenger.json
          test -s public/data/reduced_6030_history.json
          test -s public/habitat/index.html
          test -s public/habitat/data/live_market.json
          grep -q "Mercado ahora" public/index.html
          grep -q "60/30 SIN NEM-FCX + QQQ · CHALLENGER" public/index.html
          grep -q "60/30 NUEVOS TICKERS · EXPERIMENTAL" public/index.html
          grep -q "ALT_6030_COMPARE_DEPLOY_V1" public/index.html
          grep -q "Ver Challenger 60/30 en otra fecha" public/index.html
          grep -q "SBS_TOP_CARD_DEPLOY_FIX_V2" public/index.html
          grep -q "EXPERIMENTAL_6030_DEPLOY_PANEL_V1" public/index.html
          grep -q "Nuevos tickers 60/30" public/index.html
          grep -q '"experimental_assets"' public/data/live_market.json
          grep -q "raw.githubusercontent.com/rldaqp/afp-fondo3-monitor" public/index.html
          grep -q "raw.githubusercontent.com/rldaqp/afp-fondo3-monitor" public/habitat/index.html

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir visor
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Publicar visor
        id: deployment
        uses: actions/deploy-pages@v4
