name: Publicar visor dual Rolling 30

on:
  workflow_dispatch:
  push:
    branches:
      - migracion-github-actions
    paths:
      - ".github/workflows/deploy-pages-ui.yml"
      - "public/index.html"
      - "public/data/dual_trade_runtime_v1.js"
      - "scripts/ensure_dual_trade_runtime.py"

# Los datos de mercado cambian cada 5 minutos y se publican por la vía rápida
# del updater dual. No disparan un despliegue completo + Playwright en cada corte.
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-ui-fondo3
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: migracion-github-actions
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fijar operaciones y Drive en el visor dual
        run: python scripts/ensure_dual_trade_runtime.py

      - name: Validar visor antes de publicar
        run: |
          set -e
          test -s public/index.html
          test -s public/data/dual_rolling30_monitor.json
          test -s public/data/dual_trade_runtime_v1.js
          grep -q 'id="dualTakeoverV4"' public/index.html
          grep -q 'dual_trade_runtime_v1.js' public/index.html
          grep -q 'Registrar operación' public/data/dual_trade_runtime_v1.js
          grep -q 'Conectar Drive' public/data/dual_trade_runtime_v1.js
          grep -q 'profuturo_fondo3_trade_history_v3' public/data/dual_trade_runtime_v1.js
          grep -q 'fondo3_drive_sync_key_v1' public/data/dual_trade_runtime_v1.js
          grep -q 'const entryBase=finite(r.entry_sbs_vc)' public/data/dual_trade_runtime_v1.js
          ! grep -q 'OLS OFICIAL · ROLLING 90' public/index.html
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('public/data/dual_rolling30_monitor.json').read_text(encoding='utf-8'))
          assert set(d['models']) == {'qqq','new_tickers'}
          assert float(d['latest_sbs']['vc']) > 0
          for k in ('qqq','new_tickers'):
              m=d['models'][k]
              assert len(m.get('intraday_assets',[])) == 6, (k,len(m.get('intraday_assets',[])))
              assert float(m['current']['vc_estimated']) > 0
          print('Visor dual + operaciones + Drive OK')
          PY

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir visor
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Publicar visor
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Esperar propagación
        run: sleep 20

      - name: Instalar Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Verificar visor público dinámicamente
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          node <<'JS'
          const {chromium}=require('playwright');
          const fs=require('fs');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1440,height:1000}});
            const errs=[];
            page.on('pageerror',e=>errs.push(String(e)));
            const root=(process.env.PAGE_URL||'https://rldaqp.github.io/afp-fondo3-monitor/').replace(/\/?$/,'/');
            const r=await page.goto(root+'?verify='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForSelector('#dualTakeoverV4',{state:'visible',timeout:30000});
            await page.waitForFunction(()=>document.querySelector('#dSbs')?.textContent?.trim() && document.querySelector('#dSbs').textContent.trim()!=='—',{timeout:30000});
            await page.waitForSelector('#dualTradePanel',{state:'visible',timeout:30000});
            if(await page.locator('[data-trademode]').count()!==3) throw Error('Faltan modos de operación');
            if(await page.locator('#tradeSave').count()!==1) throw Error('Falta Registrar operación');
            if(await page.locator('#tradeCloudConnect').count()!==1) throw Error('Falta Conectar Drive');

            const db=await page.evaluate(async()=>fetch('data/dual_rolling30_monitor.json?x='+Date.now(),{cache:'no-store'}).then(r=>r.json()));
            const entry=String(db.latest_sbs.fecha).slice(0,10);
            const valuation=String(db.signal_date).slice(0,10);
            await page.locator('[data-trademode="inside"]').click();
            await page.locator('#tradeModel').selectOption('qqq');
            await page.locator('#tradeEntry').fill(entry);
            await page.locator('#tradeCapital').fill('25000');
            await page.locator('#tradeCalc').click();
            const calcRet=(await page.locator('#tradeMRet').textContent()).trim();
            const calcGain=(await page.locator('#tradeMGain').textContent()).trim();
            if(calcRet==='—'||calcGain==='—') throw Error('Cálculo de operación vacío');

            const cloudText=(await page.locator('#tradeCloudStatus').textContent()).trim();
            if(!cloudText) throw Error('Estado Drive vacío');
            if(errs.length) throw Error('Errores JS: '+errs.join(' | '));

            const out={checked_at_utc:new Date().toISOString(),url:root,http:r.status(),sbs:(await page.locator('#dSbs').textContent()).trim(),entry,valuation,operation_ui:true,drive_ui:true,cloud_status:cloudText,operation_test:{capital:25000,return:calcRet,gain:calcGain,status:'PASS'},status:'PASS_DYNAMIC_DUAL_TRADE'};
            fs.writeFileSync('/tmp/pages_ui_verified.json',JSON.stringify(out,null,2));
            console.log(JSON.stringify(out,null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS

      - name: Registrar verificación
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin migracion-github-actions
          git reset --hard origin/migracion-github-actions
          cp /tmp/pages_ui_verified.json public/data/pages_ui_verified.json
          git add public/data/pages_ui_verified.json
          git commit -m "Registrar visor dual con operaciones y Drive activos" || true
          git pull --rebase origin migracion-github-actions || true
          git push origin HEAD:migracion-github-actions || true
