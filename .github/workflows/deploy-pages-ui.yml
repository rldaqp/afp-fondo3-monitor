name: Publicar visor móvil Fondo 3

on:
  workflow_dispatch:
  push:
    branches:
      - migracion-github-actions
    paths:
      - ".github/workflows/deploy-pages-ui.yml"
      - "public/index.html"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-ui-fondo3
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: migracion-github-actions

      - name: Reparar tarjeta SBS en el artefacto
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("public/index.html")
          html = path.read_text(encoding="utf-8")
          marker = "SBS_TOP_CARD_DEPLOY_FIX_V2"
          if marker not in html:
              script = r'''
          <!-- SBS_TOP_CARD_DEPLOY_FIX_V2 -->
          <script>
          (function(){
            'use strict';
            const $=id=>document.getElementById(id);
            const fmt=d=>{if(!d)return '—';const p=String(d).slice(0,10).split('-');return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:String(d)};
            function paint(l){
              if(!l)return;
              const v=Number(l.latest_sbs_vc),sv=$('sbsVc'),sd=$('sbsDate'),sw=$('window');
              if(sv)sv.textContent=Number.isFinite(v)?v.toFixed(7):'—';
              if(sd)sd.textContent=fmt(l.latest_sbs_date);
              if(sw)sw.textContent=`${fmt(l.training_start)} → ${fmt(l.training_end)}`;
            }
            function load(){
              fetch('data/latest.json?ts='+Date.now(),{cache:'no-store'})
                .then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})
                .then(paint)
                .catch(()=>{});
            }
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',load,{once:true});else load();
            setTimeout(load,600);
            setTimeout(load,1800);
          })();
          </script>
          '''
              html = html.replace("</body>", script + "\n</body>", 1)
              path.write_text(html, encoding="utf-8")
          PY

      - name: Inyectar nuevos tickers 60/30 en el artefacto
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          index = Path("public/index.html")
          live_path = Path("public/data/live_market.json")
          html = index.read_text(encoding="utf-8")
          live = json.loads(live_path.read_text(encoding="utf-8"))
          assert live.get("experimental_assets"), "live_market.json no contiene experimental_assets"

          marker = "EXPERIMENTAL_6030_DEPLOY_PANEL_V1"
          if marker not in html:
              panel = r'''
          <!-- EXPERIMENTAL_6030_DEPLOY_PANEL_V1 -->
          <section class="panel" id="marketExperimentalPanel">
            <div class="market-head">
              <div>
                <div class="chart-title">Nuevos tickers 60/30</div>
                <div class="market-mode" style="color:#93c5fd">EXPERIMENTAL · SEGUIMIENTO</div>
              </div>
              <div class="market-time">.INX · CPER · EEM · NDX · SPBLSCUP · USD/PEN</div>
            </div>
            <div id="marketExperimentalGrid" class="market-grid"></div>
            <div class="note" style="margin-top:9px">Seguimiento del nuevo 60/30. Estos tickers no reemplazan todavía al OLS principal ni al challenger vigente.</div>
          </section>
          '''
              audit = '<section class="panel"><b>Auditoría</b>'
              if audit in html:
                  html = html.replace(audit, panel + audit, 1)
              else:
                  html = html.replace('</main>', panel + '</main>', 1)

              script = r'''
          <script id="experimental6030DeployScript">
          (function(){
            'use strict';
            const wanted=['.INX','CPER','EEM','NDX','SPBLSCUP','USD/PEN'];
            const cls=x=>Number(x)>0?'pos':Number(x)<0?'neg':'zero';
            const price=a=>{
              if(a.precio_actual===null||a.precio_actual===undefined||!Number.isFinite(Number(a.precio_actual)))return '—';
              return Number(a.precio_actual).toFixed(a.serie==='USD/PEN'?4:2);
            };
            const ret=a=>{
              if(a.retorno===null||a.retorno===undefined||!Number.isFinite(Number(a.retorno)))return '<span class="zero">—</span>';
              const n=Number(a.retorno);
              return `<span class="${cls(n)}">${n>=0?'+':''}${(n*100).toFixed(2)}%</span>`;
            };
            function render(rows){
              const el=document.getElementById('marketExperimentalGrid');
              if(!el)return;
              const by=new Map((Array.isArray(rows)?rows:[]).map(x=>[x.serie,x]));
              el.innerHTML=wanted.map(name=>{
                const a=by.get(name)||{serie:name,precio_actual:null,retorno:null,estado:'Dato pendiente'};
                return `<div class="market-item"><div class="market-symbol">${a.serie}</div><div class="market-price">${price(a)}</div><div class="market-ret">${ret(a)}</div><div class="market-source">${a.estado||'Seguimiento experimental'}</div></div>`;
              }).join('');
            }
            function load(){
              fetch('data/live_market.json?exp6030='+Date.now(),{cache:'no-store'})
                .then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})
                .then(d=>render(d.experimental_assets))
                .catch(()=>render([]));
            }
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',load,{once:true});else load();
            setTimeout(load,800);
            setInterval(load,60000);
          })();
          </script>
          '''
              html = html.replace('</body>', script + '\n</body>', 1)
              index.write_text(html, encoding="utf-8")
          PY

      - name: Validar visores y datos
        run: |
          test -s public/index.html
          test -s public/data/latest.json
          test -s public/data/series.json
          test -s public/data/signals.json
          test -s public/data/operation_series.json
          test -s public/data/live_market.json
          test -s public/data/reduced_6030_challenger.json
          test -s public/data/reduced_6030_history.json
          test -s public/habitat/index.html
          test -s public/habitat/data/live_market.json
          grep -q "Mercado ahora" public/index.html
          grep -q "60/30 SIN NEM-FCX + QQQ · CHALLENGER" public/index.html
          grep -q "Ver Challenger 60/30 en otra fecha" public/index.html
          grep -q "SBS_TOP_CARD_DEPLOY_FIX_V2" public/index.html
          grep -q "EXPERIMENTAL_6030_DEPLOY_PANEL_V1" public/index.html
          grep -q "Nuevos tickers 60/30" public/index.html
          grep -q '"experimental_assets"' public/data/live_market.json
          grep -q "raw.githubusercontent.com/rldaqp/afp-fondo3-monitor" public/index.html
          grep -q "raw.githubusercontent.com/rldaqp/afp-fondo3-monitor" public/habitat/index.html

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir visor
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Publicar visor
        id: deployment
        uses: actions/deploy-pages@v4
