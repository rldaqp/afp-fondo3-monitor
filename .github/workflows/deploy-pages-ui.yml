name: Publicar visor móvil Fondo 3

on:
  workflow_dispatch:
  push:
    branches:
      - migracion-github-actions
    paths:
      - "public/**"
      - ".github/workflows/deploy-pages-ui.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-ui-fondo3
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar visor estable de un solo origen
        run: |
          test -s public/index.html
          test -s public/data/latest.json
          test -s public/data/series.json
          test -s public/data/signals.json
          test -s public/data/operation_series.json
          test -s public/data/live_market.json
          python - <<'PY'
          from pathlib import Path
          p = Path('public/index.html')
          html = p.read_text(encoding='utf-8')
          raw = 'https://raw.githubusercontent.com/rldaqp/afp-fondo3-monitor/migracion-github-actions/public/data/live_market.json'
          html = html.replace(raw + "?ts='+Date.now()", "data/live_market.json?ts='+Date.now()")
          html = html.replace(raw, 'data/live_market.json')
          p.write_text(html, encoding='utf-8')
          PY
          grep -q "Mercado ahora" public/index.html
          grep -q "data/live_market.json" public/index.html

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir visor
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Publicar visor
        id: deployment
        uses: actions/deploy-pages@v4
