name: Publicar visor móvil Fondo 3

on:
  workflow_dispatch:
  push:
    branches:
      - migracion-github-actions
    paths:
      - ".github/workflows/deploy-pages-ui.yml"
      - "public/index.html"
      - "public/data/alt_runtime_v5.js"
      - "public/data/spblscup_stale_fix.js"
      - "public/data/visor_hotfix_v1.js"
      - "public/data/audit_runtime_v1.js"
      - "public/data/dual_rolling30_runtime_v1.js"
      - "public/data/dual_rolling30_shadow_runtime_v1.js"
      - "public/data/dual_rolling30_monitor.json"
      - "public/data/live_market.json"
      - "public/data/alt_6030_experimental.json"
      - "public/data/reduced_6030_challenger.json"
      - "public/data/latest.json"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-ui-fondo3
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: migracion-github-actions
          fetch-depth: 0

      - name: Preparar visor sin recalcular modelos
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('public/index.html')
          html = path.read_text(encoding='utf-8')
          tags = [
              '<script src="data/alt_runtime_v5.js?rev=ALT6030V5"></script>',
              '<script src="data/spblscup_stale_fix.js?rev=SPBLCLOSEV1"></script>',
              '<script src="data/visor_hotfix_v1.js?rev=VISORHOTFIX1"></script>',
              '<script src="data/audit_runtime_v1.js?rev=AUDITV1"></script>',
              '<script src="data/dual_rolling30_runtime_v1.js?rev=DUALROLL30V1"></script>',
              '<script src="data/dual_rolling30_shadow_runtime_v1.js?rev=DUALSHADOWV1"></script>',
          ]
          for tag in tags:
              if tag not in html:
                  html = html.replace('</body>', tag + '\n</body>', 1)
          path.write_text(html, encoding='utf-8')
          PY

      - name: Validar datos necesarios
        run: |
          test -s public/index.html
          test -s public/data/alt_runtime_v5.js
          test -s public/data/spblscup_stale_fix.js
          test -s public/data/visor_hotfix_v1.js
          test -s public/data/audit_runtime_v1.js
          test -s public/data/dual_rolling30_runtime_v1.js
          test -s public/data/dual_rolling30_shadow_runtime_v1.js
          test -s public/data/dual_rolling30_monitor.json
          test -s public/data/live_market.json
          test -s public/data/alt_6030_experimental.json
          test -s public/data/reduced_6030_challenger.json
          test -s public/data/latest.json
          grep -q "dual_rolling30_runtime_v1.js" public/index.html
          grep -q "dual_rolling30_shadow_runtime_v1.js" public/index.html
          grep -q '"models"' public/data/dual_rolling30_monitor.json
          grep -q '"qqq"' public/data/dual_rolling30_monitor.json
          grep -q '"new_tickers"' public/data/dual_rolling30_monitor.json
          grep -q "Dos modelos en seguimiento" public/data/dual_rolling30_runtime_v1.js
          grep -q "sin ajuste retroactivo" public/data/dual_rolling30_shadow_runtime_v1.js

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir visor
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Publicar visor
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Registrar despliegue verificado
        if: success()
        env:
          DEPLOY_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin migracion-github-actions
          git reset --hard origin/migracion-github-actions
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          p=Path('public/data/pages_deploy_verified.json')
          p.write_text(json.dumps({
            'runtime':'DUALROLL30V1+DUALSHADOWV1+ALT6030V5+VISORHOTFIX1+AUDITV1',
            'deployed_at_utc':datetime.now(timezone.utc).isoformat(),
            'commit':os.environ.get('GITHUB_SHA'),
            'page_url':os.environ.get('DEPLOY_URL')
          },ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          git add public/data/pages_deploy_verified.json
          git commit -m "Registrar despliegue Pages dual rolling30" || true
          git push origin HEAD:migracion-github-actions || true
