name: Publicar visor dual Rolling 30

on:
  workflow_dispatch:
  push:
    branches:
      - migracion-github-actions
    paths:
      - ".github/workflows/deploy-pages-ui.yml"
      - "public/index.html"
      - "public/data/dual_rolling30_monitor.json"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-ui-fondo3
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: migracion-github-actions
          fetch-depth: 0

      - name: Validar visor dual standalone V4
        run: |
          set -e
          test -s public/index.html
          test -s public/data/dual_rolling30_monitor.json
          grep -q 'id="dualTakeoverV4"' public/index.html
          grep -q 'Modelo A · Rolling 30 + QQQ' public/index.html
          grep -q 'Modelo B · Rolling 30 + nuevos tickers' public/index.html
          grep -q 'tickerbar_qqq' public/index.html
          grep -q 'tickerbar_new_tickers' public/index.html
          ! grep -q 'OLS OFICIAL · ROLLING 90' public/index.html
          ! grep -q '60/30 SIN NEM-FCX' public/index.html
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('public/data/dual_rolling30_monitor.json').read_text(encoding='utf-8'))
          assert d['latest_sbs']['vc'] > 0
          for k in ('qqq','new_tickers'):
              m=d['models'][k]
              assert len(m.get('history_one_step',[])) >= 70, (k,len(m.get('history_one_step',[])))
              assert len(m.get('intraday_assets',[])) == 6, (k,len(m.get('intraday_assets',[])))
              assert m['current']['vc_estimated'] > 0
              for r in m.get('forward_chain',[]):
                  if r['fecha'] > d['latest_sbs']['fecha']:
                      assert r.get('actual_vc') is None, (k,r)
          print('Datos duales y pendientes SBS OK')
          PY

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir visor
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Publicar visor
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Esperar propagación
        run: sleep 25

      - name: Instalar Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Verificar visor público con Chromium
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          node <<'JS'
          const { chromium } = require('playwright');
          const fs=require('fs');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1440,height:1100}});
            const errs=[];
            page.on('pageerror',e=>errs.push(String(e)));
            page.on('console',m=>{if(m.type()==='error') errs.push(m.text())});
            const root=(process.env.PAGE_URL||'https://rldaqp.github.io/afp-fondo3-monitor/').replace(/\/?$/,'/');
            const url=root+'?liveverify='+Date.now();
            const r=await page.goto(url,{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForSelector('#dualTakeoverV4',{state:'visible',timeout:30000});
            await page.waitForFunction(()=>document.querySelector('#dSbs')?.textContent?.trim() && document.querySelector('#dSbs')?.textContent?.trim()!=='—',{timeout:30000});
            await page.waitForFunction(()=>document.querySelectorAll('#tickerbar_qqq .tickerchip').length===6 && document.querySelectorAll('#tickerbar_new_tickers .tickerchip').length===6,{timeout:30000});
            const txt=async s=>(await page.locator(s).textContent()).trim();
            const vis=async s=>page.locator(s).isVisible().catch(()=>false);
            const out={
              checked_at_utc:new Date().toISOString(), url,
              http:r.status(), title:await page.title(),
              sbs:await txt('#dSbs'), a:await txt('#dAVc'), b:await txt('#dBVc'),
              models:await page.locator('#dualTakeoverV4 .dv4m').count(),
              tickersA:await page.locator('#dM_qqq .asset').count(),
              tickersB:await page.locator('#dM_new_tickers .asset').count(),
              stickyTickersA:await page.locator('#tickerbar_qqq .tickerchip').count(),
              stickyTickersB:await page.locator('#tickerbar_new_tickers .tickerchip').count(),
              old90:await vis('#reduced6030Panel'), oldMarket:await vis('#marketPanel'),
              console_errors:errs
            };
            if(out.http!==200) throw Error('HTTP '+out.http);
            if(out.sbs!=='70.3276160') throw Error('SBS visible '+out.sbs);
            if(out.a!=='71.8606887') throw Error('Modelo A '+out.a);
            if(out.b!=='71.7192086') throw Error('Modelo B '+out.b);
            if(out.models!==2) throw Error('Modelos visibles '+out.models);
            if(out.tickersA!==6 || out.tickersB!==6 || out.stickyTickersA!==6 || out.stickyTickersB!==6) throw Error('Tickers '+out.tickersA+'/'+out.tickersB+' sticky '+out.stickyTickersA+'/'+out.stickyTickersB);
            if(out.old90 || out.oldMarket) throw Error('Quedó UI antigua visible');

            async function test(k,t){
              const exp={7:6,15:11,30:18,90:56,all:80}, got={};
              for(const d of ['7','15','30','90','all']){
                await page.locator(`.controls[data-k="${k}"][data-t="${t}"] button[data-d="${d}"]`).click();
                await page.waitForTimeout(200);
                const note=await txt(`#d${t}N_${k}`);
                const m=note.match(/^(\d+) puntos/); got[d]=m?Number(m[1]):null;
                if(got[d]!==exp[d]) throw Error(`${k}/${t}/${d}=${got[d]} esperado ${exp[d]}`);
              }
              return got;
            }
            out.ranges={
              aVc:await test('qqq','Vc'), aRet:await test('qqq','Ret'),
              bVc:await test('new_tickers','Vc'), bRet:await test('new_tickers','Ret')
            };

            // Volver a 30 días y comprobar que SBS pendiente NO se convierta en cero ni -100%.
            for(const k of ['qqq','new_tickers']) for(const t of ['Vc','Ret']){
              await page.locator(`.controls[data-k="${k}"][data-t="${t}"] button[data-d="30"]`).click();
              await page.waitForTimeout(150);
            }
            out.pending_check=await page.evaluate(()=>{
              const latest='2026-08-19';
              const result={};
              for(const k of ['qqq','new_tickers']){
                const vcg=document.getElementById('dVc_'+k),rtg=document.getElementById('dRet_'+k);
                const vct=vcg.data.find(t=>t.name==='VC real SBS');
                const rtt=rtg.data.find(t=>t.name==='Retorno real SBS');
                const pendingVc=vct.x.map((x,i)=>({x:String(x).slice(0,10),y:vct.y[i]})).filter(p=>p.x>latest);
                const pendingRet=rtt.x.map((x,i)=>({x:String(x).slice(0,10),y:rtt.y[i]})).filter(p=>p.x>latest);
                const badRealShapes=(rtg.layout.shapes||[]).filter(s=>String(s.line?.color).toLowerCase()==='#7c2d12' && String(s.x0).slice(0,10)>latest);
                result[k]={pendingVc,pendingRet,badRealShapes:badRealShapes.length};
              }
              return result;
            });
            for(const [k,p] of Object.entries(out.pending_check)){
              if(!p.pendingVc.length || !p.pendingRet.length) throw Error(k+' no contiene días pendientes para validar');
              if(p.pendingVc.some(x=>x.y!==null && x.y!==undefined)) throw Error(k+' VC SBS pendiente dibujado como dato real: '+JSON.stringify(p.pendingVc));
              if(p.pendingRet.some(x=>x.y!==null && x.y!==undefined)) throw Error(k+' retorno SBS pendiente dibujado como dato real: '+JSON.stringify(p.pendingRet));
              if(p.badRealShapes!==0) throw Error(k+' tallos SBS ficticios después del último VC: '+p.badRealShapes);
            }
            if(errs.some(x=>/Cannot set properties of null|setting ['\"]?textContent/i.test(x))) throw Error('Error JS: '+errs.join(' | '));
            out.status='PASS_V4_NULLS_TICKERS';
            fs.writeFileSync('/tmp/standalone_live_verified.json',JSON.stringify(out,null,2));
            await page.screenshot({path:'/tmp/standalone_live_verified.png',fullPage:true});
            console.log('VISOR_DUAL_PUBLICO_V4_PASS',JSON.stringify(out,null,2));
            await browser.close();
          })().catch(e=>{console.error('VISOR_DUAL_PUBLICO_V4_FAIL',e);process.exit(1)});
          JS

      - name: Registrar prueba pública aprobada
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin migracion-github-actions
          git reset --hard origin/migracion-github-actions
          cp /tmp/standalone_live_verified.json public/data/standalone_live_verified.json
          cp /tmp/standalone_live_verified.png public/data/standalone_live_verified.png
          git add public/data/standalone_live_verified.json public/data/standalone_live_verified.png
          git commit -m "Registrar visor dual V4 verificado en vivo" || true
          git pull --rebase origin migracion-github-actions || true
          git push origin HEAD:migracion-github-actions || true
