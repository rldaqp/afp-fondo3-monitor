name: Actualizar visor ETF y volumen

on:
  workflow_dispatch:
  push:
    branches:
      - migracion-github-actions
    paths:
      - ".github/workflows/update-etf-market-dashboard.yml"
      - "scripts/build_etf_market_dashboard.py"
      - "scripts/enrich_cper_holdings.py"
      - "scripts/enrich_etf_stats_news.py"
      - "scripts/enrich_etf_news_fallback.py"
      - "public/mercados.html"
      - "public/mercados-extra.js"
  schedule:
    # Mercado/volumen: cada 10 minutos durante la franja que cubre la sesión regular de EE. UU.
    # Noticias: la caché solo se vuelve a consultar cada 30 minutos.
    - cron: "3,13,23,33,43,53 13-21 * * 1-5"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  # Grupo exclusivo del visor ETF: no competir con los workflows intradía del monitor principal.
  group: etf-market-dashboard-publish
  # Si se acumula una ejecución antigua, prioriza la más reciente para evitar datos congelados.
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: migracion-github-actions
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias mínimas
        run: pip install --disable-pip-version-check pandas numpy yfinance

      - name: Construir snapshot ETF
        run: |
          python scripts/build_etf_market_dashboard.py
          python scripts/enrich_cper_holdings.py
          python scripts/enrich_etf_stats_news.py
          python scripts/enrich_etf_news_fallback.py

      - name: Validar salida
        run: |
          python -m py_compile scripts/build_etf_market_dashboard.py scripts/enrich_cper_holdings.py scripts/enrich_etf_stats_news.py scripts/enrich_etf_news_fallback.py
          node --check public/mercados-extra.js
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('public/data/etf_market_snapshot.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          by_symbol = {x.get('symbol'): x for x in data.get('tickers', [])}
          expected = {'SPY','QQQ','EEM','EPU','MCHI','CPER'}
          missing = expected - set(by_symbol)
          if missing:
              raise SystemExit(f'Faltan ETF: {sorted(missing)}')
          missing_holdings = [s for s in expected if not by_symbol[s].get('holdings')]
          if missing_holdings:
              raise SystemExit(f'Faltan posiciones: {sorted(missing_holdings)}')
          missing_distribution = [s for s in expected if not by_symbol[s].get('distribution', {}).get('windows')]
          if missing_distribution:
              raise SystemExit(f'Falta distribución: {sorted(missing_distribution)}')
          for required in ('public/mercados.html','public/mercados-extra.js'):
              if not Path(required).exists():
                  raise SystemExit(f'Falta {required}')
          print('Visor ETF, posiciones y distribución validados:', ', '.join(sorted(expected)))
          print('Noticias disponibles:', {s: len(by_symbol[s].get('news', []) or []) for s in sorted(expected)})
          PY

      - name: Persistir último snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/etf_market_snapshot.json public/data/etf_news_cache.json
          if git diff --cached --quiet; then
            echo "Sin cambios de mercado."
          else
            git commit -m "Actualizar visor ETF, distribución y noticias"
            git fetch origin migracion-github-actions
            git rebase origin/migracion-github-actions
            git push origin HEAD:migracion-github-actions
          fi

      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Subir sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Desplegar Pages
        uses: actions/deploy-pages@v4
