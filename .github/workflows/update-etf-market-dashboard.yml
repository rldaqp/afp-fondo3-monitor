name: Actualizar visor ETF y volumen

on:
  workflow_dispatch:
  push:
    branches:
      - migracion-github-actions
    paths:
      - ".github/workflows/update-etf-market-dashboard.yml"
      - "scripts/build_etf_market_dashboard.py"
      - "public/mercados.html"
  schedule:
    # Cada 10 minutos durante la franja que cubre la sesión regular de EE. UU.
    # El rango UTC amplio cubre tanto EDT como EST.
    - cron: "3-53/10 13-21 * * 1-5"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: profuturo-fixed-publish
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: migracion-github-actions
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias mínimas
        run: pip install --disable-pip-version-check pandas numpy yfinance

      - name: Construir snapshot ETF
        run: python scripts/build_etf_market_dashboard.py

      - name: Validar salida
        run: |
          python -m py_compile scripts/build_etf_market_dashboard.py
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('public/data/etf_market_snapshot.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          symbols = {x.get('symbol') for x in data.get('tickers', [])}
          expected = {'SPY','QQQ','EEM','EPU','MCHI','CPER'}
          missing = expected - symbols
          if missing:
              raise SystemExit(f'Faltan ETF: {sorted(missing)}')
          if not Path('public/mercados.html').exists():
              raise SystemExit('Falta public/mercados.html')
          print('Visor ETF validado:', ', '.join(sorted(symbols)))
          PY

      - name: Persistir último snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/etf_market_snapshot.json
          if git diff --cached --quiet; then
            echo "Sin cambios de mercado."
          else
            git commit -m "Actualizar visor ETF y volumen"
            git fetch origin migracion-github-actions
            git rebase origin/migracion-github-actions
            git push origin HEAD:migracion-github-actions
          fi

      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Subir sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Desplegar Pages
        uses: actions/deploy-pages@v4
