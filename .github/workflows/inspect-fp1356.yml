name: Probar composición de cartera

on:
  push:
    branches:
      - research-portfolio-regime
  pull_request:
    branches:
      - migracion-github-actions
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: pip install pandas numpy requests xlrd yfinance scikit-learn
      - name: Ejecutar prueba de cartera
        run: python research/run_portfolio_regime.py
      - name: Validar salidas
        run: |
          test -s research_outputs/portfolio_regime/results.json
          test -s research_outputs/portfolio_regime/paired_predictions.csv
          test -s research_outputs/portfolio_regime/monthly_weights.csv
          test -s research_outputs/portfolio_regime/target_dates.csv
      - name: Guardar resultados
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-regime-results
          path: research_outputs/portfolio_regime/
          retention-days: 90
