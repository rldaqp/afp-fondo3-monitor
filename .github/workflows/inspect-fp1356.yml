name: Inspeccionar FP-1356

on:
  push:
    branches:
      - research-portfolio-regime
  pull_request:
    branches:
      - migracion-github-actions
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: pip install pandas requests xlrd
      - name: Inspeccionar archivo
        run: python research/inspect_fp1356.py
