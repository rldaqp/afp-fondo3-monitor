name: Mantener intradia Fondo 3

on:
  workflow_dispatch:
  push:
    branches:
      - migracion-github-actions
    paths:
      - ".github/workflows/intraday-heartbeat.yml"
      - "scripts/profuturo_watchdog.py"
      - "scripts/test_profuturo_watchdog.py"
  workflow_run:
    workflows:
      - "Actualizar modelos fijos niveles y retornos"
    branches:
      - migracion-github-actions
    types:
      - completed
  schedule:
    # Rescate adicional al relevo: también cubre noches y fines de semana.
    # El supervisor no consulta cotizaciones fuera de sesión ni en feriados.
    - cron: "17 */3 * * *"

permissions:
  actions: write
  contents: read

concurrency:
  group: intraday-heartbeat
  # Un cron tardío no debe interrumpir el reloj que ya funciona.
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 195
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: migracion-github-actions
          persist-credentials: false

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Calendario de sesiones
        run: pip install --disable-pip-version-check exchange-calendars

      - name: Probar apertura frescura y relevo
        run: python -m unittest discover -s scripts -p test_profuturo_watchdog.py -v

      - name: Vigilar publicación y relevar automáticamente
        env:
          GH_TOKEN: ${{ github.token }}
          # La instalación demuestra su primer relevo en ocho minutos.
          # Los siguientes relevos duran tres horas, por debajo del límite de 6 h.
          LEASE_SECONDS: ${{ github.event_name == 'push' && '480' || '10800' }}
        run: python -u scripts/profuturo_watchdog.py --lease-seconds "$LEASE_SECONDS"
