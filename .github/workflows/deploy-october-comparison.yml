name: Publicar comparativo continuo de cuatro modelos

on:
  workflow_dispatch:
  push:
    branches:
      - migracion-github-actions
    paths:
      - "public/index.html"
      - "public/data/experimento_defensivo_octubre_2026.json"
      - ".github/workflows/deploy-october-comparison.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: profuturo-comparativo-continuo-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout de la rama del visor
        uses: actions/checkout@v4
        with:
          ref: migracion-github-actions

      - name: Validar comparativo continuo sin alterar modelos
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          base = json.loads(Path("public/data/fixed_models_2026.json").read_text())
          exp = json.loads(Path("public/data/experimento_defensivo_octubre_2026.json").read_text())
          html = Path("public/index.html").read_text()
          assert base["model_version"] == exp["fuente_version"], "Versiones de modelo no coinciden"
          assert exp["observaciones"], "Sin observaciones comparativas"
          assert all(o["fecha"] >= "2026-10-01" for o in exp["observaciones"]), "Fechas anteriores al experimento"
          dates = [o["fecha"] for o in exp["observaciones"]]
          assert dates == sorted(set(dates)), "Fechas duplicadas o desordenadas"
          for d in ("2026-11-02", "2026-11-03"):
              assert d in dates, f"Falta rueda comparativa {d}"
          assert "Niveles · comparativo 20%" in html and "Retornos · comparativo 20%" in html, "Faltan curvas comparativas"
          assert "data/experimento_defensivo_octubre_2026.json" in html, "El visor no carga el comparativo"
          assert html.count('data-vc-series="') == 5, "La leyenda debe tener cinco controles táctiles"
          assert "visible:vcVisible[i]" in html, "Los controles no están conectados a las curvas"
          assert "aria-pressed" in html, "Falta el estado accesible de los controles"
          assert 'id="octTable"' in html, "Falta el cuadro diario comparativo"
          assert "renderOctoberComparison();" in html, "Falta el renderizado del cuadro diario"
          assert 'id="vcPointPanel"' in html, "Falta panel de valores por fecha"
          assert "updateVcPointPanel" in html, "Falta interacción de panel por fecha"
          assert "Evaluación diaria continua · 4 modelos frente a SBS" in html, "Título del comparativo continuo ausente"
          assert "startsWith('2026-10-')" not in html, "Filtro de octubre aún activo"
          assert "Comparativo defensivo experimental limitado a octubre" not in html, "Texto antiguo presente"
          print("Comparativo continuo validado; modelos originales sin modificar")
          PY

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Preparar sitio existente
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Publicar el visor actualizado
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verificar publicación desde GitHub Pages
        run: |
          python - <<'PY'
          import time
          import urllib.request
          import json
          url = "https://rldaqp.github.io/afp-fondo3-monitor/?revision=interactive-legend"
          for attempt in range(12):
              try:
                  req = urllib.request.Request(url, headers={"Cache-Control": "no-cache", "User-Agent": "Mozilla/5.0"})
                  with urllib.request.urlopen(req, timeout=15) as response:
                      html = response.read().decode("utf-8")
                  assert "Evaluación diaria continua · 4 modelos frente a SBS" in html, "GitHub Pages todavía muestra el comparativo antiguo"
                  assert "startsWith('2026-10-')" not in html, "GitHub Pages todavía limita la tabla a octubre"
                  assert html.count('data-vc-series="') == 5, "GitHub Pages aún sirve la versión antigua"
                  assert "visible:vcVisible[i]" in html, "La versión pública aún no activa las líneas táctiles"
                  assert 'id="octTable"' in html, "La versión pública aún no incluye el cuadro diario"
                  assert "renderOctoberComparison();" in html, "La versión pública aún no renderiza el cuadro"
                  assert 'id="vcPointPanel"' in html, "La versión pública aún no muestra el panel por fecha"
                  assert "updateVcPointPanel" in html, "La versión pública aún no activa el panel por fecha"
                  data_url = "https://rldaqp.github.io/afp-fondo3-monitor/data/experimento_defensivo_octubre_2026.json?revision=november-continuity"
                  with urllib.request.urlopen(urllib.request.Request(data_url, headers={"Cache-Control": "no-cache"}), timeout=15) as data_response:
                      published = json.loads(data_response.read().decode("utf-8"))
                  published_dates = [o["fecha"] for o in published["observaciones"]]
                  assert "2026-11-02" in published_dates and "2026-11-03" in published_dates and "2026-11-06" in published_dates, "Pages no publicó la continuidad hasta el 6 de noviembre"
                  print("PUBLICACIÓN VERIFICADA: leyenda interactiva y cuadro diario visibles en HTML público")
                  break
              except Exception as exc:
                  if attempt == 11:
                      raise SystemExit(f"No se pudo verificar la publicación: {exc}")
                  time.sleep(10)
          PY

      - name: Mostrar URL
        run: echo "${{ steps.deployment.outputs.page_url }}"
