name: Publicar comparador Fondo 3

on:
  workflow_dispatch:
  push:
    branches:
      - migracion-github-actions
    paths:
      - ".github/workflows/deploy-comparador-fondos.yml"
      - "public/comparador-fondos/**"
      - "public/data/series.json"
      - "public/habitat/data/series.json"
      - "public/data/fixed_models_2026.json"
      - "public/habitat/data/fixed_models_2026.json"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-static-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: migracion-github-actions

      - name: Validar comparador actualizado
        run: |
          test -s public/comparador-fondos/index.html
          test -s public/comparador-fondos/comparator_runtime_v6.js
          test -s public/data/series.json
          test -s public/habitat/data/series.json
          test -s public/data/fixed_models_2026.json
          test -s public/habitat/data/fixed_models_2026.json
          grep -q 'comparator_runtime_v6.js?rev=CMPV6-20260906-' public/comparador-fondos/index.html
          grep -q 'Niveles · modelo vigente' public/comparador-fondos/comparator_runtime_v6.js
          grep -q 'Retornos · modelo vigente' public/comparador-fondos/comparator_runtime_v6.js
          grep -q 'SBS oficial si existe; modelo solo si está pendiente' public/comparador-fondos/comparator_runtime_v6.js
          ! grep -q 'Modelo A · Rolling 30' public/comparador-fondos/index.html
          ! grep -q 'Modelo B · Rolling 30' public/comparador-fondos/index.html
          grep -q 'fixed_models_2026.json' public/comparador-fondos/comparator_runtime_v6.js
          node --check public/comparador-fondos/comparator_runtime_v6.js
          grep -q 'Si hubieras invertido S/10,000' public/comparador-fondos/index.html
          grep -q 'Hábitat' public/comparador-fondos/index.html
          grep -q 'Profuturo' public/comparador-fondos/index.html

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir sitio completo
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Publicar comparador
        id: deployment
        uses: actions/deploy-pages@v4
