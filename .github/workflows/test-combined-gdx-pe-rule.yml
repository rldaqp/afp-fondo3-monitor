name: Probar combinado GDX y EPU-SPBL
on:
  push:
    branches: [migracion-github-actions]
    paths:
      - 'scripts/test_combined_gdx_pe_rule.py'
      - '.github/workflows/test-combined-gdx-pe-rule.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migracion-github-actions
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy yfinance
      - run: python scripts/test_combined_gdx_pe_rule.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/combined_gdx_pe_rule.json analysis/combined_gdx_pe_rule_daily.csv
          git diff --cached --quiet || git commit -m 'Guardar prueba combinada GDX EPU SPBL'
          git pull --rebase origin migracion-github-actions
          git push origin HEAD:migracion-github-actions
