name: Actualizar mercado intradia Fondo 3

on:
  workflow_dispatch:
  push:
    branches:
      - migracion-github-actions
    paths:
      - ".github/workflows/update-live-market.yml"
      - "scripts/update_live_market_only.py"
      - "scripts/update_live_market_hybrid.py"
      - "scripts/build_reduced_6030_challenger.py"
      - "scripts/build_reduced_6030_history.py"
      - "scripts/update_habitat_live_market.py"
      - "scripts/postprocess_live_consistency.py"
      - "requirements-live.txt"
  schedule:
    # Ejecucion corta cada cinco minutos durante la franja que cubre
    # el mercado de Nueva York tanto en horario de verano como de invierno.
    # Se desplaza de los minutos :00/:05, donde GitHub concentra más cron.
    - cron: "1-56/5 13-22 * * 1-5"

permissions:
  contents: write

concurrency:
  group: fondo3-data-writes
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: migracion-github-actions
          fetch-depth: 0

      - name: Configurar Python liviano
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-live.txt

      - name: Instalar dependencias de mercado
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-live.txt

      - name: Calcular un snapshot de Profuturo y Habitat
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189828+github-actions[bot]@users.noreply.github.com"
          git fetch origin migracion-github-actions
          git reset --hard origin/migracion-github-actions

          python scripts/update_live_market_hybrid.py
          python scripts/update_habitat_live_market.py

          # Control de coherencia de Profuturo al cierre. Antes podía ocurrir que
          # los activos ya fueran del día T pero la señal/VC siguieran siendo T-1.
          # Si existe la predicción exacta de T, esta manda. Si todavía no existe,
          # se calcula un cierre provisional con los retornos visibles y los betas
          # vigentes, en vez de publicar una señal de una fecha distinta.
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          live_path = Path("public/data/live_market.json")
          latest_path = Path("public/data/latest.json")
          pending_path = Path("data/rolling90/pending_predictions.csv")

          live = json.loads(live_path.read_text(encoding="utf-8"))
          latest = json.loads(latest_path.read_text(encoding="utf-8"))
          signal_date = str(live.get("signal_date", ""))[:10]

          pending = []
          if pending_path.exists():
              with pending_path.open("r", encoding="utf-8", newline="") as fh:
                  pending = list(csv.DictReader(fh))

          same = [r for r in pending if str(r.get("fecha", ""))[:10] == signal_date]
          source = None

          if str(live.get("mode", "")).startswith("CIERRE"):
              if same:
                  r = same[-1]
                  live["return_estimated"] = float(r["ret_estimado"])
                  live["vc_estimated"] = float(r["valor_cuota_estimado"])
                  live["signal"] = str(r["senal"])
                  source = "PREDICCION OLS EXACTA DEL CIERRE"

                  fx_source = str(r.get("usd_pen_fuente", ""))
                  if fx_source.startswith("YAHOO"):
                      fx_ret = float(r.get("ret_USD_PEN") or 0.0)
                      for a in live.get("assets", []):
                          if a.get("serie") == "USD_PEN":
                              a["ticker"] = "PEN=X"
                              a["retorno"] = fx_ret
                              a["retorno_modelo"] = fx_ret
                              a["estado"] = "YAHOO PEN=X · PROVISIONAL · USADO POR MODELO"
                              a["usado_modelo"] = True
                      live["fx_source"] = "YAHOO PEN=X PROVISIONAL"
                      live["fx_provisional"] = True
                  elif fx_source == "BCRP":
                      live["fx_source"] = "BCRP"
                      live["fx_provisional"] = False
              elif str(latest.get("latest_estimate_date", ""))[:10] == signal_date:
                  live["return_estimated"] = float(latest["latest_return_estimated"])
                  live["vc_estimated"] = float(latest["latest_estimated_vc"])
                  live["signal"] = str(latest["signal"])
                  source = "LATEST OLS DE LA MISMA FECHA"
              else:
                  beta = latest.get("coefficients") or {}
                  features = {}
                  for a in live.get("assets", []):
                      serie = str(a.get("serie", ""))
                      if serie:
                          try:
                              features[f"ret_{serie}"] = float(a.get("retorno_modelo") or 0.0)
                          except Exception:
                              features[f"ret_{serie}"] = 0.0
                  pred = float(beta.get("intercept", 0.0))
                  for feature, value in features.items():
                      if feature in beta:
                          pred += float(beta[feature]) * float(value)
                  prior = [r for r in pending if str(r.get("fecha", ""))[:10] < signal_date]
                  if prior:
                      vc_base = float(prior[-1]["valor_cuota_estimado"])
                  else:
                      vc_base = float(latest["latest_sbs_vc"])
                  threshold = float(latest.get("threshold", 0.001))
                  live["return_estimated"] = pred
                  live["vc_estimated"] = vc_base * (1.0 + pred)
                  live["signal"] = "SUBE" if pred > threshold else ("BAJA" if pred < -threshold else "NEUTRO")
                  live["warning"] = "Cierre OLS pesado pendiente; cálculo provisional coherente con los activos del mismo día."
                  source = "CIERRE PROVISIONAL MISMA FECHA"

              live["model_snapshot_source"] = source
              live["model_snapshot_date"] = signal_date

              assert live["model_snapshot_date"] == signal_date
              assert live.get("signal") in {"SUBE", "NEUTRO", "BAJA"}

          live_path.write_text(json.dumps(live, ensure_ascii=False, indent=2), encoding="utf-8")
          print("Profuturo cierre coherente:", signal_date, live.get("signal"), live.get("return_estimated"), source)
          PY

          # Único challenger Profuturo: 60/30 sin NEM ni FCX + QQQ.
          # Se recalcula también en intradía con los coeficientes congelados del
          # ciclo vigente y sin reanclar con SBS dentro del bloque.
          python scripts/build_reduced_6030_challenger.py
          python scripts/build_reduced_6030_history.py

          python - <<'PY'
          import json
          from pathlib import Path

          prof = json.loads(Path("public/data/live_market.json").read_text(encoding="utf-8"))
          challenger = json.loads(Path("public/data/reduced_6030_challenger.json").read_text(encoding="utf-8"))
          history = json.loads(Path("public/data/reduced_6030_history.json").read_text(encoding="utf-8"))
          hab = json.loads(Path("public/habitat/data/live_market.json").read_text(encoding="utf-8"))
          prof_latest = json.loads(Path("public/data/latest.json").read_text(encoding="utf-8"))
          hab_latest = json.loads(Path("public/habitat/data/latest.json").read_text(encoding="utf-8"))

          assert prof.get("engine") == "LIVE INDEPENDIENTE", prof
          assert "HABITAT" in str(hab.get("engine", "")).upper(), hab
          assert challenger.get("signal_date") == prof.get("signal_date"), (challenger, prof)
          assert challenger.get("challenger", {}).get("signal") in {"SUBE", "NEUTRO", "BAJA"}, challenger
          assert float(challenger.get("challenger", {}).get("vc_estimated")) > 0, challenger
          features = set(challenger.get("cycle", {}).get("features", []))
          assert "ret_QQQ" in features, challenger
          assert "ret_NEM" not in features and "ret_FCX" not in features, challenger
          assert history.get("operational_history"), history

          for name, live, latest in (
              ("Profuturo", prof, prof_latest),
              ("Habitat", hab, hab_latest),
          ):
              assert live.get("generated_at_lima"), (name, live)
              assert str(live.get("mode", "")).startswith(("INTRAD", "CIERRE")), (name, live)
              assert live.get("signal") in {"SUBE", "NEUTRO", "BAJA"}, (name, live)
              assert live.get("fx_source"), (name, live)
              if str(live.get("mode", "")).startswith("INTRAD") and not live.get("warning"):
                  names = {x.get("serie") for x in live.get("assets", [])}
                  expected = {"SPY", "NEM", "FCX", "EPU", "MCHI", "USD_PEN"}
                  if "ret_EEM" in (latest.get("coefficients", {}) or {}):
                      expected.add("EEM")
                  assert names == expected, (name, names, expected)
                  assert str(live.get("signal_date")) >= str(latest.get("latest_market_date")), (name, live)

          if str(prof.get("mode", "")).startswith("CIERRE"):
              assert str(prof.get("model_snapshot_date", "")) == str(prof.get("signal_date", "")), prof
              if str(prof_latest.get("latest_estimate_date", "")) == str(prof.get("signal_date", "")):
                  assert prof.get("signal") == prof_latest.get("signal"), (prof, prof_latest)
                  assert abs(float(prof.get("return_estimated")) - float(prof_latest.get("latest_return_estimated"))) < 1e-12, (prof, prof_latest)

          if (
              str(prof.get("mode", "")).startswith(("INTRAD", "CIERRE"))
              and not prof.get("warning")
              and str(prof.get("signal_date", "")) > str(hab_latest.get("latest_estimate_date", ""))
          ):
              assert hab.get("signal_date") == prof.get("signal_date"), (prof, hab, hab_latest)

          print("Profuturo", prof.get("generated_at_lima"), prof.get("mode"), prof.get("signal"))
          print("60/30 challenger", challenger.get("challenger"))
          print("Habitat", hab.get("generated_at_lima"), hab.get("mode"), hab.get("signal"))
          PY

          git add public/data/live_market.json public/data/reduced_6030_challenger.json public/data/reduced_6030_history.json data/rolling90/reduced_6030_shadow.csv data/rolling90/reduced_6030_state.json public/habitat/data/live_market.json public/habitat/data/latest.json public/habitat/data/signals.json public/habitat/data/series.json public/habitat/data/operation_series.json public/habitat/data/model_insights.json
          if git diff --cached --quiet; then
            echo "No hubo cambios en el snapshot."
          else
            git commit -m "Actualizar mercado intradia Profuturo y Habitat"
            if ! git push origin HEAD:migracion-github-actions; then
              git pull --rebase origin migracion-github-actions
              git push origin HEAD:migracion-github-actions
            fi
          fi

          tmp="$(mktemp -d)"
          git clone --depth 1 --branch gh-pages "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$tmp/gh-pages"
          mkdir -p "$tmp/gh-pages/data" "$tmp/gh-pages/habitat/data"
          cp public/data/live_market.json "$tmp/gh-pages/data/live_market.json"
          cp public/data/reduced_6030_challenger.json "$tmp/gh-pages/data/reduced_6030_challenger.json"
          cp public/data/reduced_6030_history.json "$tmp/gh-pages/data/reduced_6030_history.json"
          cp public/habitat/data/live_market.json "$tmp/gh-pages/habitat/data/live_market.json"
          cp public/habitat/data/latest.json "$tmp/gh-pages/habitat/data/latest.json"
          cp public/habitat/data/signals.json "$tmp/gh-pages/habitat/data/signals.json"
          cp public/habitat/data/series.json "$tmp/gh-pages/habitat/data/series.json"
          cp public/habitat/data/operation_series.json "$tmp/gh-pages/habitat/data/operation_series.json"
          cp public/habitat/data/model_insights.json "$tmp/gh-pages/habitat/data/model_insights.json"
          cd "$tmp/gh-pages"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live_market.json data/reduced_6030_challenger.json data/reduced_6030_history.json habitat/data/live_market.json
          if git diff --cached --quiet; then
            echo "gh-pages ya tiene los snapshots intradia vigentes."
          else
            git commit -m "Publicar snapshots intradia"
            git push origin HEAD:gh-pages
          fi
