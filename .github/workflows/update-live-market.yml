name: Actualizar mercado intradía Fondo 3

on:
  workflow_dispatch:
  push:
    branches:
      - migracion-github-actions
    paths:
      - ".github/workflows/update-live-market.yml"
      - "scripts/update_live_market_only.py"
      - "scripts/update_live_market_hybrid.py"
      - "requirements-live.txt"
  schedule:
    # Dos turnos largos. Una vez iniciado el runner, él mismo toma snapshots cada 5 minutos.
    # 13:20 UTC cubre apertura EDT/EST; 17:15 UTC releva el segundo tramo de la sesión.
    - cron: "20 13 * * 1-5"
    - cron: "15 17 * * 1-5"

permissions:
  contents: write
  actions: write

concurrency:
  group: fondo3-live-market-continuo
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 255

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: migracion-github-actions

      - name: Configurar Python liviano
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-live.txt

      - name: Instalar dependencias de mercado
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-live.txt

      - name: Mantener Mercado ahora cada cinco minutos
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for i in $(seq 1 48); do
            T0=$(date +%s)
            echo "Snapshot $i/48"

            git fetch origin migracion-github-actions
            git reset --hard origin/migracion-github-actions

            python scripts/update_live_market_hybrid.py

            python - <<'PY'
          import json
          from pathlib import Path
          live = json.loads(Path("public/data/live_market.json").read_text(encoding="utf-8"))
          assert live.get("engine") == "LIVE INDEPENDIENTE", live
          assert live.get("generated_at_lima"), live
          assert live.get("mode"), live
          assert live.get("signal") in {"SUBE", "NEUTRO", "BAJA"}, live
          assert live.get("fx_source"), live
          assert "Yahoo PEN=X provisional" in live.get("fx_rule", ""), live
          if live.get("market_open") and not live.get("warning"):
              names = {x.get("serie") for x in live.get("assets", [])}
              assert names == {"SPY", "NEM", "FCX", "EPU", "MCHI", "USD_PEN"}, names
              assert live.get("mode") == "INTRADÍA PROVISIONAL", live
              fx = next(x for x in live["assets"] if x.get("serie") == "USD_PEN")
              if live.get("fx_source", "").startswith("YAHOO"):
                  assert fx.get("usado_modelo") is True, fx
                  assert "PROVISIONAL" in fx.get("estado", ""), fx
          print(live.get("generated_at_lima"), live.get("mode"), live.get("signal"), live.get("fx_source"))
          PY

            git add public/data/live_market.json
            if ! git diff --cached --quiet; then
              git commit -m "Actualizar mercado intradía Fondo 3"
              if ! git push origin HEAD:migracion-github-actions; then
                git pull --rebase origin migracion-github-actions
                git push origin HEAD:migracion-github-actions
              fi

              gh workflow run deploy-pages-ui.yml --ref migracion-github-actions
            fi

            ELAPSED=$(( $(date +%s) - T0 ))
            WAIT=$(( 300 - ELAPSED ))
            if [ "$WAIT" -gt 0 ]; then
              sleep "$WAIT"
            fi
          done
