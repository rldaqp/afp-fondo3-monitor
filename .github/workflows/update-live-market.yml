name: Actualizar mercado intradia Fondo 3

on:
  workflow_dispatch:
  push:
    branches:
      - migracion-github-actions
    paths:
      - ".github/workflows/update-live-market.yml"
      - "scripts/update_live_market_only.py"
      - "scripts/update_live_market_hybrid.py"
      - "scripts/update_habitat_live_market.py"
      - "scripts/postprocess_live_consistency.py"
      - "requirements-live.txt"
  schedule:
    # Ejecucion corta cada cinco minutos durante la franja que cubre
    # el mercado de Nueva York tanto en horario de verano como de invierno.
    - cron: "*/5 13-22 * * 1-5"

permissions:
  contents: write

concurrency:
  group: fondo3-live-snapshot
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: migracion-github-actions
          fetch-depth: 0

      - name: Configurar Python liviano
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-live.txt

      - name: Instalar dependencias de mercado
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-live.txt

      - name: Calcular un snapshot de Profuturo y Habitat
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin migracion-github-actions
          git reset --hard origin/migracion-github-actions

          python scripts/update_live_market_hybrid.py
          python scripts/update_habitat_live_market.py

          python - <<'PY'
          import json
          from pathlib import Path

          prof = json.loads(Path("public/data/live_market.json").read_text(encoding="utf-8"))
          hab = json.loads(Path("public/habitat/data/live_market.json").read_text(encoding="utf-8"))
          prof_latest = json.loads(Path("public/data/latest.json").read_text(encoding="utf-8"))
          hab_latest = json.loads(Path("public/habitat/data/latest.json").read_text(encoding="utf-8"))

          assert prof.get("engine") == "LIVE INDEPENDIENTE", prof
          assert "HABITAT" in str(hab.get("engine", "")).upper(), hab

          for name, live, latest in (
              ("Profuturo", prof, prof_latest),
              ("Habitat", hab, hab_latest),
          ):
              assert live.get("generated_at_lima"), (name, live)
              assert str(live.get("mode", "")).startswith(("INTRAD", "CIERRE")), (name, live)
              assert live.get("signal") in {"SUBE", "NEUTRO", "BAJA"}, (name, live)
              assert live.get("fx_source"), (name, live)
              if str(live.get("mode", "")).startswith("INTRAD") and not live.get("warning"):
                  names = {x.get("serie") for x in live.get("assets", [])}
                  expected = {"SPY", "NEM", "FCX", "EPU", "MCHI", "USD_PEN"}
                  if "ret_EEM" in (latest.get("coefficients", {}) or {}):
                      expected.add("EEM")
                  assert names == expected, (name, names, expected)
                  assert str(live.get("signal_date")) >= str(latest.get("latest_market_date")), (name, live)

          print("Profuturo", prof.get("generated_at_lima"), prof.get("mode"), prof.get("signal"))
          print("Habitat", hab.get("generated_at_lima"), hab.get("mode"), hab.get("signal"))
          PY

          git add public/data/live_market.json public/habitat/data/live_market.json
          if git diff --cached --quiet; then
            echo "No hubo cambios en el snapshot."
          else
            git commit -m "Actualizar mercado intradia Profuturo y Habitat"
            if ! git push origin HEAD:migracion-github-actions; then
              git pull --rebase origin migracion-github-actions
              git push origin HEAD:migracion-github-actions
            fi
          fi

          tmp="$(mktemp -d)"
          git clone --depth 1 --branch gh-pages "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$tmp/gh-pages"
          mkdir -p "$tmp/gh-pages/data" "$tmp/gh-pages/habitat/data"
          cp public/data/live_market.json "$tmp/gh-pages/data/live_market.json"
          cp public/habitat/data/live_market.json "$tmp/gh-pages/habitat/data/live_market.json"
          cd "$tmp/gh-pages"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live_market.json habitat/data/live_market.json
          if git diff --cached --quiet; then
            echo "gh-pages ya tiene los snapshots intradia vigentes."
          else
            git commit -m "Publicar snapshots intradia"
            git push origin HEAD:gh-pages
          fi
