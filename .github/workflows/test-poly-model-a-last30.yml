name: Probar polinomial Modelo A ultimos 30
on:
  workflow_dispatch:
  push:
    branches: [migracion-github-actions]
    paths:
      - scripts/test_poly_model_a_last30.py
      - .github/workflows/test-poly-model-a-last30.yml
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migracion-github-actions
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy
      - name: Ejecutar
        run: python scripts/test_poly_model_a_last30.py
      - name: Guardar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/test_poly_model_a_last30.json
          if ! git diff --cached --quiet; then
            git commit -m "Guardar polinomial Modelo A ultimos 30"
            git push origin HEAD:migracion-github-actions
          fi
