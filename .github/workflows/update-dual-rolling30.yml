name: Actualizar visor dual Rolling 30

on:
  workflow_dispatch:
  push:
    branches: [migracion-github-actions]
    paths:
      - '.github/workflows/update-dual-rolling30.yml'
      - 'scripts/build_dual_rolling30_monitor.py'
      - 'scripts/patch_google_rolling30_assets.py'
      - 'public/data/dual_rolling30_runtime_v1.js'
      - 'data/analysis/googlefinance_alt_6030_returns_20260303_20260820.csv'
      - 'analysis/backtest_blind3_rolling30_resid_newtickers.json'
  schedule:
    - cron: '4-59/5 13-23 * * 1-5'
    - cron: '4-59/5 0-4 * * 2-6'

permissions:
  contents: write

concurrency:
  group: dual-rolling30-data-writes
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migracion-github-actions
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-live.txt
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-live.txt
          pip install requests
          google-chrome --version || chromium --version || true
      - name: Actualizar SBS, mercado y dos rolling30
        env:
          PYTHONUTF8: '1'
          PYTHONIOENCODING: 'utf-8'
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin migracion-github-actions
          git reset --hard origin/migracion-github-actions

          python scripts/sync_sbs_official_latest.py
          python scripts/apply_sbs_reference_corrections.py
          python scripts/update_live_market_hybrid.py
          python scripts/patch_google_rolling30_assets.py
          python scripts/build_dual_rolling30_monitor.py

          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('public/data/dual_rolling30_monitor.json').read_text(encoding='utf-8'))
          assert set(p['models']) == {'qqq','new_tickers'}
          assert p['models']['qqq']['current']['signal'] in {'SUBE','NEUTRO','BAJA'}
          assert p['models']['new_tickers']['current']['signal'] in {'SUBE','NEUTRO','BAJA'}
          assert float(p['models']['qqq']['current']['vc_estimated']) > 0
          assert float(p['models']['new_tickers']['current']['vc_estimated']) > 0
          assert int(p['models']['qqq']['current']['train_n']) == 30
          assert int(p['models']['new_tickers']['current']['train_n']) == 30
          assert p['latest_sbs']['fecha'] <= p['signal_date']
          print('QQQ:',p['models']['qqq']['current'])
          print('NUEVOS:',p['models']['new_tickers']['current'])
          print('SBS:',p['latest_sbs'])
          print('GANADOR CIEGO:',p['comparison']['winner_blind3_mape'])
          PY

          git add data/rolling90/sbs_profuturo_f3.csv public/data/sbs_sync_status.json public/data/live_market.json public/data/dual_rolling30_monitor.json
          if test -f data/analysis/googlefinance_alt_rolling30_live_returns.csv; then git add data/analysis/googlefinance_alt_rolling30_live_returns.csv; fi
          if git diff --cached --quiet; then
            echo 'Sin cambios duales.'
          else
            git commit -m 'Actualizar visor dual rolling30'
            if ! git push origin HEAD:migracion-github-actions; then
              git pull --rebase origin migracion-github-actions
              git push origin HEAD:migracion-github-actions
            fi
          fi

          tmp="$(mktemp -d)"
          git clone --depth 1 --branch gh-pages "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$tmp/gh-pages"
          mkdir -p "$tmp/gh-pages/data"
          cp public/data/dual_rolling30_monitor.json "$tmp/gh-pages/data/dual_rolling30_monitor.json"
          cp public/data/live_market.json "$tmp/gh-pages/data/live_market.json"
          cp public/data/sbs_sync_status.json "$tmp/gh-pages/data/sbs_sync_status.json"
          cd "$tmp/gh-pages"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/dual_rolling30_monitor.json data/live_market.json data/sbs_sync_status.json
          if git diff --cached --quiet; then
            echo 'gh-pages ya está vigente.'
          else
            git commit -m 'Publicar datos dual rolling30'
            git push origin HEAD:gh-pages
          fi
