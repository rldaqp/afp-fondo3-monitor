name: Validar rolling90 VC Profuturo

on:
  workflow_dispatch:
  push:
    branches:
      - research-rolling90-vc-validation-20260820
    paths:
      - "scripts/analyze_profuturo_rolling90_vc.py"
      - ".github/workflows/analyze-profuturo-rolling90-vc.yml"

permissions:
  contents: write

concurrency:
  group: research-rolling90-vc-validation-20260820
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: research-rolling90-vc-validation-20260820
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run rolling90 validation
        run: python scripts/analyze_profuturo_rolling90_vc.py

      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/profuturo_rolling90_vc_validation.json analysis/profuturo_rolling90_vc_predictions.csv
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Guardar validación rolling90 VC y proyección al cierre"
            git pull --rebase origin research-rolling90-vc-validation-20260820
            git push origin HEAD:research-rolling90-vc-validation-20260820
          fi
