name: Evaluar señales fuertes T+1

on:
  workflow_dispatch:
  push:
    branches:
      - migracion-github-actions
    paths:
      - "src/175_modelo_senales_fuertes_t1.py"
      - ".github/workflows/modelo-senales-t1.yml"
  schedule:
    # 03:00 UTC equivale a las 22:00 del día anterior en Lima.
    - cron: "0 3 * * 2-6"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: fondo3-monitor
  cancel-in-progress: false

jobs:
  evaluar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Actualizar insumos y preparar bitácora
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          python 129_monitor_fondo3_ACTUALIZA_Y_ABRE.py --actualizar
          python src/170_preparar_tablero_operativo_diario.py

      - name: Evaluar señales fuertes T+1
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          python src/175_modelo_senales_fuertes_t1.py

      - name: Validar resultados
        run: |
          test -s public/modelo-senales-t1/index.html
          test -s data/processed/ca0001_modelo175_resumen_senales_t1.csv
          grep -q "Modelo de señales fuertes" public/modelo-senales-t1/index.html

      - name: Guardar resultados en la rama
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            data/processed/ca0001_modelo175_resumen_senales_t1.csv \
            data/processed/ca0001_modelo175_reglas_candidatas.csv \
            data/processed/ca0001_modelo175_test_reservado.csv \
            data/processed/ca0001_modelo175_senal_actual_t1.csv \
            data/processed/ca0001_modelo175_manifiesto.json \
            public/modelo-senales-t1/index.html
          if [ -f data/processed/ca0001_modelo175_errores.csv ]; then
            git add -- data/processed/ca0001_modelo175_errores.csv
          fi
          if git diff --cached --quiet; then
            echo "No hay resultados nuevos para confirmar."
          else
            git commit -m "Actualizar señales fuertes T+1"
            git push
          fi

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
