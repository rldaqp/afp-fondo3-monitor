name: Backtest shocks fijos antes de julio

on:
  push:
    branches:
      - migracion-github-actions
    paths:
      - "scripts/backtest_fixed_shock_pre_july.py"
      - ".github/workflows/backtest-fixed-shock-pre-july.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: backtest-fixed-shock-pre-july
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: migracion-github-actions
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install pandas numpy

      - name: Ejecutar backtest histórico
        run: python scripts/backtest_fixed_shock_pre_july.py

      - name: Guardar resultados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/fixed_shock_pre_july_backtest.json analysis/fixed_shock_pre_july_daily.csv
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Actualizar backtest shocks pre julio"
            git pull --rebase origin migracion-github-actions
            git push origin HEAD:migracion-github-actions
          fi
