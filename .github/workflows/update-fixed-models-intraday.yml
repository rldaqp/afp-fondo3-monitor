name: Actualizar intradia modelos fijos

on:
  workflow_dispatch:
  push:
    branches:
      - migracion-github-actions
    paths:
      - ".github/workflows/update-fixed-models-intraday.yml"
      - "scripts/build_fixed_models_intraday.py"
      - "scripts/fixed_market_quotes.py"
      - "scripts/fixed_model_contract.py"
      - "scripts/reconcile_fixed_history.py"
      - "scripts/validate_fixed_models.py"
      - "scripts/test_fixed_model_contract.py"
      - "scripts/normalize_fixed_intraday_session.py"
      - "scripts/test_fixed_trade_live_date.js"
      - "scripts/test_fixed_dashboard_refresh.js"
      - "public/index.html"
      - "public/data/fixed_trade_runtime_v1.js"
      - "public/data/model_signal_v1.js"
      - "public/data/model_threshold_overlay_v1.js"
      - "public/data/model_health_v1.js"
      - "public/data/fixed_ticker_freshness_v1.js"
  schedule:
    # Minutos desplazados del :00 y de los múltiplos de cinco más saturados.
    # GitHub puede retrasar o descartar cron bajo carga; el push y workflow_run
    # se mantienen como disparadores independientes.
    - cron: "3-58/5 13-22 * * 1-5"
    # Salvaguardas de cierre. 20:07 UTC cubre el cierre cuando NY está en EDT
    # y 21:07 UTC cuando NY está en EST. Son ejecuciones adicionales al ciclo normal.
    - cron: "7 20 * * 1-5"
    - cron: "7 21 * * 1-5"
  workflow_run:
    workflows:
      - "Actualizar mercado intradia Fondo 3"
      - "Actualizar modelos fijos niveles y retornos"
    types:
      - completed

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: profuturo-fixed-publish
  cancel-in-progress: false

jobs:
  update:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: migracion-github-actions
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: pip install --disable-pip-version-check pandas numpy yfinance requests beautifulsoup4 lxml selenium exchange-calendars

      - name: Pruebas de regresión SBS y cierres
        run: python -m unittest discover -s scripts -p test_fixed_model_contract.py -v

      - name: Actualizar SBS y base de retornos
        run: |
          python scripts/sync_sbs_official_latest.py
          python scripts/reconcile_fixed_history.py --sbs-only

      - name: Calcular snapshot intradia fijo
        run: python scripts/build_fixed_models_intraday.py

      - name: Consolidar cierre y validar generación
        run: |
          python scripts/reconcile_fixed_history.py
          python scripts/build_model_health.py
          python scripts/validate_fixed_models.py

      - name: Validar fecha viva en operaciones
        run: |
          node --check public/data/fixed_trade_runtime_v1.js
          node scripts/test_fixed_trade_live_date.js
          node scripts/test_fixed_dashboard_refresh.js
          grep -q "const LIVE_URL='data/fixed_models_intraday.json'" public/data/fixed_trade_runtime_v1.js
          grep -q 'function refreshDateInputs' public/data/fixed_trade_runtime_v1.js
          grep -q 'FIXEDTRADE3-20260903' public/index.html

      - name: Guardar snapshot en rama
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/fixed_models_intraday.json \
            public/data/fixed_models_2026.json public/data/fixed_models_2026.csv \
            public/data/sbs_sync_status.json public/data/series.json public/data/model_health.json \
            data/rolling90/sbs_profuturo_f3.csv \
            data/fixed_models/yahoo_levels_2026.csv data/fixed_models/spblscup_levels_2026.csv
          if git diff --cached --quiet; then
            echo "Sin cambios intradia."
          else
            git commit -m "Actualizar intradia niveles y retornos"
            PUSHED=0
            for attempt in 1 2 3; do
              if git push origin HEAD:migracion-github-actions; then PUSHED=1; break; fi
              echo "Rama ocupada; reintento ${attempt}/3..."
              git fetch origin migracion-github-actions
              if ! git rebase origin/migracion-github-actions; then
                git rebase --abort || true
                break
              fi
              sleep 2
            done
            if [ "$PUSHED" -ne 1 ]; then
              echo "No se persistió el corte: no se publicará una versión distinta al repositorio."
              exit 1
            fi
          fi

      - name: Inyectar módulos operativos
        run: |
          if ! grep -q 'model_signal_v1.js' public/index.html; then
            sed -i 's#</body>#<script src="data/model_signal_v1.js?rev=SIGNAL1-20260831"></script></body>#' public/index.html
          fi
          if ! grep -q 'model_threshold_overlay_v1.js' public/index.html; then
            sed -i 's#</body>#<script src="data/model_threshold_overlay_v1.js?rev=THRESHOLD1-20260831"></script></body>#' public/index.html
          fi
          if ! grep -q 'model_health_v1.js' public/index.html; then
            sed -i 's#</body>#<script src="data/model_health_v1.js?rev=HEALTH1-20260831"></script></body>#' public/index.html
          fi
          if ! grep -q 'fixed_ticker_freshness_v1.js' public/index.html; then
            sed -i 's#</body>#<script src="data/fixed_ticker_freshness_v1.js?rev=LIVESTATUS4-20260903"></script></body>#' public/index.html
          fi
          sed -i 's#fixed_ticker_freshness_v1.js?rev=[^"]*#fixed_ticker_freshness_v1.js?rev=LIVESTATUS4-20260903#g' public/index.html

      - name: Verificar generación antes de desplegar
        run: python scripts/validate_fixed_models.py

      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Subir sitio actualizado
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Desplegar visor intradia
        uses: actions/deploy-pages@v4
