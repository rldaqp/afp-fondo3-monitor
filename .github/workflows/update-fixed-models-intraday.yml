name: Actualizar intradia modelos fijos

on:
  workflow_dispatch:
  push:
    branches:
      - migracion-github-actions
    paths:
      - ".github/workflows/update-fixed-models-intraday.yml"
      - "scripts/build_fixed_models_intraday.py"
      - "scripts/normalize_fixed_intraday_session.py"
      - "public/index.html"
      - "public/data/fixed_trade_runtime_v1.js"
      - "public/data/model_signal_v1.js"
      - "public/data/model_threshold_overlay_v1.js"
      - "public/data/model_health_v1.js"
      - "public/data/fixed_ticker_freshness_v1.js"
  schedule:
    - cron: "*/5 13-22 * * 1-5"
    # Salvaguardas de cierre. 20:07 UTC cubre el cierre cuando NY está en EDT
    # y 21:07 UTC cuando NY está en EST. Son ejecuciones adicionales al ciclo normal.
    - cron: "7 20 * * 1-5"
    - cron: "7 21 * * 1-5"
  workflow_run:
    workflows:
      - "Actualizar mercado intradia Fondo 3"
      - "Actualizar modelos fijos niveles y retornos"
    types:
      - completed

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: fixed-models-intraday
  cancel-in-progress: true

jobs:
  update:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: migracion-github-actions
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: pip install --disable-pip-version-check pandas numpy yfinance selenium

      - name: Calcular snapshot intradia fijo
        run: python scripts/build_fixed_models_intraday.py

      - name: Normalizar sesion antes de apertura
        run: python scripts/normalize_fixed_intraday_session.py

      - name: Validar snapshot
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("public/data/fixed_models_intraday.json").read_text(encoding="utf-8"))
          assert {x["ticker"] for x in d["tickers"]} == {"SPY","EEM","MCHI","QQQ","SPBLSCUP"}
          assert float(d["models"]["niveles"]["vc_intraday"]) > 0
          assert float(d["models"]["retornos"]["vc_intraday"]) > 0
          assert "16.07900257" in d["models"]["niveles"]["equation"]
          assert "0.0007122785" in d["models"]["retornos"]["equation"]
          assert abs(sum(x["level_weight_abs_pct"] for x in d["tickers"])-100) < 1e-6
          assert abs(sum(x["return_weight_abs_pct"] for x in d["tickers"])-100) < 1e-6
          assert d["mode"] in {"INTRADÍA","INTRADÍA PARCIAL","CIERRE / ÚLTIMO SNAPSHOT"}
          assert d.get("previous_close_rule")
          assert all(x.get("previous_close_basis") for x in d["tickers"])
          assert all(float(x["price_previous"]) > 0 and float(x["price_current"]) > 0 for x in d["tickers"])
          print("OK intradia", d["signal_date"], d["mode"], f"fresh={d.get('fresh_factors')}/{d.get('total_factors')}")
          print("BASES", {x["ticker"]:(x.get("previous_close_date"),x.get("previous_close_basis")) for x in d["tickers"]})
          if d.get("problems"):
              print("ADVERTENCIAS", d["problems"])
          PY

      - name: Guardar snapshot en rama
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/fixed_models_intraday.json
          if git diff --cached --quiet; then
            echo "Sin cambios intradia."
          else
            git commit -m "Actualizar intradia niveles y retornos"
            git fetch origin migracion-github-actions
            git rebase origin/migracion-github-actions
            git push origin HEAD:migracion-github-actions
          fi

      - name: Inyectar módulos operativos
        run: |
          if ! grep -q 'model_signal_v1.js' public/index.html; then
            sed -i 's#</body>#<script src="data/model_signal_v1.js?rev=SIGNAL1-20260831"></script></body>#' public/index.html
          fi
          if ! grep -q 'model_threshold_overlay_v1.js' public/index.html; then
            sed -i 's#</body>#<script src="data/model_threshold_overlay_v1.js?rev=THRESHOLD1-20260831"></script></body>#' public/index.html
          fi
          if ! grep -q 'model_health_v1.js' public/index.html; then
            sed -i 's#</body>#<script src="data/model_health_v1.js?rev=HEALTH1-20260831"></script></body>#' public/index.html
          fi
          if ! grep -q 'fixed_ticker_freshness_v1.js' public/index.html; then
            sed -i 's#</body>#<script src="data/fixed_ticker_freshness_v1.js?rev=LIVESTATUS3-20260902"></script></body>#' public/index.html
          fi
          sed -i 's#fixed_ticker_freshness_v1.js?rev=[^"]*#fixed_ticker_freshness_v1.js?rev=LIVESTATUS3-20260902#g' public/index.html

      - name: Publicar snapshot en gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tmp="$(mktemp -d)"
          git clone --depth 1 --branch gh-pages "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$tmp/gh-pages"
          mkdir -p "$tmp/gh-pages/data"
          cp public/index.html "$tmp/gh-pages/index.html"
          cp public/data/fixed_models_intraday.json "$tmp/gh-pages/data/fixed_models_intraday.json"
          cp public/data/model_signal_v1.js "$tmp/gh-pages/data/model_signal_v1.js"
          cp public/data/model_threshold_overlay_v1.js "$tmp/gh-pages/data/model_threshold_overlay_v1.js"
          cp public/data/model_health_v1.js "$tmp/gh-pages/data/model_health_v1.js"
          cp public/data/fixed_ticker_freshness_v1.js "$tmp/gh-pages/data/fixed_ticker_freshness_v1.js"
          if [ -f public/data/model_health.json ]; then cp public/data/model_health.json "$tmp/gh-pages/data/model_health.json"; fi
          cd "$tmp/gh-pages"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/fixed_models_intraday.json data/model_signal_v1.js data/model_threshold_overlay_v1.js data/model_health_v1.js data/fixed_ticker_freshness_v1.js
          if [ -f data/model_health.json ]; then git add data/model_health.json; fi
          if git diff --cached --quiet; then
            echo "gh-pages ya tiene snapshot y módulos."
          else
            git commit -m "Publicar intradia señal salud y estado horario"
            git push origin HEAD:gh-pages
          fi

      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Subir sitio actualizado
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Desplegar visor intradia
        uses: actions/deploy-pages@v4
