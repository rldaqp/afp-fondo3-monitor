name: Run exact 20-day 60/30 comparison

on:
  push:
    branches: [migracion-github-actions]
    paths:
      - '.github/workflows/run-exact20-comparison.yml'
      - 'scripts/recheck_6030_exact20.py'
      - 'data/analysis/googlefinance_alt_aligned_closes_20260402_20260820.csv'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migracion-github-actions
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy yfinance
      - run: python scripts/recheck_6030_exact20.py
      - name: Commit comparison outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/compare_6030_exact20.json data/analysis/compare_6030_exact20.csv
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Guardar comparación corregida 60/30 últimos 20 VC"
            git push origin HEAD:migracion-github-actions
          fi
