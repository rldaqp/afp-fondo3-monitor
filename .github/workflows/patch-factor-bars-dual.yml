name: Restaurar barras de pesos duales
on:
  push:
    branches:
      - migracion-github-actions
    paths:
      - '.github/workflows/patch-factor-bars-dual.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migracion-github-actions
      - name: Insertar paneles de pesos y aportes
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('public/index.html')
          s=p.read_text(encoding='utf-8')
          marker='<!-- FACTOR_BARS_DUAL_V1 -->'
          if marker in s:
              print('FACTOR_BARS_DUAL_V1 ya presente')
              raise SystemExit(0)
          block=r'''
          <!-- FACTOR_BARS_DUAL_V1 -->
          <style id="factorBarsDualStyles">
          .factorpanel{margin:8px 0 10px;padding:9px;background:#0b1728;border:1px solid #26364a;border-radius:10px}.factorpanel h3{margin:0 0 3px;font-size:.86rem}.factornote{font-size:.61rem;color:#9aa9bd;line-height:1.35;margin-bottom:8px}.factorrows{display:grid;gap:7px}.factorrow{display:grid;grid-template-columns:76px minmax(120px,1fr) 168px;gap:8px;align-items:center;font-size:.68rem}.factorname{font-weight:900;white-space:nowrap}.factortrack{height:10px;background:#172338;border-radius:999px;overflow:hidden;position:relative}.factorfill{height:100%;border-radius:999px;min-width:2px}.factorfill.pos{background:#22c55e}.factorfill.neg{background:#ef4444}.factorfill.zero{background:#64748b}.factorstat{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}.factorstat .beta{color:#cbd5e1}.factorstat .pp.pos{color:#4ade80}.factorstat .pp.neg{color:#f87171}.factorstat .pp.zero{color:#fbbf24}.factorfoot{font-size:.58rem;color:#7f8da3;margin-top:7px;line-height:1.35}@media(max-width:700px){.factorrow{grid-template-columns:62px 1fr 126px;gap:6px;font-size:.63rem}.factorstat{white-space:normal;line-height:1.25}.factortrack{height:9px}}
          </style>
          <script>
          (()=>{'use strict';
          const MODEL_KEYS=['qqq','new_tickers'];
          const safeNum=x=>Number.isFinite(Number(x))?Number(x):null;
          const parseRet=t=>{if(!t)return null;const m=String(t).replace(',','.').match(/([+-]?\d+(?:\.\d+)?)\s*%/);return m?Number(m[1])/100:null};
          const labelFor=(f,d)=>d||String(f).replace(/^ret_/,'').replace('_alt','');
          function chipReturn(key,label){const box=document.getElementById('tickerbar_'+key);if(!box)return null;for(const chip of box.querySelectorAll('.tickerchip')){const sym=(chip.querySelector('.sym')?.textContent||'').trim();if(sym===label||sym.replace(/^\./,'')===String(label).replace(/^\./,'')){return parseRet(chip.querySelector('.ret')?.textContent)}}return null}
          function panel(key,model){const host=document.getElementById('dM_'+key);if(!host||host.querySelector('.factorpanel'))return;const features=model.features||[],labels=model.features_display||[],coef=model.current?.coefficients||{};const rows=features.map((f,i)=>{const label=labelFor(f,labels[i]);const beta=safeNum(coef[f]);const ret=chipReturn(key,label);const pp=beta!==null&&ret!==null?beta*ret*100:null;return{f,label,beta,ret,pp}});const finite=rows.filter(r=>r.pp!==null);const max=Math.max(...finite.map(r=>Math.abs(r.pp)),0.000001);const box=document.createElement('div');box.className='factorpanel';box.innerHTML='<h3>Pesos y aporte de los factores · sesión actual</h3><div class="factornote">β = coeficiente OLS Rolling 30 vigente. Aporte = β × retorno observado del ticker. La longitud de la barra compara la magnitud del aporte dentro de cada modelo.</div><div class="factorrows">'+rows.map(r=>{const v=r.pp,w=v===null?0:Math.max(2,Math.abs(v)/max*100),cl=v===null||Math.abs(v)<1e-12?'zero':v>0?'pos':'neg',beta=r.beta===null?'—':(r.beta>=0?'+':'')+r.beta.toFixed(4),pp=v===null?'sin retorno':(v>=0?'+':'')+v.toFixed(3)+' pp';return `<div class="factorrow"><div class="factorname">${r.label}</div><div class="factortrack"><div class="factorfill ${cl}" style="width:${w.toFixed(1)}%"></div></div><div class="factorstat"><span class="beta">β ${beta}</span> · <span class="pp ${cl}">${pp}</span></div></div>`}).join('')+'</div><div class="factorfoot">Verde = aporte al alza del retorno estimado · rojo = aporte a la baja. El intercepto no se muestra como ticker.</div>';const charts=host.querySelector('.charts');if(charts)host.insertBefore(box,charts);else host.appendChild(box)}
          async function render(){try{const r=await fetch('data/dual_rolling30_monitor.json?weights='+Date.now(),{cache:'no-store'});if(!r.ok)return;const db=await r.json();let tries=0;const go=()=>{tries++;for(const k of MODEL_KEYS){const m=db.models?.[k];if(m)panel(k,m)}if(tries<12&&MODEL_KEYS.some(k=>!document.querySelector('#dM_'+k+' .factorpanel')))setTimeout(go,250)};setTimeout(go,250)}catch(e){console.warn('factor bars',e)}}
          if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',render);else render();
          })();
          </script>
          '''
          if '</body>' not in s:
              raise SystemExit('No se encontró </body>')
          s=s.replace('</body>',block+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          print('Paneles FACTOR_BARS_DUAL_V1 insertados')
          PY
      - name: Validar inserción
        run: |
          grep -q 'FACTOR_BARS_DUAL_V1' public/index.html
          grep -q 'Pesos y aporte de los factores' public/index.html
          grep -q "model.current?.coefficients" public/index.html
      - name: Publicar cambio
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html
          git commit -m 'Agregar barras horizontales de pesos a modelos A y B' || exit 0
          git push origin HEAD:migracion-github-actions
