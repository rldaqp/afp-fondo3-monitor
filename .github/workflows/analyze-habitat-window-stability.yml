name: Analyze Habitat window stability

on:
  push:
    branches: [migracion-github-actions]
    paths:
      - 'scripts/analyze_habitat_window_stability.py'
      - '.github/workflows/analyze-habitat-window-stability.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migracion-github-actions
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy
      - name: Run Habitat window diagnostic
        run: python scripts/analyze_habitat_window_stability.py
      - name: Commit diagnostic results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/habitat_window_stability.csv analysis/habitat_window_stability.json public/habitat/data/window_stability_diagnostic.json
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Update Habitat window stability diagnostic'
            git push origin HEAD:migracion-github-actions
          fi
