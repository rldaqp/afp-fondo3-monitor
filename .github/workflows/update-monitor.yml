name: Actualizar monitor Fondo 3

on:
  workflow_dispatch:
  schedule:
    # America/Lima = UTC-5. Estas dos reglas cubren lunes a viernes completos en Lima.
    - cron: "0 5-23 * * 1-5"
    - cron: "0 0-4 * * 2-6"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: fondo3-monitor
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Actualizar bases y generar monitor
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          python scripts/build_pages.py

      - name: Validar HTML publicado
        run: |
          test -s public/index.html
          grep -q "Monitor práctico" public/index.html
          grep -q "Vela intradía" public/index.html

      - name: Guardar datos actualizados en la rama
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data public
          if git diff --cached --quiet; then
            echo "No hay cambios de datos para confirmar."
          else
            git commit -m "Actualizar monitor Fondo 3"
            git push
          fi

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
