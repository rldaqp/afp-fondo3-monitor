name: Actualizar OLS Rolling 90 Fondo 3

on:
  workflow_dispatch:
  push:
    branches:
      - migracion-github-actions
    paths:
      - ".github/workflows/update-monitor.yml"
      - "scripts/build_rolling90_pages.py"
      - "scripts/run_rolling90_live_v2.py"
      - "scripts/apply_sbs_reference_corrections.py"
      - "scripts/finalize_notebook_parity_v4.py"
      - "scripts/finalize_notebook_parity_v5.py"
      - "scripts/finalize_fx_hybrid.py"
      - "scripts/build_model_insights.py"
      - "scripts/build_operation_series.py"
      - "scripts/postprocess_mobile_ui_v3.py"
      - "scripts/postprocess_mobile_ui_v4.py"
      - "scripts/postprocess_fx_hybrid_ui.py"
      - "scripts/postprocess_model_insights_ui.py"
      - "scripts/postprocess_trade_history.py"
      - "scripts/postprocess_trade_cloud_sync.py"
      - "scripts/postprocess_trade_notebook_basis.py"
      - "scripts/postprocess_live_consistency.py"
      - "data/rolling90/sbs_reference_corrections.csv"
      - "data/rolling90/notebook_training_reference.csv"
      - "requirements.txt"
  schedule:
    - cron: "0 5-23 * * 1-5"
    - cron: "0 0-4 * * 2-6"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: profuturo-rolling90-model
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: migracion-github-actions
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Actualizar únicamente Profuturo Fondo 3
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          python scripts/run_rolling90_live_v2.py
          python scripts/apply_sbs_reference_corrections.py
          python scripts/finalize_fx_hybrid.py
          python scripts/build_model_insights.py
          git restore --source=HEAD -- public/data/live_market.json || true
          python scripts/build_operation_series.py
          sed -i "s/calc.onclick=calc;/document.getElementById('calc').onclick=calc;/" public/index.html
          python scripts/postprocess_mobile_ui_v3.py
          python scripts/postprocess_mobile_ui_v4.py
          python scripts/postprocess_fx_hybrid_ui.py
          python scripts/postprocess_model_insights_ui.py
          python scripts/postprocess_trade_history.py
          python scripts/postprocess_trade_cloud_sync.py
          python scripts/postprocess_trade_notebook_basis.py
          python scripts/postprocess_live_consistency.py

      - name: Validar modelo y visor Profuturo
        run: |
          test -s public/index.html
          test -s public/data/latest.json
          test -s public/data/series.json
          test -s public/data/signals.json
          test -s public/data/operation_series.json
          test -s public/data/model_insights.json

          grep -q "OLS Rolling 90" public/index.html
          grep -q "7 días" public/index.html
          grep -q "15 días" public/index.html
          grep -q "30 días" public/index.html
          grep -q "90 días" public/index.html
          grep -q "vcAll" public/index.html
          grep -q "retAll" public/index.html
          grep -q "Mercado ahora" public/index.html
          grep -q "Tallo desde 0" public/index.html
          grep -q "operation_series.json" public/index.html
          grep -q "Fórmula notebook" public/index.html
          grep -q "Confianza y calidad del modelo" public/index.html
          grep -q "Histórico de entradas y salidas" public/index.html
          grep -q "Respaldo y sincronización en Google Drive" public/index.html
          grep -q "MARKET_INDICATORS_PRESERVED_V2" public/index.html
          ! grep -q "AFP_SELECTOR_V1" public/index.html

          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          latest = json.loads(Path("public/data/latest.json").read_text(encoding="utf-8"))
          signals = json.loads(Path("public/data/signals.json").read_text(encoding="utf-8"))
          operation = json.loads(Path("public/data/operation_series.json").read_text(encoding="utf-8"))
          insights = json.loads(Path("public/data/model_insights.json").read_text(encoding="utf-8"))
          pending = pd.read_csv("data/rolling90/pending_predictions.csv")

          assert latest["model"] == "OLS rolling 90"
          assert int(latest["window"]) == 90
          assert abs(float(latest["threshold"]) - 0.001) < 1e-12
          assert int(latest["training_n"]) == 90
          assert latest["training_start"] <= latest["training_end"]
          assert latest["signal"] in {"SUBE", "NEUTRO", "BAJA"}
          assert float(latest["latest_sbs_vc"]) > 0
          assert float(latest["latest_estimated_vc"]) > 0
          assert latest.get("parity_verified") is True
          assert "BCRP exclusivo para histórico/entrenamiento" in latest["parity_rule"]
          assert "Yahoo PEN=X provisional" in latest["parity_rule"]
          assert "Yahoo PEN=X" in latest["sources"]["fx"]
          assert latest.get("latest_fx_source")
          assert "Ventana canónica exacta" in latest.get("parity_reference", "")
          assert latest.get("live_engine") == "INDEPENDIENTE: update_live_market_hybrid.py"
          assert len(signals) > 1
          assert len(operation) > 1
          assert all(
              row.get("senal") in {"SUBE", "NEUTRO", "BAJA"}
              for row in signals
              if row.get("ret_estimado") is not None
          )
          assert all(float(row["vc"]) > 0 for row in operation)
          assert insights["quality"]["status"] in {"OK", "PROVISIONAL"}
          assert int(insights["quality"]["training_n"]) == 90
          assert insights["performance"]["window_n"] > 10

          if not pending.empty:
              assert "usd_pen_fuente" in pending.columns
              assert "usd_pen_provisional" in pending.columns
              yahoo = pending[
                  pending["usd_pen_fuente"].astype(str).str.startswith("YAHOO")
              ]
              if not yahoo.empty:
                  assert yahoo["usd_pen_provisional"].astype(str).str.lower().eq("true").all()
                  assert pd.to_numeric(
                      yahoo["ret_USD_PEN"], errors="coerce"
                  ).notna().all()

          print(json.dumps(latest, ensure_ascii=False, indent=2))
          print(f"Puntos de señal Profuturo: {len(signals)}")
          PY

      - name: Guardar únicamente resultados de Profuturo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rolling90 public/index.html public/data
          git reset public/data/live_market.json || true
          if git diff --cached --quiet; then
            echo "No hay cambios de Profuturo para confirmar."
          else
            git commit -m "Actualizar OLS rolling 90 Profuturo Fondo 3"
            git pull --rebase origin migracion-github-actions
            git push origin HEAD:migracion-github-actions
          fi

      - name: Actualizar rama antes de publicar
        run: |
          git fetch origin migracion-github-actions
          git reset --hard origin/migracion-github-actions

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir visor a Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Publicar visor
        id: deployment
        uses: actions/deploy-pages@v4
