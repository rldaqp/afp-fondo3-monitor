name: Actualizar OLS Rolling 90 Fondo 3

on:
  workflow_dispatch:
  push:
    branches:
      - migracion-github-actions
    paths:
      - ".github/workflows/update-monitor.yml"
      - "scripts/build_rolling90_pages.py"
      - "requirements.txt"
  schedule:
    # America/Lima = UTC-5. Se revisan nuevas publicaciones cada hora en días hábiles.
    - cron: "0 5-23 * * 1-5"
    - cron: "0 0-4 * * 2-6"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: fondo3-rolling90
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Descargar datos y recalibrar OLS rolling 90
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          python scripts/build_rolling90_pages.py
          sed -i "s/calc.onclick=calc;/document.getElementById('calc').onclick=calc;/" public/index.html

      - name: Validar modelo y visor
        run: |
          test -s public/index.html
          test -s public/data/latest.json
          test -s public/data/series.json
          grep -q "OLS Rolling 90" public/index.html
          grep -q "document.getElementById('calc').onclick=calc" public/index.html
          python - <<'PY'
          import json
          from pathlib import Path

          latest = json.loads(Path("public/data/latest.json").read_text(encoding="utf-8"))
          assert latest["model"] == "OLS rolling 90"
          assert int(latest["window"]) == 90
          assert abs(float(latest["threshold"]) - 0.001) < 1e-12
          assert int(latest["training_n"]) == 90
          assert latest["training_start"] <= latest["training_end"]
          assert latest["signal"] in {"SUBE", "NEUTRO", "BAJA"}
          assert float(latest["latest_sbs_vc"]) > 0
          assert float(latest["latest_estimated_vc"]) > 0
          print(json.dumps(latest, ensure_ascii=False, indent=2))
          PY

      - name: Guardar datos y resultados actualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rolling90 public
          if git diff --cached --quiet; then
            echo "No hay cambios de datos para confirmar."
          else
            git commit -m "Actualizar OLS rolling 90 Fondo 3"
            git push
          fi

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir visor a Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Publicar visor
        id: deployment
        uses: actions/deploy-pages@v4
