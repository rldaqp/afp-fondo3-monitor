name: Actualizar OLS Rolling 90 Fondo 3

on:
  workflow_dispatch:
  push:
    branches:
      - migracion-github-actions
    paths:
      - ".github/workflows/update-monitor.yml"
      - "scripts/build_rolling90_pages.py"
      - "scripts/run_rolling90_live_v2.py"
      - "scripts/apply_sbs_reference_corrections.py"
      - "scripts/finalize_notebook_parity_v4.py"
      - "scripts/finalize_notebook_parity_v5.py"
      - "scripts/finalize_fx_hybrid.py"
      - "scripts/run_finalize_fx_hybrid_resilient.py"
      - "scripts/complete_profuturo_signal_calendar.py"
      - "scripts/build_model_insights.py"
      - "scripts/build_reduced_6030_challenger.py"
      - "scripts/build_reduced_6030_history.py"
      - "scripts/postprocess_reduced_6030_ui.py"
      - "scripts/postprocess_reduced_6030_history_ui.py"
      - "scripts/build_vc_accuracy_1pct.py"
      - "scripts/build_operation_series.py"
      - "scripts/postprocess_mobile_ui_v3.py"
      - "scripts/postprocess_mobile_ui_v4.py"
      - "scripts/postprocess_fx_hybrid_ui.py"
      - "scripts/postprocess_model_insights_ui.py"
      - "scripts/postprocess_trade_history.py"
      - "scripts/postprocess_trade_cloud_sync.py"
      - "scripts/postprocess_trade_notebook_basis.py"
      - "scripts/postprocess_trade_cloud_fund_routing.py"
      - "scripts/postprocess_trade_runtime_fixes.py"
      - "scripts/postprocess_investment_signal_1pct.py"
      - "scripts/postprocess_live_consistency.py"
      - "data/rolling90/sbs_reference_corrections.csv"
      - "data/rolling90/notebook_training_reference.csv"
      - "requirements.txt"
  schedule:
    - cron: "0 5-23 * * 1-5"
    - cron: "0 0-4 * * 2-6"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: profuturo-rolling90-model
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: migracion-github-actions
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Actualizar únicamente Profuturo Fondo 3
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          python scripts/run_rolling90_live_v2.py
          python scripts/apply_sbs_reference_corrections.py
          python scripts/run_finalize_fx_hybrid_resilient.py
          python scripts/complete_profuturo_signal_calendar.py
          python scripts/build_model_insights.py
          python scripts/build_vc_accuracy_1pct.py
          # IMPORTANTE: el challenger debe leer el live_market recién generado.
          # No restaurar live_market antes de construirlo, porque eso lo deja un día atrás.
          python scripts/build_reduced_6030_challenger.py
          python scripts/build_operation_series.py
          sed -i "s/calc.onclick=calc;/document.getElementById('calc').onclick=calc;/" public/index.html
          python scripts/postprocess_mobile_ui_v3.py
          if grep -q "model_insights.json" public/index.html && grep -q "Confianza y calidad del modelo" public/index.html; then
            echo "El panel de indicadores del modelo ya está integrado; no se duplica."
          else
            python scripts/postprocess_model_insights_ui.py
          fi
          python scripts/postprocess_mobile_ui_v4.py
          python scripts/postprocess_fx_hybrid_ui.py
          python scripts/postprocess_trade_history.py
          python scripts/postprocess_trade_cloud_sync.py
          python scripts/postprocess_trade_notebook_basis.py
          python scripts/postprocess_live_consistency.py profuturo
          python scripts/postprocess_trade_runtime_fixes.py profuturo
          python scripts/postprocess_investment_signal_1pct.py
          python scripts/postprocess_reduced_6030_ui.py
          python scripts/postprocess_reduced_6030_history_ui.py

      - name: Validar modelo y visor Profuturo
        run: |
          test -s public/index.html
          test -s public/data/latest.json
          test -s public/data/series.json
          test -s public/data/signals.json
          test -s public/data/operation_series.json
          test -s public/data/model_insights.json
          test -s public/data/reduced_6030_challenger.json
          test -s public/data/reduced_6030_history.json
          test -s data/rolling90/reduced_6030_state.json
          test -s data/rolling90/reduced_6030_shadow.csv
          test -s public/data/vc_accuracy_1pct.json
          test -s data/rolling90/vc_accuracy_1pct.json
          test -s data/rolling90/historical_calendar_predictions.csv

          grep -q "OLS Rolling 90" public/index.html
          grep -q "7 días" public/index.html
          grep -q "15 días" public/index.html
          grep -q "30 días" public/index.html
          grep -q "90 días" public/index.html
          grep -q "vcAll" public/index.html
          grep -q "retAll" public/index.html
          grep -q "Mercado ahora" public/index.html
          grep -q "Tallo desde 0" public/index.html
          grep -q "operation_series.json" public/index.html
          grep -q "model_insights.json" public/index.html
          grep -q "Fórmula notebook" public/index.html
          grep -q "Confianza y calidad del modelo" public/index.html
          grep -q "60/30 SIN NEM-FCX + QQQ · CHALLENGER" public/index.html
          grep -q "r6030HistoryDate" public/index.html
          grep -q "reduced_6030_history.json" public/index.html
          ! grep -q "QQQ INCREMENTAL · CHALLENGER" public/index.html
          ! grep -q "Challenger Huber · paralelo" public/index.html
          grep -q "Histórico de entradas y salidas" public/index.html
          grep -q "Respaldo y sincronización en Google Drive" public/index.html
          grep -q "vcPrecisionCompact" public/index.html
          grep -q "Precisión VC:" public/index.html
          grep -q "data/vc_accuracy_1pct.json" public/index.html
          grep -q "data/reduced_6030_challenger.json" public/index.html
          ! grep -q "investmentSignal1PctPanel" public/index.html
          grep -q "MARKET_INDICATORS_PRESERVED_V2" public/index.html
          grep -q "raw.githubusercontent.com/rldaqp/afp-fondo3-monitor/migracion-github-actions/public/data/live_market.json" public/index.html
          grep -q "AKfycbxoYHkCu0cZPx_KsMlI0Jd5PEATgxBjZTR8oK8qs1cUjRHJbiK0t-bxkH5ACprgp81S7g/exec" public/index.html
          grep -q "fuente:'PENDIENTE'" public/index.html
          ! grep -q "No existe una fecha efectiva de entrada en la línea del monitor." public/index.html
          ! grep -q "AFP_SELECTOR_V1" public/index.html

          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          latest = json.loads(Path("public/data/latest.json").read_text(encoding="utf-8"))
          live = json.loads(Path("public/data/live_market.json").read_text(encoding="utf-8"))
          signals = json.loads(Path("public/data/signals.json").read_text(encoding="utf-8"))
          operation = json.loads(Path("public/data/operation_series.json").read_text(encoding="utf-8"))
          insights = json.loads(Path("public/data/model_insights.json").read_text(encoding="utf-8"))
          vc_accuracy = json.loads(Path("public/data/vc_accuracy_1pct.json").read_text(encoding="utf-8"))
          challenger = json.loads(Path("public/data/reduced_6030_challenger.json").read_text(encoding="utf-8"))
          history = json.loads(Path("public/data/reduced_6030_history.json").read_text(encoding="utf-8"))
          pending = pd.read_csv("data/rolling90/pending_predictions.csv")
          sbs = pd.read_csv("data/rolling90/sbs_profuturo_f3.csv")

          assert latest["model"] == "OLS rolling 90"
          assert int(latest["window"]) == 90
          assert abs(float(latest["threshold"]) - 0.001) < 1e-12
          assert int(latest["training_n"]) == 90
          assert latest["training_start"] <= latest["training_end"]
          assert latest["signal"] in {"SUBE", "NEUTRO", "BAJA"}
          assert float(latest["latest_sbs_vc"]) > 0
          assert float(latest["latest_estimated_vc"]) > 0
          assert latest.get("parity_verified") is True
          assert "BCRP exclusivo para histórico/entrenamiento" in latest["parity_rule"]
          assert "Yahoo PEN=X provisional" in latest["parity_rule"]
          assert "Yahoo PEN=X" in latest["sources"]["fx"]
          assert latest.get("latest_fx_source")
          assert "Ventana canónica exacta" in latest.get("parity_reference", "")
          assert latest.get("live_engine") in {
              "INDEPENDIENTE: update_live_market_hybrid.py",
              "INDEPENDIENTE: update_live_market_only.py",
          }
          assert len(signals) > 1
          assert len(operation) > 1
          assert all(
              row.get("senal") in {"SUBE", "NEUTRO", "BAJA"}
              for row in signals
              if row.get("ret_estimado") is not None
          )
          assert all(float(row["vc"]) > 0 for row in operation)
          assert insights["quality"]["status"] in {"OK", "PROVISIONAL"}
          assert int(insights["quality"]["training_n"]) == 90
          assert insights["performance"]["window_n"] > 10
          assert abs(float(vc_accuracy["threshold_signal_abs"]) - 0.01) < 1e-12
          assert abs(float(vc_accuracy["threshold_vc_error_abs"]) - 0.01) < 1e-12
          assert int(vc_accuracy["n"]) > 0
          assert 0 <= float(vc_accuracy["accuracy"]) <= 1

          assert challenger["challenger"]["signal"] in {"SUBE", "NEUTRO", "BAJA"}
          assert float(challenger["challenger"]["vc_estimated"]) > 0
          assert float(challenger["official"]["vc_estimated"]) > 0
          assert int(challenger["cycle"]["train_n"]) == 60
          assert int(challenger["cycle"]["freeze_horizon"]) == 30
          assert challenger["challenger"].get("blind_chain") is True
          assert challenger["challenger"].get("reanchored_with_latest_sbs") is False
          features = set(challenger["cycle"]["features"])
          assert "ret_QQQ" in features
          assert "ret_NEM" not in features
          assert "ret_FCX" not in features
          assert int(challenger["blind_backtest"]["n_blocks"]) > 0
          assert history.get("backtest_history"), "Historial ciego 60/30 vacío"

          sbs["fecha"] = pd.to_datetime(sbs["fecha"], errors="coerce")
          historical_signals = {
              pd.Timestamp(row["fecha"])
              for row in signals
              if row.get("tipo") == "HISTORICO"
              and row.get("ret_estimado") is not None
              and row.get("vc_estimado") is not None
          }
          assert historical_signals
          first_model_date = min(historical_signals)
          official_dates = set(
              sbs.loc[sbs["fecha"] >= first_model_date, "fecha"].dropna()
          )
          missing_signal_dates = sorted(official_dates - historical_signals)
          assert not missing_signal_dates, missing_signal_dates

          operation_by_date = {
              pd.Timestamp(row["fecha"]): row
              for row in operation
              if row.get("es_oficial") is True
          }
          missing_operation_dates = sorted(official_dates - set(operation_by_date))
          assert not missing_operation_dates, missing_operation_dates
          null_operation_dates = sorted(
              date_value
              for date_value in official_dates
              if operation_by_date[date_value].get("ret_estimado") is None
          )
          assert not null_operation_dates, null_operation_dates

          if not pending.empty:
              assert "usd_pen_fuente" in pending.columns
              assert "usd_pen_provisional" in pending.columns
              yahoo = pending[
                  pending["usd_pen_fuente"].astype(str).str.startswith("YAHOO")
              ]
              if not yahoo.empty:
                  assert yahoo["usd_pen_provisional"].astype(str).str.lower().eq("true").all()
                  assert pd.to_numeric(
                      yahoo["ret_USD_PEN"], errors="coerce"
                  ).notna().all()

          assert str(insights.get("generated_for")) == str(latest.get("latest_estimate_date")), (insights.get("generated_for"), latest.get("latest_estimate_date"))
          assert str(insights.get("current_signal")) == str(latest.get("signal")), (insights.get("current_signal"), latest.get("signal"))

          # El challenger sigue el corte intradía cuando el mercado está abierto;
          # fuera de mercado debe coincidir con el último cierre publicado.
          expected_challenger_date = str(live.get("signal_date")) if bool(live.get("market_open")) else str(latest.get("latest_estimate_date"))
          assert str(challenger.get("signal_date")) == expected_challenger_date, (challenger.get("signal_date"), expected_challenger_date)

          print(json.dumps(latest, ensure_ascii=False, indent=2))
          print(json.dumps(vc_accuracy, ensure_ascii=False, indent=2))
          print(json.dumps(challenger, ensure_ascii=False, indent=2))
          print(f"Puntos de señal Profuturo: {len(signals)}")
          print(f"Fechas oficiales con OLS completo: {len(official_dates)}")
          PY

      - name: Guardar únicamente resultados de Profuturo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rolling90 public/index.html public/data
          git reset public/data/live_market.json || true
          # Después de preparar exactamente los archivos de Profuturo, limpiamos
          # cualquier cambio lateral no staged. Esto evita que un HTML de Hábitat
          # impida el rebase y bloquee la publicación completa de Pages.
          git restore --worktree -- .
          if git diff --cached --quiet; then
            echo "No hay cambios de Profuturo para confirmar."
          else
            git commit -m "Completar calendario OLS Profuturo Fondo 3"
            git pull --rebase origin migracion-github-actions
            git push origin HEAD:migracion-github-actions
          fi

      - name: Actualizar rama antes de publicar
        run: |
          git fetch origin migracion-github-actions
          git reset --hard origin/migracion-github-actions

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir visor a Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Publicar visor
        id: deployment
        uses: actions/deploy-pages@v4
