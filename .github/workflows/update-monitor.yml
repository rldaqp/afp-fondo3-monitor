name: Actualizar OLS Rolling 90 Fondo 3

on:
  workflow_dispatch:
  push:
    branches:
      - migracion-github-actions
    paths:
      - ".github/workflows/update-monitor.yml"
      - "scripts/build_rolling90_pages.py"
      - "scripts/run_rolling90_live_v2.py"
      - "scripts/apply_sbs_reference_corrections.py"
      - "scripts/finalize_notebook_parity_v4.py"
      - "scripts/build_operation_series.py"
      - "scripts/postprocess_mobile_ui_v3.py"
      - "scripts/postprocess_mobile_ui_v4.py"
      - "data/rolling90/sbs_reference_corrections.csv"
      - "requirements.txt"
  schedule:
    # Sesión NY: snapshot Yahoo cada 5 minutos (puede haber retrasos propios de GitHub Actions).
    - cron: "*/5 13-21 * * 1-5"
    # Fuera de sesión: revisar SBS y cierres cada hora.
    - cron: "0 5-12,22-23 * * 1-5"
    - cron: "0 0-4 * * 2-6"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: fondo3-rolling90
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Descargar datos y ejecutar rolling 90 con paridad notebook
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          # Primera pasada: descarga SBS/mercados y conserva el histórico.
          python scripts/run_rolling90_live_v2.py
          # Corrige dos observaciones SBS detectadas al comparar con el HTML real
          # del notebook: 07/07 faltante y 15/07 mal asociado.
          python scripts/apply_sbs_reference_corrections.py
          # Autoridad matemática: replica monitor_final.py sobre la base corregida.
          python scripts/finalize_notebook_parity_v4.py
          python scripts/build_operation_series.py
          sed -i "s/calc.onclick=calc;/document.getElementById('calc').onclick=calc;/" public/index.html
          python scripts/postprocess_mobile_ui_v3.py
          python scripts/postprocess_mobile_ui_v4.py

      - name: Validar modelo y visor final
        run: |
          test -s public/index.html
          test -s public/data/latest.json
          test -s public/data/series.json
          test -s public/data/signals.json
          test -s public/data/live_market.json
          test -s public/data/operation_series.json
          grep -q "OLS Rolling 90" public/index.html
          grep -q "7 días" public/index.html
          grep -q "15 días" public/index.html
          grep -q "30 días" public/index.html
          grep -q "90 días" public/index.html
          grep -q "vcAll" public/index.html
          grep -q "ret7" public/index.html
          grep -q "ret15" public/index.html
          grep -q "ret30" public/index.html
          grep -q "ret90" public/index.html
          grep -q "retAll" public/index.html
          grep -q "Mercado ahora" public/index.html
          grep -q "Tallo desde 0" public/index.html
          grep -q "operation_series.json" public/index.html
          grep -q "Fórmula notebook" public/index.html
          grep -q "Retorno estimado del VC" public/index.html
          grep -q "calcNotebook" public/index.html
          grep -q "showlegend:false" public/index.html
          grep -q "USD/PEN del MODELO: BCRP" public/index.html
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          latest = json.loads(Path("public/data/latest.json").read_text(encoding="utf-8"))
          signals = json.loads(Path("public/data/signals.json").read_text(encoding="utf-8"))
          live = json.loads(Path("public/data/live_market.json").read_text(encoding="utf-8"))
          operation = json.loads(Path("public/data/operation_series.json").read_text(encoding="utf-8"))

          assert latest["model"] == "OLS rolling 90"
          assert int(latest["window"]) == 90
          assert abs(float(latest["threshold"]) - 0.001) < 1e-12
          assert int(latest["training_n"]) == 90
          assert latest["training_start"] <= latest["training_end"]
          assert latest["signal"] in {"SUBE", "NEUTRO", "BAJA"}
          assert float(latest["latest_sbs_vc"]) > 0
          assert float(latest["latest_estimated_vc"]) > 0
          assert latest.get("parity_verified") is True
          assert "BCRP exclusivo" in latest["parity_rule"]
          assert "0 % provisional" in latest["parity_rule"]
          assert "PEN=X nunca sustituye" in latest["sources"]["fx"]
          assert len(signals) > 1
          assert len(operation) > 1
          assert live["mode"]
          assert live["signal"] in {"SUBE", "NEUTRO", "BAJA"}
          asset_names = {x.get("serie") for x in live.get("assets", [])}
          assert asset_names == {"SPY", "NEM", "FCX", "EPU", "MCHI", "USD_PEN"}, asset_names
          if live.get("market_open"):
              assert live.get("action") == "ESPERAR"
          assert all(x.get("senal") in {"SUBE", "NEUTRO", "BAJA"} for x in signals if x.get("ret_estimado") is not None)
          assert all(float(x["vc"]) > 0 for x in operation)

          # Prueba de regresión contra el HTML real del notebook aportado por el usuario.
          # Solo se aplica mientras la última SBS siga siendo 20/07/2026; cuando SBS
          # avance, el modelo debe recalcular desde la nueva base oficial.
          if latest.get("latest_sbs_date") == "2026-07-20":
              assert latest["training_start"] == "2026-02-27", latest
              pending = pd.read_csv("data/rolling90/pending_predictions.csv")
              pending["fecha"] = pd.to_datetime(pending["fecha"]).dt.strftime("%Y-%m-%d")
              expected = {
                  "2026-07-21": 69.65879107720521,
                  "2026-07-22": 70.43398277251534,
              }
              for fecha, vc_ref in expected.items():
                  row = pending.loc[pending["fecha"] == fecha]
                  assert not row.empty, f"Falta predicción {fecha}"
                  vc = float(row.iloc[-1]["valor_cuota_estimado"])
                  assert abs(vc - vc_ref) < 1e-7, (fecha, vc, vc_ref)

          print(json.dumps(latest, ensure_ascii=False, indent=2))
          print(json.dumps(live, ensure_ascii=False, indent=2))
          print(f"Puntos de señal publicados: {len(signals)}")
          print(f"Filas de operación tipo notebook: {len(operation)}")
          PY

      - name: Guardar datos y resultados actualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add data/rolling90 public
          if git diff --cached --quiet; then
            echo "No hay cambios de datos para confirmar."
          else
            git commit -m "Actualizar OLS rolling 90 Fondo 3"
            git push
          fi

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir visor a Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Publicar visor
        id: deployment
        uses: actions/deploy-pages@v4
