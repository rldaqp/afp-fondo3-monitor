name: Calcular VC sin NEM ni FCX 2026-08-19

on:
  workflow_dispatch:
  push:
    branches:
      - migracion-github-actions
    paths:
      - "scripts/calc_custom_no_nem_fcx_20260819.py"
      - ".github/workflows/calc-custom-no-nem-fcx-20260819.yml"

permissions:
  contents: write

concurrency:
  group: calc-custom-no-nem-fcx-20260819
  cancel-in-progress: true

jobs:
  calculate:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: migracion-github-actions
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Calcular variantes
        run: python scripts/calc_custom_no_nem_fcx_20260819.py

      - name: Guardar resultado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/custom_no_nem_fcx_20260819.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Guardar cálculo VC sin NEM ni FCX"
            git pull --rebase origin migracion-github-actions
            git push origin HEAD:migracion-github-actions
          fi
