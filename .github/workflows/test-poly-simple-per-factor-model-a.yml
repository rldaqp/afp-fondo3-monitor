name: Probar polinomiales simples por factor Modelo A
on:
  workflow_dispatch:
  push:
    branches: [migracion-github-actions]
    paths:
      - scripts/test_poly_simple_per_factor_model_a.py
      - .github/workflows/test-poly-simple-per-factor-model-a.yml
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migracion-github-actions
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy
      - name: Ejecutar
        run: python scripts/test_poly_simple_per_factor_model_a.py
      - name: Guardar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/test_poly_simple_per_factor_model_a.json
          if ! git diff --cached --quiet; then
            git commit -m "Guardar prueba polinomiales simples por factor"
            git push origin HEAD:migracion-github-actions
          fi
