name: Actualizar nuevo 60/30 reanclado

on:
  workflow_dispatch:
  push:
    branches:
      - migracion-github-actions
    paths:
      - ".github/workflows/update-alt6030-reanchored.yml"
      - "scripts/patch_spblscup_google_selenium.py"
      - "scripts/build_alt_6030_reanchored.py"
      - "data/rolling90/sbs_reference_corrections.csv"
      - "data/rolling90/sbs_profuturo_f3.csv"
      - "requirements-live.txt"
  schedule:
    # Dos minutos después de la malla principal de mercado para leer su snapshot más reciente.
    - cron: "2-57/5 13-23 * * 1-5"

permissions:
  contents: write

concurrency:
  group: fondo3-data-writes
  cancel-in-progress: false

jobs:
  alt6030:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: migracion-github-actions
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-live.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-live.txt
          google-chrome --version || chromium --version || true

      - name: Actualizar SPBLSCUP y nuevo modelo
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin migracion-github-actions
          git reset --hard origin/migracion-github-actions

          # Si SBS está rezagado por Incapsula, aplicar primero las referencias
          # oficiales verificadas. Así el nuevo 60/30 se reancla con el VC real
          # más reciente y no mantiene una cadena estimada innecesaria.
          python scripts/apply_sbs_reference_corrections.py
          python scripts/patch_spblscup_google_selenium.py
          python scripts/build_alt_6030_reanchored.py

          python - <<'PY'
          import json
          from pathlib import Path

          live = json.loads(Path("public/data/live_market.json").read_text(encoding="utf-8"))
          alt = json.loads(Path("public/data/alt_6030_experimental.json").read_text(encoding="utf-8"))

          assert alt["model"]["reanchored_with_latest_sbs"] is True, alt
          assert alt["model"]["blind_chain"] is False, alt
          assert int(alt["cycle"]["train_n"]) == 60, alt
          assert int(alt["cycle"]["freeze_horizon"]) == 30, alt
          assert alt["signal_date"] == live["signal_date"], (alt, live)
          assert alt["model"]["signal"] in {"SUBE", "NEUTRO", "BAJA"}, alt
          assert float(alt["model"]["vc_estimated"]) > 0, alt
          assert "BCRP PD04638PD" in alt["cycle"]["fx_training_source"], alt

          sp = next((x for x in live.get("experimental_assets", []) if x.get("serie") == "SPBLSCUP"), None)
          assert sp is not None, live
          assert sp.get("retorno") is not None, "SPBLSCUP sigue sin retorno; no se publica 0% artificial"
          print("Nuevo 60/30:", alt["signal_date"], alt["model"]["vc_estimated"], alt["model"]["return_estimated"])
          print("Ancla SBS:", alt["model"]["sbs_anchor_date"], alt["model"]["sbs_anchor_vc"])
          print("SPBLSCUP:", sp.get("precio_actual"), sp.get("retorno"), sp.get("estado"))
          print("FX:", alt.get("fx_operational"))
          PY

          git add data/rolling90/sbs_profuturo_f3.csv public/data/live_market.json public/data/alt_6030_experimental.json data/rolling90/alt_6030_shadow.csv
          if git diff --cached --quiet; then
            echo "Nuevo 60/30 sin cambios."
          else
            git commit -m "Actualizar nuevo 60/30 reanclado"
            if ! git push origin HEAD:migracion-github-actions; then
              git pull --rebase origin migracion-github-actions
              git push origin HEAD:migracion-github-actions
            fi
          fi

          # Publicación rápida de los dos snapshots sin esperar un redeploy completo de Pages.
          tmp="$(mktemp -d)"
          git clone --depth 1 --branch gh-pages "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$tmp/gh-pages"
          mkdir -p "$tmp/gh-pages/data"
          cp public/data/live_market.json "$tmp/gh-pages/data/live_market.json"
          cp public/data/alt_6030_experimental.json "$tmp/gh-pages/data/alt_6030_experimental.json"
          cd "$tmp/gh-pages"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live_market.json data/alt_6030_experimental.json
          if git diff --cached --quiet; then
            echo "gh-pages ya tiene el nuevo 60/30 vigente."
          else
            git commit -m "Publicar nuevo 60/30 reanclado"
            git push origin HEAD:gh-pages
          fi
