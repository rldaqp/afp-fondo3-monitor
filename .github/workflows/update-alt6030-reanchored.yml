name: Actualizar SBS y visor dual Rolling 30

on:
  workflow_dispatch:
  push:
    branches:
      - migracion-github-actions
    paths:
      - ".github/workflows/update-alt6030-reanchored.yml"
      - "public/index.html"
      - "scripts/sync_sbs_official_latest.py"
      - "scripts/apply_sbs_reference_corrections.py"
      - "scripts/update_live_market_hybrid.py"
      - "scripts/normalize_markets_bcrp_for_rolling30.py"
      - "scripts/patch_google_rolling30_assets.py"
      - "scripts/validate_new_ticker_session.py"
      - "scripts/finalize_profuturo_close.py"
      - "scripts/build_dual_rolling30_monitor.py"
      - "scripts/build_dual_rolling30_resilient.py"
      - "scripts/patch_dual_rolling30_fx_operational.py"
      - "scripts/persist_dual_rolling30_shadow.py"
      - "data/rolling90/sbs_profuturo_f3.csv"
      - "analysis/backtest_blind3_rolling30_resid_newtickers.json"
      - "requirements-live.txt"
  schedule:
    - cron: "2-57/5 13-23 * * 1-5"
    - cron: "2-57/5 0-4 * * 2-6"

permissions:
  contents: write

concurrency:
  group: fondo3-data-writes
  cancel-in-progress: false

jobs:
  dual30:
    runs-on: ubuntu-latest
    timeout-minutes: 14

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: migracion-github-actions
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-live.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-live.txt
          google-chrome --version || chromium --version || true

      - name: Actualizar SBS mercado y dos Rolling 30
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin migracion-github-actions
          git reset --hard origin/migracion-github-actions

          python scripts/sync_sbs_official_latest.py || echo "SBS temporalmente no disponible; se conserva el último VC oficial guardado."
          python scripts/apply_sbs_reference_corrections.py
          python scripts/update_live_market_hybrid.py

          # Fuente FX histórica del Modelo A/B: TC Sistema bancario SBS Venta
          # (BCRP PD04640PD). Los n.d. ya publicados se completan con el último
          # SBS Venta oficial; no se usa PD04638PD ni Yahoo PEN=X para entrenar.
          python scripts/normalize_markets_bcrp_for_rolling30.py

          python scripts/patch_google_rolling30_assets.py || echo "Google Finance parcial; se conserva el respaldo vigente para este corte."
          python scripts/validate_new_ticker_session.py || true

          # Una sesión ya cerrada se finaliza con cierres diarios exactos y
          # TuCambista de la misma fecha. Así el ciclo de 5 minutos no puede
          # reintroducir capturas 15:55 ni el USD/PEN de otro día.
          python scripts/finalize_profuturo_close.py

          python scripts/build_dual_rolling30_resilient.py
          python scripts/patch_dual_rolling30_fx_operational.py
          python scripts/persist_dual_rolling30_shadow.py

          python - <<'PY'
          import json
          import pandas as pd
          from pathlib import Path

          live = json.loads(Path('public/data/live_market.json').read_text(encoding='utf-8'))
          dual = json.loads(Path('public/data/dual_rolling30_monitor.json').read_text(encoding='utf-8'))
          status = json.loads(Path('public/data/sbs_sync_status.json').read_text(encoding='utf-8'))
          html = Path('public/index.html').read_text(encoding='utf-8')

          assert set(dual['models']) == {'qqq', 'new_tickers'}, dual.keys()
          assert dual['signal_date'] == live['signal_date'], (dual['signal_date'], live['signal_date'])
          assert float(dual['latest_sbs']['vc']) > 0
          assert status['source'].startswith('SBS OFICIAL')
          validation = live.get('new_ticker_validation', {})
          assert validation.get('status') in {'OK', 'COMPLETO/VALIDADO'}, validation
          assert 'V6-daily' in html
          assert 'Modelo A · Rolling 30 + QQQ' in html
          assert 'Modelo B · Rolling 30 + nuevos tickers' in html
          assert 'Mercado ahora · factores realmente usados' in html

          # Control explícito de la serie SBS Venta PD04640PD y de los n.d.
          mk = pd.read_csv('data/rolling90/markets.csv')
          mk['fecha'] = pd.to_datetime(mk['fecha'], errors='coerce').dt.strftime('%Y-%m-%d')
          expected_fx = {
              '2026-07-23': 3.404,
              '2026-07-27': 3.411,
              '2026-07-28': 3.411,
              '2026-07-29': 3.411,
              '2026-08-06': 3.394,
              '2026-08-17': 3.370,
          }
          for date, value in expected_fx.items():
              row = mk.loc[mk['fecha'].eq(date), 'USD_PEN']
              if not row.empty:
                  assert abs(float(row.iloc[-1]) - value) < 1e-12, (date, row.iloc[-1], value)

          for key in ('qqq', 'new_tickers'):
              model = dual['models'][key]
              cur = model['current']
              assert int(cur['train_n']) == 30, (key, cur)
              assert cur['signal'] in {'SUBE', 'NEUTRO', 'BAJA'}
              assert float(cur['vc_estimated']) > 0
              assert model.get('history_one_step'), key
              assert model.get('intraday_assets'), key
              assert 'history_operational' in model
              assert 'operational_metrics' in model

          expected_date = str(dual['signal_date'])[:10]
          bassets = dual['models']['new_tickers']['intraday_assets']
          for name in ('.INX','CPER','EEM','NDX','SPBLSCUP','USD/PEN'):
              row = next(a for a in bassets if str(a.get('serie')) == name)
              assert str(row.get('timestamp',''))[:10] == expected_date, row
              assert 'NO VALIDADO' not in str(row.get('estado','')).upper(), row
          fx_a = next(a for a in dual['models']['qqq']['intraday_assets'] if str(a.get('serie')) == 'USD_PEN')
          fx_b = next(a for a in bassets if str(a.get('serie')) == 'USD/PEN')
          assert abs(float(fx_a['precio_actual']) - float(fx_b['precio_actual'])) < 1e-12
          assert 'YAHOO' not in str(fx_a.get('estado','')).upper()
          assert 'YAHOO' not in str(fx_b.get('estado','')).upper()
          if not bool(dual.get('shared_fx_operational', {}).get('provisional')):
              assert 'PD04640PD' in str(fx_a.get('estado','')), fx_a
              assert 'SBS VENTA' in str(fx_a.get('estado','')).upper(), fx_a
          if expected_date == '2026-08-28':
              assert abs(float(fx_a['precio_actual']) - 3.3535) < 1e-12, fx_a
              assert abs(float(fx_b['precio_actual']) - 3.3535) < 1e-12, fx_b
              assert '3.339/3.368' in str(fx_b.get('estado','')), fx_b

          print('VISOR VALIDADO:', expected_date)
          print('Modelo B:', [(a.get('serie'), a.get('precio_actual'), a.get('estado')) for a in bassets])
          print('FX común:', fx_a.get('precio_actual'), fx_a.get('estado'))
          PY

          git add \
            data/rolling90/sbs_profuturo_f3.csv \
            data/rolling90/markets.csv \
            data/rolling90/dual_rolling30_shadow.csv \
            public/data/sbs_sync_status.json \
            public/data/live_market.json \
            public/data/dual_rolling30_monitor.json
          if test -f data/rolling90/bcrp_pd04640_cache.csv; then
            git add data/rolling90/bcrp_pd04640_cache.csv
          fi
          if test -f data/analysis/rolling30_bcrp_normalization.json; then
            git add data/analysis/rolling30_bcrp_normalization.json
          fi
          if test -f data/analysis/googlefinance_alt_rolling30_live_returns.csv; then
            git add data/analysis/googlefinance_alt_rolling30_live_returns.csv
          fi

          if git diff --cached --quiet; then
            echo "Sin cambios para guardar."
          else
            git commit -m "Actualizar SBS y dos modelos Rolling 30"
            PUSHED=0
            for attempt in 1 2 3; do
              if git push origin HEAD:migracion-github-actions; then PUSHED=1; break; fi
              echo "Rama ocupada; reintento ${attempt}/3..."
              git reset --hard HEAD
              git clean -fd
              if ! git pull --rebase origin migracion-github-actions; then git rebase --abort || true; fi
              sleep 2
            done
            if [ "$PUSHED" -ne 1 ]; then echo "La rama siguió ocupada. El siguiente ciclo automático reintentará."; fi
          fi

          tmp="$(mktemp -d)"
          if git clone --depth 1 --branch gh-pages "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$tmp/gh-pages"; then
            mkdir -p "$tmp/gh-pages/data"
            cp public/index.html "$tmp/gh-pages/index.html"
            cp public/data/live_market.json "$tmp/gh-pages/data/live_market.json"
            cp public/data/dual_rolling30_monitor.json "$tmp/gh-pages/data/dual_rolling30_monitor.json"
            cp public/data/sbs_sync_status.json "$tmp/gh-pages/data/sbs_sync_status.json"
            cd "$tmp/gh-pages"
            grep -q "V6-daily" index.html
            grep -q "Mercado ahora · factores realmente usados" index.html
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html data/live_market.json data/dual_rolling30_monitor.json data/sbs_sync_status.json
            if git diff --cached --quiet; then
              echo "gh-pages ya está actualizado, incluida la interfaz V6."
            else
              git commit -m "Publicar visor dual Rolling 30 V6"
              git push origin HEAD:gh-pages || echo "Publicación rápida pendiente; se reintentará automáticamente."
            fi
          else
            echo "No se pudo clonar gh-pages; se reintentará automáticamente."
          fi
