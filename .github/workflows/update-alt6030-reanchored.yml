name: Actualizar nuevo 60/30 reanclado

on:
  workflow_dispatch:
  push:
    branches:
      - migracion-github-actions
    paths:
      - ".github/workflows/update-alt6030-reanchored.yml"
      - "scripts/sync_sbs_official_latest.py"
      - "scripts/patch_spblscup_google_selenium.py"
      - "scripts/build_alt_6030_reanchored.py"
      - "scripts/apply_sbs_reference_corrections.py"
      - "data/rolling90/sbs_reference_corrections.csv"
      - "data/rolling90/sbs_profuturo_f3.csv"
      - "public/data/audit_runtime_v1.js"
      - "requirements-live.txt"
  schedule:
    # Revisa mercado y SBS cada 5 minutos en días hábiles.
    # 13:00-23:57 UTC = 08:00-18:57 Lima.
    - cron: "2-57/5 13-23 * * 1-5"
    # Continúa por la noche de Lima para captar publicaciones tardías de SBS.
    # 00:00-04:57 UTC = 19:00-23:57 Lima del día anterior.
    - cron: "2-57/5 0-4 * * 2-6"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: fondo3-data-writes
  cancel-in-progress: false

jobs:
  alt6030:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: migracion-github-actions
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-live.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-live.txt
          google-chrome --version || chromium --version || true

      - name: Sincronizar SBS, SPBLSCUP y nuevo modelo
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin migracion-github-actions
          git reset --hard origin/migracion-github-actions

          python scripts/sync_sbs_official_latest.py
          python scripts/apply_sbs_reference_corrections.py
          python scripts/patch_spblscup_google_selenium.py
          python scripts/build_alt_6030_reanchored.py

          python - <<'PY'
          import json
          from pathlib import Path

          live = json.loads(Path("public/data/live_market.json").read_text(encoding="utf-8"))
          alt = json.loads(Path("public/data/alt_6030_experimental.json").read_text(encoding="utf-8"))
          sbs_status = json.loads(Path("public/data/sbs_sync_status.json").read_text(encoding="utf-8"))

          assert alt["model"]["reanchored_with_latest_sbs"] is True, alt
          assert alt["model"]["blind_chain"] is False, alt
          assert int(alt["cycle"]["train_n"]) == 60, alt
          assert int(alt["cycle"]["freeze_horizon"]) == 30, alt
          assert alt["signal_date"] == live["signal_date"], (alt, live)
          assert alt["model"]["signal"] in {"SUBE", "NEUTRO", "BAJA"}, alt
          assert float(alt["model"]["vc_estimated"]) > 0, alt
          assert "BCRP PD04638PD" in alt["cycle"]["fx_training_source"], alt
          assert sbs_status["source"].startswith("SBS OFICIAL"), sbs_status

          sp = next((x for x in live.get("experimental_assets", []) if x.get("serie") == "SPBLSCUP"), None)
          assert sp is not None, live
          assert sp.get("retorno") is not None, "SPBLSCUP sigue sin retorno; no se publica 0% artificial"
          print("SBS remoto:", sbs_status["latest_remote_date"], sbs_status["latest_remote_vc_profuturo_f3"], sbs_status["method"])
          print("Nuevo 60/30:", alt["signal_date"], alt["model"]["vc_estimated"], alt["model"]["return_estimated"])
          print("Ancla SBS:", alt["model"]["sbs_anchor_date"], alt["model"]["sbs_anchor_vc"])
          print("SPBLSCUP:", sp.get("precio_actual"), sp.get("retorno"), sp.get("estado"))
          print("FX:", alt.get("fx_operational"))
          PY

          git add \
            data/rolling90/sbs_profuturo_f3.csv \
            public/data/sbs_sync_status.json \
            public/data/live_market.json \
            public/data/alt_6030_experimental.json \
            data/rolling90/alt_6030_shadow.csv
          if git diff --cached --quiet; then
            echo "Nuevo 60/30 sin cambios."
          else
            git commit -m "Actualizar SBS y nuevo 60/30 reanclado"
            if ! git push origin HEAD:migracion-github-actions; then
              git pull --rebase origin migracion-github-actions
              git push origin HEAD:migracion-github-actions
            fi
          fi

          tmp="$(mktemp -d)"
          git clone --depth 1 --branch gh-pages "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$tmp/gh-pages"
          mkdir -p "$tmp/gh-pages/data"
          cp public/data/live_market.json "$tmp/gh-pages/data/live_market.json"
          cp public/data/alt_6030_experimental.json "$tmp/gh-pages/data/alt_6030_experimental.json"
          cp public/data/sbs_sync_status.json "$tmp/gh-pages/data/sbs_sync_status.json"
          cd "$tmp/gh-pages"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live_market.json data/alt_6030_experimental.json data/sbs_sync_status.json
          if git diff --cached --quiet; then
            echo "gh-pages ya tiene el estado vigente."
          else
            git commit -m "Publicar SBS y nuevo 60/30 reanclado"
            git push origin HEAD:gh-pages
          fi

      - name: Preparar visor con runtime vigente
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('public/index.html')
          html = path.read_text(encoding='utf-8')
          tags = [
              '<script src="data/alt_runtime_v5.js?rev=ALT6030V5"></script>',
              '<script src="data/spblscup_stale_fix.js?rev=SPBLCLOSEV1"></script>',
              '<script src="data/visor_hotfix_v1.js?rev=VISORHOTFIX1"></script>',
              '<script src="data/audit_runtime_v1.js?rev=AUDITV1"></script>',
          ]
          for tag in tags:
              if tag not in html:
                  html = html.replace('</body>', tag + '\n</body>', 1)
          path.write_text(html, encoding='utf-8')
          for token in ('alt_runtime_v5.js', 'spblscup_stale_fix.js', 'visor_hotfix_v1.js', 'audit_runtime_v1.js'):
              assert token in html, token
          PY
          test -s public/data/alt_runtime_v5.js
          test -s public/data/spblscup_stale_fix.js
          test -s public/data/visor_hotfix_v1.js
          test -s public/data/audit_runtime_v1.js
          test -s public/data/sbs_sync_status.json
          test -s public/data/alt_6030_experimental.json
          grep -q "Registrar operación" public/data/alt_runtime_v5.js
          grep -q "saveCurrentHotfix" public/data/visor_hotfix_v1.js
          grep -q "updateTopSbs" public/data/visor_hotfix_v1.js
          grep -q "updateAudit" public/data/audit_runtime_v1.js

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir visor actualizado
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Publicar visor actualizado
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Registrar despliegue automático
        if: success()
        env:
          DEPLOY_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin migracion-github-actions
          git reset --hard origin/migracion-github-actions
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          p = Path('public/data/alt6030_deploy_status.json')
          p.write_text(json.dumps({
              'deployed_at_utc': datetime.now(timezone.utc).isoformat(),
              'runtime': 'ALT6030V5+SPBLCLOSEV1+VISORHOTFIX1+AUDITV1',
              'page_url': os.environ.get('DEPLOY_URL'),
          }, ensure_ascii=False, indent=2), encoding='utf-8')
          PY
          git add public/data/alt6030_deploy_status.json
          git commit -m "Registrar despliegue automático SBS 60/30" || true
          git pull --rebase origin migracion-github-actions || true
          git push origin HEAD:migracion-github-actions || true
