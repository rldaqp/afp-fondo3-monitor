name: Probar divergencias de signo solamente

on:
  push:
    branches:
      - migracion-github-actions
    paths:
      - "scripts/test_sign_divergence_only.py"
      - ".github/workflows/test-sign-divergence-only.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profuturo-sign-divergence-only
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: migracion-github-actions
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar prueba
        run: python scripts/test_sign_divergence_only.py

      - name: Guardar resultados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/sign_divergence_only_test.json analysis/sign_divergence_days.csv
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Actualizar prueba de divergencias de signo"
            git pull --rebase origin migracion-github-actions
            git push origin HEAD:migracion-github-actions
          fi
