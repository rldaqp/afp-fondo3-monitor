name: Analizar GDX activacion y 27-28 agosto
on:
  push:
    branches: [migracion-github-actions]
    paths:
      - 'scripts/analyze_gdx_activation_aug28.py'
      - '.github/workflows/analyze-gdx-activation-aug28.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migracion-github-actions
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy yfinance
      - run: python scripts/analyze_gdx_activation_aug28.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/gdx_activation_aug28.json analysis/gdx_activation_aug28_daily.csv
          git diff --cached --quiet || git commit -m 'Guardar analisis GDX y 27-28 agosto'
          git pull --rebase origin migracion-github-actions
          git push origin HEAD:migracion-github-actions
