name: Actualizar dual Profuturo sesion actual

on:
  workflow_dispatch:
  push:
    branches:
      - migracion-github-actions
    paths:
      - ".github/workflows/update-dual-current-session.yml"
      - "scripts/refresh_profuturo_current_session_v3.py"
      - "scripts/patch_google_rolling30_assets.py"
      - "scripts/normalize_markets_bcrp_for_rolling30.py"
      - "scripts/patch_dual_20260824_exact.py"
      - "data/analysis/googlefinance_alt_rolling30_live_returns.csv"
  workflow_run:
    workflows:
      - "Actualizar mercado intradia Fondo 3"
    types:
      - completed

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: fondo3-data-writes
  cancel-in-progress: false

jobs:
  refresh:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: migracion-github-actions
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-live.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-live.txt

      - name: Refrescar mercado, auditar Google Finance y reconstruir Rolling 30
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin migracion-github-actions
          git reset --hard origin/migracion-github-actions
          rm -f /tmp/keep_existing_dual /tmp/rebuild_current

          if python scripts/refresh_profuturo_current_session_v3.py; then
            touch /tmp/rebuild_current
            echo "Sesión vigente obtenida directamente."
          else
            echo "Refresco directo no disponible; verificando si existe un dual ya validado de la sesión vigente."
            python - <<'PY'
          import json
          from datetime import datetime, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo

          now=datetime.now(ZoneInfo('America/New_York'))
          expected=now.date()
          if expected.weekday()>=5:
              expected=expected-timedelta(days=expected.weekday()-4)
          expected=expected.isoformat()
          dual=json.loads(Path('public/data/dual_rolling30_monitor.json').read_text(encoding='utf-8'))
          dual_date=str(dual.get('signal_date') or '')[:10]
          assert dual_date==expected,(dual_date,expected)
          for key in ('qqq','new_tickers'):
              cur=dual['models'][key]['current']
              assert str(cur.get('fecha') or '')[:10]==expected,(key,cur,expected)
              for row in dual['models'][key].get('intraday_assets',[]):
                  ts=str(row.get('timestamp') or '')[:10]
                  if ts and row.get('serie') not in {'USD_PEN','USD/PEN'}:
                      assert ts==expected,(key,row,expected)
          Path('/tmp/keep_existing_dual').write_text(expected,encoding='utf-8')
          print('ANTI-REGRESION: se conserva dual ya validado',expected)
          PY
          fi

          if test -f /tmp/rebuild_current; then
            # Google Finance se consulta DESPUÉS de que live.signal_date ya fue
            # llevado a la sesión correcta. El scraper bloquea cualquier quote T
            # que intente escribirse como T-1.
            python scripts/patch_google_rolling30_assets.py

            # Modelo A: para entrenar/reconstruir Rolling30 se normaliza USD/PEN
            # con BCRP PD04638PD. markets.csv se restaura luego para no alterar la
            # fuente cruda compartida con otros modelos.
            cp data/rolling90/markets.csv /tmp/markets_before_bcrp.csv
            python scripts/normalize_markets_bcrp_for_rolling30.py
            python scripts/build_dual_rolling30_monitor.py
            python scripts/patch_dual_rolling30_fx_operational.py
            python scripts/persist_dual_rolling30_shadow.py
            cp /tmp/markets_before_bcrp.csv data/rolling90/markets.csv
          else
            echo "No se reconstruye desde una fuente T-1."
          fi

          # El 24/08 se muestra con el recálculo ciego exacto auditado; el
          # pronóstico originalmente emitido permanece en shadow para auditoría.
          python scripts/patch_dual_20260824_exact.py

          python - <<'PY'
          import json
          import pandas as pd
          from datetime import datetime, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo

          now=datetime.now(ZoneInfo('America/New_York'))
          expected=now.date()
          if expected.weekday()>=5:
              expected=expected-timedelta(days=expected.weekday()-4)
          expected=expected.isoformat()

          dual=json.loads(Path('public/data/dual_rolling30_monitor.json').read_text(encoding='utf-8'))
          assert str(dual.get('signal_date') or '')[:10]==expected,(dual.get('signal_date'),expected)
          assert set(dual.get('models',{}))=={'qqq','new_tickers'}

          expected24={
              'qqq': (71.58040482180978,-0.006212591254568605),
              'new_tickers': (71.24786080890082,-0.010351304939247876),
          }
          for key,(vc24,ret24) in expected24.items():
              cur=dual['models'][key]['current']
              assert str(cur.get('fecha') or '')[:10]==expected,(key,cur,expected)
              row24=next(r for r in dual['models'][key].get('history_operational',[]) if str(r.get('fecha'))[:10]=='2026-08-24')
              assert row24.get('quality_status')=='CORREGIDO_EXACTO',(key,row24)
              assert abs(float(row24['vc_estimated'])-vc24)<1e-10,(key,row24)
              assert abs(float(row24['return_estimated'])-ret24)<1e-12,(key,row24)
              for row in dual['models'][key].get('intraday_assets',[]):
                  ts=str(row.get('timestamp') or '')[:10]
                  if ts and row.get('serie') not in {'USD_PEN','USD/PEN'}:
                      assert ts==expected,(key,row,expected)

          # Auditoría de los cierres Google Finance recuperados desde las capturas
          # originales de cada sesión. Esto detecta el antiguo desplazamiento T/T-1.
          gf=pd.read_csv('data/analysis/googlefinance_alt_rolling30_live_returns.csv')
          gf['fecha']=gf['fecha'].astype(str)
          spb={r.fecha:float(r.ret_SPBLSCUP) for r in gf.itertuples()}
          exp={
              '2026-08-24':-0.0026062593662445,
              '2026-08-25': 0.010735361365764362,
              '2026-08-26':-0.004114960358497122,
              '2026-08-27':-0.0019686316928069214,
          }
          for d,v in exp.items():
              assert d in spb,(d,spb)
              assert abs(spb[d]-v)<1e-12,(d,spb[d],v)

          print('VALIDADO dual=',expected)
          print('SPBLSCUP 24-27=',{d:spb[d] for d in exp})
          print('Modelo A=',dual['models']['qqq']['current'])
          print('Modelo B=',dual['models']['new_tickers']['current'])
          PY

          git add \
            public/data/live_market.json \
            public/data/dual_rolling30_monitor.json \
            data/analysis/googlefinance_alt_rolling30_live_returns.csv \
            data/analysis/rolling30_bcrp_normalization.json \
            data/rolling90/bcrp_pd04638_cache.csv \
            data/rolling90/dual_rolling30_shadow.csv
          if git diff --cached --quiet; then
            echo "No hubo cambios adicionales en Profuturo."
          else
            git commit -m "Validar cierres 24-28 y reconstruir Profuturo"
            git fetch origin migracion-github-actions
            git rebase origin/migracion-github-actions
            git push origin HEAD:migracion-github-actions
          fi

          tmp="$(mktemp -d)"
          git clone --depth 1 --branch gh-pages "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$tmp/gh-pages"
          mkdir -p "$tmp/gh-pages/data"
          cp public/data/live_market.json "$tmp/gh-pages/data/live_market.json"
          cp public/data/dual_rolling30_monitor.json "$tmp/gh-pages/data/dual_rolling30_monitor.json"
          cd "$tmp/gh-pages"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live_market.json data/dual_rolling30_monitor.json
          if git diff --cached --quiet; then
            echo "gh-pages ya está vigente."
          else
            git commit -m "Publicar Profuturo validado"
            git push origin HEAD:gh-pages
          fi

      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Subir sitio estatico actualizado
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Desplegar Pages actualizado
        id: deployment
        uses: actions/deploy-pages@v4
