name: Actualizar dual Profuturo sesion actual

on:
  workflow_dispatch:
  push:
    branches:
      - migracion-github-actions
    paths:
      - ".github/workflows/update-dual-current-session.yml"
      - "scripts/refresh_profuturo_current_session_v3.py"
      - "scripts/patch_dual_20260824_exact.py"
  workflow_run:
    workflows:
      - "Actualizar mercado intradia Fondo 3"
    types:
      - completed

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: fondo3-data-writes
  cancel-in-progress: false

jobs:
  refresh:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: migracion-github-actions
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-live.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-live.txt

      - name: Refrescar cierre y reconstruir Rolling 30
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin migracion-github-actions
          git reset --hard origin/migracion-github-actions
          rm -f /tmp/keep_existing_dual

          # Intenta reconstruir el cierre vigente. Si SPBLSCUP no responde después
          # del cierre, se permite conservar un dual YA VALIDADO de la misma sesión;
          # nunca se reemplaza una sesión T por T-1.
          if ! python scripts/refresh_profuturo_current_session_v3.py; then
            echo "Refresco directo no disponible; verificando snapshots ya validados."
            python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          today=datetime.now(ZoneInfo('America/New_York')).date().isoformat()
          live=json.loads(Path('public/data/live_market.json').read_text(encoding='utf-8'))
          dual=json.loads(Path('public/data/dual_rolling30_monitor.json').read_text(encoding='utf-8'))
          live_date=str(live.get('signal_date') or '')[:10]
          dual_date=str(dual.get('signal_date') or '')[:10]

          live_ok=False
          if live_date==today and live.get('new_ticker_validation',{}).get('status')=='OK':
              assets={str(r.get('serie')):r for r in live.get('experimental_assets',[])}
              spb=assets.get('SPBLSCUP')
              live_ok=bool(spb and str(spb.get('timestamp') or '')[:10]==today)

          if live_ok:
              print('Se conserva live validado de la misma sesión:',today)
          else:
              assert dual_date==today,(live_date,dual_date,today)
              assert set(dual.get('models',{}))=={'qqq','new_tickers'}
              for key in ('qqq','new_tickers'):
                  cur=dual['models'][key]['current']
                  assert str(cur.get('fecha') or '')[:10]==today,(key,cur,today)
                  rows=dual['models'][key].get('intraday_assets',[])
                  assert len(rows)==6,(key,len(rows))
                  for row in rows:
                      ts=str(row.get('timestamp') or '')[:10]
                      if ts and row.get('serie') not in {'USD_PEN','USD/PEN'}:
                          assert ts==today,(key,row,today)
              Path('/tmp/keep_existing_dual').write_text(today,encoding='utf-8')
              print('ANTI-REGRESION: live está en',live_date,'pero el dual validado ya está en',today,'. Se conserva el dual y no se reconstruye con T-1.')
          PY
          fi

          if test -f /tmp/keep_existing_dual; then
            echo "Se omite rebuild del dual para no degradar la sesión vigente."
          else
            python scripts/build_dual_rolling30_monitor.py
            python scripts/patch_dual_rolling30_fx_operational.py
          fi

          # La corrección histórica del 24/08 se reaplica siempre para que ningún
          # rebuild posterior vuelva a mostrar la fila contaminada del incidente.
          python scripts/patch_dual_20260824_exact.py

          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          live=json.loads(Path('public/data/live_market.json').read_text(encoding='utf-8'))
          dual=json.loads(Path('public/data/dual_rolling30_monitor.json').read_text(encoding='utf-8'))
          today=datetime.now(ZoneInfo('America/New_York')).date().isoformat()
          dual_date=str(dual.get('signal_date') or '')[:10]
          live_date=str(live.get('signal_date') or '')[:10]
          keep=Path('/tmp/keep_existing_dual').exists()

          assert dual_date==today,(dual_date,today)
          if not keep:
              assert live_date==dual_date,(live_date,dual_date)
          assert set(dual.get('models',{}))=={'qqq','new_tickers'}
          assert dual.get('historical_corrections',{}).get('2026-08-24',{}).get('status')=='CORREGIDO'

          expected24={
              'qqq': (71.58040482180978,-0.006212591254568605),
              'new_tickers': (71.24786080890082,-0.010351304939247876),
          }
          for key in ('qqq','new_tickers'):
              cur=dual['models'][key]['current']
              assert str(cur.get('fecha') or '')[:10]==dual_date,(key,cur,dual_date)
              assert float(cur['vc_estimated'])>0
              assert cur.get('signal') in {'SUBE','NEUTRO','BAJA'}
              row24=next(r for r in dual['models'][key].get('history_operational',[]) if str(r.get('fecha'))[:10]=='2026-08-24')
              vc24,ret24=expected24[key]
              assert row24.get('quality_status')=='CORREGIDO_EXACTO',(key,row24)
              assert abs(float(row24['vc_estimated'])-vc24)<1e-10,(key,row24)
              assert abs(float(row24['return_estimated'])-ret24)<1e-12,(key,row24)
              for row in dual['models'][key].get('intraday_assets',[]):
                  ts=str(row.get('timestamp') or '')[:10]
                  if ts and row.get('serie') not in {'USD_PEN','USD/PEN'}:
                      assert ts==dual_date,(key,row,dual_date)
          print('DUAL ACTUAL VALIDADO',dual_date,'live=',live_date,'preservado=',keep)
          print('Modelo A',dual['models']['qqq']['current'])
          print('Modelo B',dual['models']['new_tickers']['current'])
          print('24/08 A',next(r for r in dual['models']['qqq']['history_operational'] if str(r.get('fecha'))[:10]=='2026-08-24'))
          print('24/08 B',next(r for r in dual['models']['new_tickers']['history_operational'] if str(r.get('fecha'))[:10]=='2026-08-24'))
          PY

          git add public/data/live_market.json public/data/dual_rolling30_monitor.json data/rolling90/bcrp_pd04638_cache.csv
          if git diff --cached --quiet; then
            echo "No hubo cambios en Profuturo."
          else
            git commit -m "Actualizar Profuturo con la sesion de mercado vigente"
            git fetch origin migracion-github-actions
            git rebase origin/migracion-github-actions
            git push origin HEAD:migracion-github-actions
          fi

          # Se mantiene gh-pages como copia de datos, pero la publicación real se
          # hace además con deploy-pages para no depender de un build implícito.
          tmp="$(mktemp -d)"
          git clone --depth 1 --branch gh-pages "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$tmp/gh-pages"
          mkdir -p "$tmp/gh-pages/data"
          cp public/data/live_market.json "$tmp/gh-pages/data/live_market.json"
          cp public/data/dual_rolling30_monitor.json "$tmp/gh-pages/data/dual_rolling30_monitor.json"
          cd "$tmp/gh-pages"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live_market.json data/dual_rolling30_monitor.json
          if git diff --cached --quiet; then
            echo "gh-pages ya está vigente."
          else
            git commit -m "Publicar Profuturo con sesion vigente"
            git push origin HEAD:gh-pages
          fi

      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Subir sitio estatico actualizado
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Desplegar Pages actualizado
        id: deployment
        uses: actions/deploy-pages@v4
