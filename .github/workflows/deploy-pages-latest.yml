name: Publicar estado más reciente en GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - migracion-github-actions
    paths:
      - "public/**"
      - ".github/workflows/deploy-pages-latest.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-latest-state
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Esperar otros procesos de actualización
        run: sleep 45

      - name: Descargar la rama más reciente
        uses: actions/checkout@v4
        with:
          ref: migracion-github-actions
          fetch-depth: 1

      - name: Validar archivos vigentes
        run: |
          test -s public/index.html
          test -s public/data/latest.json
          test -s public/habitat/index.html
          test -s public/habitat/data/series.json
          grep -q "HABITAT_CHART_RESTORE_GAP_DATES_V3" public/habitat/index.html
          grep -q '"fecha": "2026-07-01"' public/habitat/data/series.json
          grep -q '"fecha": "2026-07-20"' public/habitat/data/series.json

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir el sitio más reciente
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
