name: Diagnosticar constructor del modelo de salida

on:
  workflow_dispatch:
  push:
    branches:
      - modelo-salida-60-20-20
    paths:
      - "src/modelo_salida/**"
      - ".github/workflows/diagnostico-modelo-salida.yml"
  pull_request:
    branches:
      - migracion-github-actions
    paths:
      - "src/modelo_salida/**"
      - ".github/workflows/diagnostico-modelo-salida.yml"

permissions:
  contents: read

jobs:
  diagnosticar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: modelo-salida-60-20-20

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar constructor y guardar registro completo
        id: constructor
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p diagnostico_modelo_salida
          set +e
          python src/modelo_salida/01_construir_base_salida.py > diagnostico_modelo_salida/constructor.log 2>&1
          estado=$?
          echo "$estado" > diagnostico_modelo_salida/estado.txt
          cat diagnostico_modelo_salida/constructor.log
          exit "$estado"

      - name: Guardar diagnostico como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-modelo-salida
          path: diagnostico_modelo_salida
          if-no-files-found: error
          retention-days: 30

      - name: Confirmar resultado
        if: steps.constructor.outcome == 'failure'
        run: |
          echo "El constructor fallo. Revisar el artefacto diagnostico-modelo-salida."
          exit 1
