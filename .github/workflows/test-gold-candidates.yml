name: Probar candidatos GLD y GDX
on:
  push:
    branches: [migracion-github-actions]
    paths:
      - 'scripts/test_gold_candidates.py'
      - '.github/workflows/test-gold-candidates.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migracion-github-actions
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy yfinance
      - run: python scripts/test_gold_candidates.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/gold_candidates_test.json analysis/gold_candidates_test.csv
          git diff --cached --quiet || git commit -m 'Guardar prueba provisional GLD GDX'
          git pull --rebase origin migracion-github-actions
          git push origin HEAD:migracion-github-actions
