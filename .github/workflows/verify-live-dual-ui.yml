name: Verificar visor dual en vivo

on:
  push:
    branches:
      - migracion-github-actions
    paths:
      - ".github/workflows/verify-live-dual-ui.yml"
  pull_request:
    branches:
      - migracion-github-actions
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-live-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migracion-github-actions
          fetch-depth: 0

      - name: Esperar despliegue de Pages
        run: sleep 20

      - name: Instalar Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Probar visor real publicado
        run: |
          node <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async()=>{
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({viewport:{width:1440,height:1100}});
            const errors=[];
            page.on('console',msg=>{ if(msg.type()==='error') errors.push(msg.text()); });
            page.on('pageerror',err=>errors.push(String(err)));
            const url='https://rldaqp.github.io/afp-fondo3-monitor/?verify='+Date.now();
            await page.goto(url,{waitUntil:'networkidle',timeout:90000});
            await page.waitForSelector('#dualTakeoverV3',{state:'visible',timeout:45000});
            await page.waitForFunction(()=>document.querySelector('#dSbs')?.textContent?.trim()!=='—',{timeout:30000});

            const txt = async sel => (await page.locator(sel).textContent()).trim();
            const visible = async sel => page.locator(sel).isVisible().catch(()=>false);
            const countCards = async sel => page.locator(sel).count();

            const result={
              checked_at:new Date().toISOString(),
              url,
              title:await page.title(),
              takeover_visible:await visible('#dualTakeoverV3'),
              sbs:await txt('#dSbs'),
              sbs_date:await txt('#dSbsDate'),
              model_a_vc:await txt('#dAVc'),
              model_a_signal:await txt('#dASig'),
              model_b_vc:await txt('#dBVc'),
              model_b_signal:await txt('#dBSig'),
              comparison:await txt('#dWin'),
              comparison_diff:await txt('#dDiff'),
              model_sections:await countCards('#dualTakeoverV3 .dv3m'),
              model_a_tickers:await countCards('#dM_qqq .dv3a'),
              model_b_tickers:await countCards('#dM_new_tickers .dv3a'),
              old_rolling90_visible:await visible('#reduced6030Panel'),
              old_market_visible:await visible('#marketPanel'),
              console_errors:errors
            };

            const expected={sbs:'70.3276160',a:'71.8606887',b:'71.7192086'};
            if(result.sbs!==expected.sbs) throw new Error('SBS visible incorrecto: '+result.sbs);
            if(result.model_a_vc!==expected.a) throw new Error('VC Modelo A visible incorrecto: '+result.model_a_vc);
            if(result.model_b_vc!==expected.b) throw new Error('VC Modelo B visible incorrecto: '+result.model_b_vc);
            if(result.model_sections!==2) throw new Error('No hay exactamente 2 modelos visibles: '+result.model_sections);
            if(result.model_a_tickers!==6) throw new Error('Modelo A no muestra 6 tickers: '+result.model_a_tickers);
            if(result.model_b_tickers!==6) throw new Error('Modelo B no muestra 6 tickers: '+result.model_b_tickers);
            if(result.old_rolling90_visible) throw new Error('Rolling 90 antiguo sigue visible');
            if(result.old_market_visible) throw new Error('Mercado antiguo sigue visible');

            async function testRanges(model, type){
              const expected={7:6,15:11,30:18,90:56,all:80};
              const out={};
              for(const d of ['7','15','30','90','all']){
                const c=page.locator(`.dv3c[data-k="${model}"][data-t="${type}"] button[data-d="${d}"]`);
                await c.click();
                await page.waitForTimeout(250);
                const note=await txt(`#d${type}N_${model}`);
                const m=note.match(/^(\d+) puntos/);
                out[d]=m?Number(m[1]):null;
                if(out[d]!==expected[d]) throw new Error(`${model} ${type} ${d}: ${out[d]} != ${expected[d]}`);
              }
              return out;
            }
            result.ranges={
              a_vc:await testRanges('qqq','Vc'),
              a_ret:await testRanges('qqq','Ret'),
              b_vc:await testRanges('new_tickers','Vc'),
              b_ret:await testRanges('new_tickers','Ret')
            };

            await page.screenshot({path:'public/data/live_dual_ui_verified.png',fullPage:true});
            result.screenshot='public/data/live_dual_ui_verified.png';
            result.status='PASS';
            fs.writeFileSync('public/data/live_dual_ui_verification.json',JSON.stringify(result,null,2));
            console.log(JSON.stringify(result,null,2));
            await browser.close();
          })().catch(err=>{console.error(err);process.exit(1)});
          JS

      - name: Guardar evidencia de prueba
        if: success() && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/live_dual_ui_verification.json public/data/live_dual_ui_verified.png
          git commit -m "Registrar prueba visual del visor dual en vivo" || true
          git pull --rebase origin migracion-github-actions || true
          git push origin HEAD:migracion-github-actions || true
