name: Verificar visor dual en vivo

on:
  pull_request:
    branches:
      - migracion-github-actions
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Probar visor público real
        run: |
          node <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1440,height:1100}});
            const errors=[];page.on('pageerror',e=>errors.push(String(e)));page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
            const url='https://rldaqp.github.io/afp-fondo3-monitor/?prverify='+Date.now();
            const r=await page.goto(url,{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForSelector('#dualTakeoverV3',{state:'visible',timeout:30000});
            await page.waitForFunction(()=>document.querySelector('#dSbs')?.textContent?.trim() && document.querySelector('#dSbs')?.textContent?.trim()!=='—',{timeout:30000});
            const txt=async s=>(await page.locator(s).textContent()).trim();
            const vis=async s=>page.locator(s).isVisible().catch(()=>false);
            const out={http:r.status(),title:await page.title(),sbs:await txt('#dSbs'),a:await txt('#dAVc'),b:await txt('#dBVc'),models:await page.locator('#dualTakeoverV3 .dv3m').count(),tickersA:await page.locator('#dM_qqq .asset').count(),tickersB:await page.locator('#dM_new_tickers .asset').count(),old90:await vis('#reduced6030Panel'),oldMarket:await vis('#marketPanel'),errors};
            if(out.http!==200)throw Error('HTTP '+out.http);
            if(out.sbs!=='70.3276160')throw Error('SBS '+out.sbs);
            if(out.a!=='71.8606887')throw Error('Modelo A '+out.a);
            if(out.b!=='71.7192086')throw Error('Modelo B '+out.b);
            if(out.models!==2)throw Error('Modelos '+out.models);
            if(out.tickersA!==6||out.tickersB!==6)throw Error('Tickers '+out.tickersA+'/'+out.tickersB);
            if(out.old90||out.oldMarket)throw Error('UI antigua visible');
            async function test(k,t){const exp={7:6,15:11,30:18,90:56,all:80},got={};for(const d of ['7','15','30','90','all']){await page.locator(`.controls[data-k="${k}"][data-t="${t}"] button[data-d="${d}"]`).click();await page.waitForTimeout(180);const note=await txt(`#d${t}N_${k}`),m=note.match(/^(\d+) puntos/);got[d]=m?+m[1]:null;if(got[d]!==exp[d])throw Error(`${k}/${t}/${d}=${got[d]} esperado ${exp[d]}`)}return got}
            out.ranges={aVc:await test('qqq','Vc'),aRet:await test('qqq','Ret'),bVc:await test('new_tickers','Vc'),bRet:await test('new_tickers','Ret')};
            if(errors.some(x=>/Cannot set properties of null|setting ['\"]?textContent/i.test(x)))throw Error('Error JS legado '+errors.join(' | '));
            console.log('VISOR_PUBLICO_PASS',JSON.stringify(out,null,2));
            await browser.close();
          })().catch(e=>{console.error('VISOR_PUBLICO_FAIL',e);process.exit(1)});
          JS
