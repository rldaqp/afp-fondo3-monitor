name: Analizar torneo de factores Profuturo

on:
  push:
    branches:
      - migracion-github-actions
    paths:
      - "scripts/analyze_profuturo_factor_tournament.py"
      - ".github/workflows/analyze-profuturo-factor-tournament.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profuturo-factor-tournament
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: migracion-github-actions
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar torneo diagnóstico
        run: python scripts/analyze_profuturo_factor_tournament.py

      - name: Guardar resultado diagnóstico
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/factor_tournament_profuturo.json
          if git diff --cached --quiet; then
            echo "Sin cambios en diagnóstico"
          else
            git commit -m "Actualizar diagnóstico de factores Profuturo"
            git pull --rebase origin migracion-github-actions
            git push origin HEAD:migracion-github-actions
          fi
