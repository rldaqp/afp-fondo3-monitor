name: Reconstruir dual Rolling 30 V6 ahora

on:
  push:
    branches:
      - migracion-github-actions
    paths:
      - ".github/workflows/rebuild-dual-v6-now.yml"
      - "scripts/build_dual_rolling30_monitor.py"
      - "scripts/patch_dual_rolling30_fx_operational.py"
      - "scripts/patch_dual_20260824_exact.py"
      - "scripts/patch_google_rolling30_assets.py"
      - "scripts/validate_new_ticker_session.py"
      - "scripts/persist_dual_rolling30_shadow.py"
      - "scripts/finalize_profuturo_close.py"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: fondo3-data-writes
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migracion-github-actions
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-live.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-live.txt

      - name: Reconstruir datos duales
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin migracion-github-actions
          git reset --hard origin/migracion-github-actions

          cp public/data/live_market.json /tmp/live_before_rebuild.json
          cp public/data/dual_rolling30_monitor.json /tmp/dual_before_rebuild.json
          rm -f /tmp/dual_preserved

          python scripts/sync_sbs_official_latest.py
          python scripts/apply_sbs_reference_corrections.py
          python scripts/patch_spblscup_google_selenium.py || true
          python scripts/update_live_market_hybrid.py

          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          oldp=Path('/tmp/live_before_rebuild.json')
          newp=Path('public/data/live_market.json')
          old=json.loads(oldp.read_text(encoding='utf-8'))
          new=json.loads(newp.read_text(encoding='utf-8'))
          old_date=str(old.get('signal_date') or '')[:10]
          new_date=str(new.get('signal_date') or '')[:10]
          if old_date and new_date and old_date > new_date:
              old['market_open']=False
              old['mode']='INTRADIA PROVISIONAL - ULTIMO CORTE'
              old['action']='ULTIMO_CORTE'
              old['checked_at_lima']=datetime.now(ZoneInfo('America/Lima')).isoformat()
              old['note']=(f'Se conserva la sesión {old_date}: la consulta nueva solo devolvió {new_date}. El monitor no retrocede de sesión.')
              newp.write_text(json.dumps(old,ensure_ascii=False,indent=2),encoding='utf-8')
              print('ANTI-REGRESION LIVE: restaurado',old_date,'en lugar de',new_date)
          else:
              print('Sesión live vigente:',new_date,'; previa:',old_date)
          PY

          # Validar cierres y luego aplicar la capa final: TuCambista por fecha,
          # cierres diarios exactos y recálculo desde el último VC SBS real.
          python scripts/patch_google_rolling30_assets.py || true
          python scripts/validate_new_ticker_session.py || true
          python scripts/finalize_profuturo_close.py

          python scripts/build_dual_rolling30_monitor.py
          # Regla FX de ambos Rolling30: BCRP PD04638PD si ya existe la fecha;
          # si no, midpoint TuCambista provisional. Yahoo PEN=X queda excluido.
          python scripts/patch_dual_rolling30_fx_operational.py
          python scripts/persist_dual_rolling30_shadow.py

          python - <<'PY'
          import json
          from pathlib import Path

          oldp=Path('/tmp/dual_before_rebuild.json')
          newp=Path('public/data/dual_rolling30_monitor.json')
          old=json.loads(oldp.read_text(encoding='utf-8'))
          new=json.loads(newp.read_text(encoding='utf-8'))
          od=str(old.get('signal_date') or '')[:10]
          nd=str(new.get('signal_date') or '')[:10]
          if od and nd and od > nd:
              newp.write_text(json.dumps(old,ensure_ascii=False,indent=2),encoding='utf-8')
              Path('/tmp/dual_preserved').write_text(od,encoding='utf-8')
              print('ANTI-REGRESION DUAL: restaurado',od,'en lugar de',nd)
          else:
              print('Dual reconstruido vigente:',nd,'; previo:',od)
          PY

          python scripts/patch_dual_20260824_exact.py

          python - <<'PY'
          import json
          import pandas as pd
          from pathlib import Path

          p=Path('public/data/dual_rolling30_monitor.json')
          live=json.loads(Path('public/data/live_market.json').read_text(encoding='utf-8'))
          d=json.loads(p.read_text(encoding='utf-8'))
          preserved=Path('/tmp/dual_preserved').exists()
          assert set(d['models'])=={'qqq','new_tickers'}
          if preserved:
              assert str(d['signal_date'])[:10] > str(live['signal_date'])[:10],(d['signal_date'],live['signal_date'])
          else:
              assert d['signal_date']==live['signal_date'],(d['signal_date'],live['signal_date'])
          assert float(d['latest_sbs']['vc'])>0
          assert d.get('historical_corrections',{}).get('2026-08-24',{}).get('status')=='CORREGIDO'

          expected24={
              'qqq': (71.58040482180978,-0.006212591254568605),
              'new_tickers': (71.24786080890082,-0.010351304939247876),
          }
          for k in ('qqq','new_tickers'):
              h=d['models'][k].get('history_one_step',[])
              assert len(h)>=30,(k,len(h))
              assert all(int(r.get('horizon_sessions',1))==1 for r in h),k
              assert len(d['models'][k].get('intraday_assets',[]))==6,k
              row24=next(r for r in d['models'][k].get('history_operational',[]) if str(r.get('fecha'))[:10]=='2026-08-24')
              ev,er=expected24[k]
              assert row24.get('quality_status')=='CORREGIDO_EXACTO',(k,row24)
              assert abs(float(row24['vc_estimated'])-ev)<1e-10,(k,row24)
              assert abs(float(row24['return_estimated'])-er)<1e-12,(k,row24)

          def fx(k,name):
              return next(a for a in d['models'][k]['intraday_assets'] if str(a.get('serie'))==name)
          a=fx('qqq','USD_PEN'); b=fx('new_tickers','USD/PEN')
          ar=float(a.get('retorno_modelo',a.get('retorno'))); br=float(b.get('retorno_modelo',b.get('retorno')))
          assert abs(ar-br)<1e-12,(ar,br)
          assert abs(float(a['precio_actual'])-float(b['precio_actual']))<1e-9,(a['precio_actual'],b['precio_actual'])
          src=str(d.get('shared_fx_operational',{}).get('source','')).upper()
          assert ('BCRP' in src) or ('TUCAMBISTA' in src),src
          assert 'YAHOO' not in src,src
          assert 'YAHOO' not in str(a.get('estado','')).upper(),a
          assert 'YAHOO' not in str(b.get('estado','')).upper(),b

          if not preserved:
              validation=live.get('new_ticker_validation',{})
              if validation.get('status') not in {'OK','COMPLETO/VALIDADO'}:
                  raise RuntimeError('Nuevos tickers no validados: '+json.dumps(validation,ensure_ascii=False))
              expected_date=str(live.get('signal_date') or '')[:10]
              for row in d['models']['new_tickers'].get('intraday_assets',[]):
                  if str(row.get('serie')) in {'.INX','CPER','EEM','NDX','SPBLSCUP','USD/PEN'}:
                      assert str(row.get('timestamp',''))[:10] == expected_date,(row,expected_date)
                      assert 'NO VALIDADO' not in str(row.get('estado','')).upper(),row

          shadow=Path('data/rolling90/dual_rolling30_shadow.csv')
          if shadow.exists():
              sh=pd.read_csv(shadow)
              issue=sh[(sh['model_key'].astype(str)=='new_tickers') & (sh['fecha'].astype(str)=='2026-08-24')]
              if not issue.empty:
                  assert str(issue.iloc[-1].get('quality_status'))=='EXCLUIR_SCORE',issue.iloc[-1].to_dict()
                  assert str(issue.iloc[-1].get('include_in_score')).lower() in {'false','0'},issue.iloc[-1].to_dict()

          d['history_chart_meta']={
              'source':'ROLLING30 ONE-STEP DIARIO',
              'horizon_sessions':1,
              'note':'El gráfico diario usa como base el VC SBS real de la sesión inmediatamente anterior. Blind3 queda solo como validación agregada.'
          }
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2),encoding='utf-8')
          print('V6 VALIDADO',d['signal_date'],'live=',live['signal_date'],'dual_preservado=',preserved,d['shared_fx_operational'])
          PY

          git add data/rolling90/sbs_profuturo_f3.csv data/rolling90/dual_rolling30_shadow.csv public/data/sbs_sync_status.json public/data/live_market.json public/data/dual_rolling30_monitor.json
          if test -f data/analysis/googlefinance_alt_rolling30_live_returns.csv; then git add data/analysis/googlefinance_alt_rolling30_live_returns.csv; fi
          git commit -m "Reconstruir visor dual V6 con cierre final y FX TuCambista" || true
          git pull --rebase origin migracion-github-actions || true
          git push origin HEAD:migracion-github-actions

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Publicar Pages V6
        id: deployment
        uses: actions/deploy-pages@v4
