name: Registrar senales prospectivas V4

on:
  workflow_dispatch:
  schedule:
    - cron: "30 23 * * 1-5"
  push:
    branches:
      - modelo-salida-60-20-20
    paths:
      - "config/modelo_salida_v4_congelado.json"
      - "src/modelo_salida/09_registrar_senales_prospectivas_v4.py"
      - ".github/workflows/registrar-senales-prospectivas-v4.yml"
  pull_request:
    branches:
      - migracion-github-actions
    paths:
      - "config/modelo_salida_v4_congelado.json"
      - "src/modelo_salida/09_registrar_senales_prospectivas_v4.py"
      - ".github/workflows/registrar-senales-prospectivas-v4.yml"

permissions:
  contents: write

concurrency:
  group: senales-prospectivas-v4-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  registrar:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && 'modelo-salida-60-20-20' || github.ref }}

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validar sintaxis y configuracion
        run: |
          python -m py_compile \
            src/modelo_salida/00_ejecutar_constructor_seguro.py \
            src/modelo_salida/04_modelo_rebote_salida_v2.py \
            src/modelo_salida/06_modelo_selectivo_diario_v4.py \
            src/modelo_salida/09_registrar_senales_prospectivas_v4.py
          python - <<'PY'
          import json
          from pathlib import Path
          cfg = json.loads(Path("config/modelo_salida_v4_congelado.json").read_text(encoding="utf-8"))
          assert cfg["congelado"] is True
          assert cfg["frecuencia"] == "diaria"
          assert cfg["modelos"]["Habitat"]["habilitado_senal"] is True
          assert sum(bool(x["habilitado_senal"]) for x in cfg["modelos"].values()) == 1
          PY

      - name: Reconstruir base con informacion disponible
        run: |
          python src/modelo_salida/00_ejecutar_constructor_seguro.py

      - name: Registrar senales congeladas
        run: |
          python src/modelo_salida/09_registrar_senales_prospectivas_v4.py

      - name: Auditar registro append-only
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          raiz = Path("data/prospectivo/modelo_salida")
          ultima = pd.read_csv(raiz / "ultima_senal.csv", encoding="utf-8-sig")
          historial = pd.read_csv(raiz / "senales_diarias.csv", encoding="utf-8-sig")
          manifiesto = json.loads(
              (raiz / "manifiesto_prospectivo.json").read_text(encoding="utf-8")
          )

          if set(ultima["afp"]) != {"Habitat", "Integra", "Prima", "Profuturo"}:
              raise SystemExit("La ultima ejecucion no contiene las cuatro AFP")
          if len(ultima) != 4:
              raise SystemExit("La ultima ejecucion debe tener una fila por AFP")
          if historial["signal_key"].duplicated().any():
              raise SystemExit("El historial contiene claves duplicadas")
          if not ultima["probabilidad_riesgo"].between(0, 1).all():
              raise SystemExit("Probabilidades fuera de 0-1")
          if not ultima["frecuencia"].eq("diaria").all():
              raise SystemExit("La frecuencia dejo de ser diaria")
          decision = pd.to_datetime(ultima["fecha_decision"], errors="coerce")
          objetivo = pd.to_datetime(ultima["fecha_objetivo"], errors="coerce")
          if decision.isna().any() or objetivo.isna().any() or not (objetivo > decision).all():
              raise SystemExit("Fechas invalidas o fuga temporal")
          habilitadas = ultima[ultima["habilitado_senal"].astype(str).str.lower().isin(["true", "1"])]
          if set(habilitadas["afp"]) != {"Habitat"}:
              raise SystemExit("Solo Habitat puede tener senal habilitada")
          if manifiesto.get("regla_append_only") is not True:
              raise SystemExit("El manifiesto no confirma append-only")

          print(ultima[[
              "afp", "fecha_decision", "fecha_objetivo", "probabilidad_riesgo",
              "umbral_dinamico", "estado_diario", "estado_validacion"
          ]].to_string(index=False))
          PY

      - name: Subir registro como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: senales-prospectivas-v4-${{ github.event_name }}
          path: |
            data/prospectivo/modelo_salida/senales_diarias.csv
            data/prospectivo/modelo_salida/resultados_senales.csv
            data/prospectivo/modelo_salida/ultima_senal.csv
            data/prospectivo/modelo_salida/manifiesto_prospectivo.json
          retention-days: 30

      - name: Guardar nuevas senales en la rama
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            data/prospectivo/modelo_salida/senales_diarias.csv \
            data/prospectivo/modelo_salida/resultados_senales.csv \
            data/prospectivo/modelo_salida/ultima_senal.csv \
            data/prospectivo/modelo_salida/manifiesto_prospectivo.json
          if git diff --cached --quiet; then
            echo "No existe una nueva fecha de decision para anexar."
          else
            git commit -m "Registrar senales prospectivas V4 [skip ci]"
            git push
          fi
