name: Probar capa de shocks modelos fijos

on:
  push:
    branches:
      - migracion-github-actions
    paths:
      - "scripts/analyze_fixed_shock_layer.py"
      - ".github/workflows/analyze-fixed-shock-layer.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fixed-shock-layer-diagnostic
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: migracion-github-actions
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: Ejecutar prueba de shocks
        run: python scripts/analyze_fixed_shock_layer.py

      - name: Guardar resultados diagnósticos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/fixed_shock_layer_test.json analysis/fixed_shock_layer_daily.csv
          if git diff --cached --quiet; then
            echo "Sin cambios en diagnóstico"
          else
            git commit -m "Actualizar prueba diagnóstica de shocks"
            git pull --rebase origin migracion-github-actions
            git push origin HEAD:migracion-github-actions
          fi
