name: Publicar visor GitHub Pages actual

on:
  push:
    branches:
      - migracion-github-actions
    paths:
      - "public/**"
      - "scripts/ensure_dual_trade_runtime.py"
      - ".github/workflows/deploy-pages-current.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: migracion-github-actions

      - name: Asegurar operaciones y Drive en ambos visores
        run: |
          python scripts/ensure_dual_trade_runtime.py
          grep -q 'data/dual_trade_runtime_v1.js?rev=DUALTRADEV3' public/index.html
          grep -q 'data/dual_trade_runtime_v1.js?rev=DUALTRADEV3' public/habitat/index.html
          grep -q "const FUND='PROFUTURO';" public/data/dual_trade_runtime_v1.js
          grep -q "const FUND='HABITAT';" public/habitat/data/dual_trade_runtime_v1.js
          grep -q 'Conectar Drive' public/data/dual_trade_runtime_v1.js
          grep -q 'Conectar Drive' public/habitat/data/dual_trade_runtime_v1.js

      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Subir sitio estatico
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Desplegar Pages
        id: deployment
        uses: actions/deploy-pages@v4
