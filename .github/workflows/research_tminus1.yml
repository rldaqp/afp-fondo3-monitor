name: Prueba externa OLS t-1

on:
  push:
    branches:
      - research-tminus1-ols
    paths:
      - "research/**"
      - ".github/workflows/research_tminus1.yml"
  pull_request:
    branches:
      - migracion-github-actions
    paths:
      - "research/**"
      - ".github/workflows/research_tminus1.yml"

permissions:
  contents: write

jobs:
  test-tminus1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: research-tminus1-ols

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: python -m pip install --upgrade pip pandas numpy

      - name: Ejecutar prueba
        run: python research/test_tminus1.py

      - name: Guardar resultados en rama de investigación
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research_outputs/
          if git diff --cached --quiet; then
            echo "Sin cambios en resultados"
          else
            git commit -m "Resultados prueba externa OLS t-1"
            git push origin HEAD:research-tminus1-ols
          fi

      - name: Publicar artefacto
        uses: actions/upload-artifact@v4
        with:
          name: resultados-tminus1
          path: research_outputs/
