name: Validar ventanas estáticas Profuturo

on:
  workflow_dispatch:
  push:
    branches:
      - research-static-window-validation-20260820
    paths:
      - "scripts/analyze_profuturo_static_windows.py"
      - ".github/workflows/analyze-profuturo-static-windows.yml"

permissions:
  contents: write

concurrency:
  group: research-static-window-validation-20260820
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: research-static-window-validation-20260820
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run static validation
        run: python scripts/analyze_profuturo_static_windows.py

      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/profuturo_static_windows_validation.json analysis/profuturo_static_windows_predictions.csv
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Guardar validación estática 90 180 270 y completa"
            git pull --rebase origin research-static-window-validation-20260820
            git push origin HEAD:research-static-window-validation-20260820
          fi
