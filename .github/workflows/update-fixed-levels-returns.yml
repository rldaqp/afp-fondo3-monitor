name: Actualizar modelos fijos niveles y retornos

on:
  workflow_dispatch:
  push:
    branches:
      - migracion-github-actions
    paths:
      - ".github/workflows/update-fixed-levels-returns.yml"
      - "scripts/sync_sbs_official_latest.py"
      - "scripts/build_fixed_levels_returns_monitor.py"
      - "scripts/fixed_market_quotes.py"
      - "scripts/fixed_model_contract.py"
      - "scripts/reconcile_fixed_history.py"
      - "scripts/validate_fixed_models.py"
      - "scripts/test_fixed_model_contract.py"
      - "scripts/ensure_profuturo_series_continuity.py"
      - "scripts/build_model_health.py"
      - "data/fixed_models/yahoo_levels_2026.csv"
      - "public/index.html"
      - "public/data/model_signal_v1.js"
      - "public/data/model_threshold_overlay_v1.js"
      - "public/data/model_health_v1.js"
  workflow_run:
    workflows:
      - "Actualizar dual Profuturo sesion actual"
    types:
      - completed
  schedule:
    - cron: "30 13 * * 1-5"
    - cron: "30 22 * * 1-5"
    # 20:30 hora Perú del lunes al viernes (01:30 UTC del día siguiente).
    - cron: "30 1 * * 2-6"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: profuturo-fixed-publish
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: migracion-github-actions
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: pip install --disable-pip-version-check pandas numpy yfinance requests beautifulsoup4 lxml selenium exchange-calendars

      - name: Pruebas de regresión SBS y cierres
        run: python -m unittest discover -s scripts -p test_fixed_model_contract.py -v

      - name: Sincronizar último VC oficial SBS
        run: python scripts/sync_sbs_official_latest.py

      - name: Construir serie fija 2026
        run: python scripts/build_fixed_levels_returns_monitor.py

      - name: Blindar continuidad historica
        run: python scripts/ensure_profuturo_series_continuity.py

      - name: Reconciliar SBS y cierre del mismo corte
        run: |
          python scripts/reconcile_fixed_history.py --sbs-only
          python scripts/build_fixed_models_intraday.py
          python scripts/reconcile_fixed_history.py

      - name: Construir control de salud
        run: python scripts/build_model_health.py

      - name: Validar salida
        run: |
          python scripts/validate_fixed_models.py
          node scripts/test_fixed_trade_live_date.js
          node scripts/test_fixed_dashboard_refresh.js

      - name: Persistir datos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/rolling90/sbs_profuturo_f3.csv \
            data/fixed_models/spblscup_levels_2026.csv \
            data/fixed_models/yahoo_levels_2026.csv \
            public/data/fixed_models_intraday.json \
            public/data/sbs_sync_status.json \
            public/data/series.json \
            public/data/fixed_models_2026.json \
            public/data/fixed_models_2026.csv \
            public/data/model_health.json
          if git diff --cached --quiet; then
            echo "Sin cambios de datos."
          else
            git commit -m "Actualizar SBS niveles retornos y salud del modelo"
            git fetch origin migracion-github-actions
            git rebase origin/migracion-github-actions
            git push origin HEAD:migracion-github-actions
          fi

      - name: Inyectar módulos del visor
        run: |
          if ! grep -q 'model_signal_v1.js' public/index.html; then
            sed -i 's#</body>#<script src="data/model_signal_v1.js?rev=SIGNAL1-20260831"></script></body>#' public/index.html
          fi
          if ! grep -q 'model_threshold_overlay_v1.js' public/index.html; then
            sed -i 's#</body>#<script src="data/model_threshold_overlay_v1.js?rev=THRESHOLD1-20260831"></script></body>#' public/index.html
          fi
          if ! grep -q 'model_health_v1.js' public/index.html; then
            sed -i 's#</body>#<script src="data/model_health_v1.js?rev=HEALTH1-20260831"></script></body>#' public/index.html
          fi

      - name: Verificar generación antes de desplegar
        run: python scripts/validate_fixed_models.py

      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Subir sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Desplegar Pages
        uses: actions/deploy-pages@v4

      - name: Confirmar corte publicado
        run: python scripts/profuturo_watchdog.py --verify-publication
