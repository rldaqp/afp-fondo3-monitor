name: Actualizar modelos fijos niveles y retornos

on:
  workflow_dispatch:
  push:
    branches:
      - migracion-github-actions
    paths:
      - ".github/workflows/update-fixed-levels-returns.yml"
      - "scripts/build_fixed_levels_returns_monitor.py"
      - "scripts/ensure_profuturo_series_continuity.py"
      - "scripts/build_model_health.py"
      - "data/fixed_models/yahoo_levels_2026.csv"
      - "public/index.html"
      - "public/data/model_signal_v1.js"
      - "public/data/model_threshold_overlay_v1.js"
      - "public/data/model_health_v1.js"
  workflow_run:
    workflows:
      - "Actualizar dual Profuturo sesion actual"
    types:
      - completed
  schedule:
    - cron: "30 22 * * 1-5"
    - cron: "30 13 * * 1-5"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: fixed-levels-returns
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: migracion-github-actions
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: pip install --disable-pip-version-check pandas numpy yfinance

      - name: Construir serie fija 2026
        run: python scripts/build_fixed_levels_returns_monitor.py

      - name: Blindar continuidad historica
        run: python scripts/ensure_profuturo_series_continuity.py

      - name: Construir control de salud
        run: python scripts/build_model_health.py

      - name: Validar salida
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path
          p=Path("public/data/fixed_models_2026.json")
          d=json.loads(p.read_text(encoding="utf-8"))
          assert len(d["rows"]) >= 100, len(d["rows"])
          assert d["training"]["n"] == 30
          assert abs(d["training"]["levels_r2"]-0.9839967207688474) < 1e-12
          assert abs(d["training"]["returns_r2"]-0.9518032304214648) < 1e-12
          assert d["training"]["sbs_corrections"] == {"2026-08-14":70.8740985,"2026-08-17":71.5395979}
          assert d["model_version"] == "v2-sbs-corrected-20260831"
          assert d["latest"]["market_date"] >= "2026-08-31"
          by={r["fecha"]:r for r in d["rows"]}
          for ds in ("2026-08-27","2026-08-28","2026-08-31"):
              assert ds in by, ds
              r=by[ds]
              for k in ("SPY","EEM","MCHI","QQQ","SPBLSCUP","vc_niveles","ret_vc_estimado","vc_retornos"):
                  v=r.get(k)
                  assert v is not None and math.isfinite(float(v)), (ds,k,v)
          # Yahoo puede representar un mismo cierre con pequeñas diferencias de coma flotante.
          # Se valida cercanía económica del precio, no igualdad binaria exacta.
          assert abs(float(by["2026-08-28"]["SPY"])-769.35) < 0.01
          assert abs(float(by["2026-08-28"]["EEM"])-67.14) < 0.01
          assert abs(float(by["2026-08-28"]["MCHI"])-55.23) < 0.01
          assert abs(float(by["2026-08-28"]["QQQ"])-716.43) < 0.01
          h=json.loads(Path("public/data/model_health.json").read_text(encoding="utf-8"))
          assert h["policy"]["minimum_change_n"] == 30
          assert set(h["models"].keys()) == {"niveles","retornos"}
          print("CONTINUIDAD OK", {ds:{k:by[ds][k] for k in ("vc_niveles","ret_vc_estimado","vc_retornos")} for ds in ("2026-08-27","2026-08-28","2026-08-31")})
          print("SALUD", h["models"]["niveles"]["status"], h["models"]["retornos"]["status"])
          PY

      - name: Persistir datos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/fixed_models/spblscup_levels_2026.csv \
            data/fixed_models/yahoo_levels_2026.csv \
            public/data/fixed_models_2026.json \
            public/data/fixed_models_2026.csv \
            public/data/model_health.json
          if git diff --cached --quiet; then
            echo "Sin cambios de datos."
          else
            git commit -m "Actualizar niveles retornos y salud del modelo"
            git fetch origin migracion-github-actions
            git rebase origin/migracion-github-actions
            git push origin HEAD:migracion-github-actions
          fi

      - name: Inyectar módulos del visor
        run: |
          if ! grep -q 'model_signal_v1.js' public/index.html; then
            sed -i 's#</body>#<script src="data/model_signal_v1.js?rev=SIGNAL1-20260831"></script></body>#' public/index.html
          fi
          if ! grep -q 'model_threshold_overlay_v1.js' public/index.html; then
            sed -i 's#</body>#<script src="data/model_threshold_overlay_v1.js?rev=THRESHOLD1-20260831"></script></body>#' public/index.html
          fi
          if ! grep -q 'model_health_v1.js' public/index.html; then
            sed -i 's#</body>#<script src="data/model_health_v1.js?rev=HEALTH1-20260831"></script></body>#' public/index.html
          fi

      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Subir sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Desplegar Pages
        uses: actions/deploy-pages@v4
