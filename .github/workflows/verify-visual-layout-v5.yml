name: Verificar layout visual visor dual V5
on:
  workflow_dispatch:
  push:
    branches: [migracion-github-actions]
    paths:
      - ".github/workflows/verify-visual-layout-v5.yml"
      - "public/index.html"
  pull_request:
    branches: [migracion-github-actions]
permissions:
  contents: write
jobs:
  verify-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migracion-github-actions
          fetch-depth: 0
      - name: Esperar propagación del despliegue
        run: sleep 30
      - name: Instalar Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Verificar panel global y gráficos compactos
        run: |
          node <<'JS'
          const {chromium}=require('playwright');
          const fs=require('fs');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1440,height:900}});
            const errors=[]; page.on('pageerror',e=>errors.push(String(e))); page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
            const url='https://rldaqp.github.io/afp-fondo3-monitor/?layoutv5='+Date.now();
            const r=await page.goto(url,{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForSelector('#dualTakeoverV4',{state:'visible',timeout:30000});
            await page.waitForFunction(()=>document.querySelectorAll('#tickerbar_qqq .tickerchip').length===6 && document.querySelectorAll('#tickerbar_new_tickers .tickerchip').length===6,{timeout:30000});
            const dock=page.locator('#globalTickerDock');
            async function dockState(label){
              const bb=await dock.boundingBox();
              if(!bb||!(await dock.isVisible()))throw Error(label+' panel global no visible');
              if(bb.y< -2 || bb.y>8)throw Error(label+' panel global no está pegado arriba: y='+bb.y);
              return {y:bb.y,h:bb.height};
            }
            const initial={tickersA:await page.locator('#tickerbar_qqq .tickerchip').count(),tickersB:await page.locator('#tickerbar_new_tickers .tickerchip').count()};
            await page.locator('#dVc_qqq').scrollIntoViewIfNeeded(); await page.waitForTimeout(500); const atA=await dockState('modelo A');
            await page.locator('#dRet_new_tickers').scrollIntoViewIfNeeded(); await page.waitForTimeout(500); const atB=await dockState('modelo B final');
            const aChart=await page.locator('#dVc_qqq').boundingBox(),bChart=await page.locator('#dRet_new_tickers').boundingBox();
            if(!aChart||aChart.height>320)throw Error('gráfico A demasiado alto '+(aChart&&aChart.height));
            if(!bChart||bChart.height>320)throw Error('gráfico B demasiado alto '+(bChart&&bChart.height));
            const out={checked_at_utc:new Date().toISOString(),url,http:r.status(),initial,atA,atB,aChartH:aChart.height,bChartH:bChart.height,errors,status:'PASS_GLOBAL_TICKERS_V5'};
            await page.screenshot({path:'/tmp/layout_v5.png',fullPage:false});
            fs.writeFileSync('/tmp/layout_v5.json',JSON.stringify(out,null,2));
            console.log(JSON.stringify(out,null,2)); await browser.close();
          })().catch(e=>{console.error('LAYOUT_V5_FAIL',e);process.exit(1)});
          JS
      - name: Guardar evidencia
        if: success() && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin migracion-github-actions
          git reset --hard origin/migracion-github-actions
          cp /tmp/layout_v5.json public/data/layout_live_verified.json
          cp /tmp/layout_v5.png public/data/layout_live_verified.png
          git add public/data/layout_live_verified.json public/data/layout_live_verified.png
          git commit -m "Registrar layout V5 verificado en vivo" || true
          git pull --rebase origin migracion-github-actions || true
          git push origin HEAD:migracion-github-actions || true
