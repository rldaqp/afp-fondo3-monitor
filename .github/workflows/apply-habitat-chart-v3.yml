name: Restaurar fechas del gráfico Hábitat

on:
  push:
    branches:
      - migracion-github-actions
    paths:
      - ".github/workflows/apply-habitat-chart-v3.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-habitat-chart-v3
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar rama
        uses: actions/checkout@v4
        with:
          ref: migracion-github-actions
          fetch-depth: 0

      - name: Cambiar únicamente el gráfico Hábitat
        run: python scripts/postprocess_habitat_chart_clarity.py

      - name: Validar fechas y dos líneas completas
        run: |
          grep -q "HABITAT_CHART_RESTORE_GAP_DATES_V3" public/habitat/index.html
          grep -q "name:'VC SBS real + fechas estimadas'" public/habitat/index.html
          grep -q "name:'VC estimado OLS'" public/habitat/index.html
          grep -q '"fecha": "2026-07-01"' public/habitat/data/series.json
          grep -q '"fecha": "2026-07-20"' public/habitat/data/series.json
          ! grep -q "name:'VC estimado · SBS pendiente'" public/habitat/index.html

      - name: Guardar solamente el HTML de Hábitat
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/habitat/index.html
          if git diff --cached --quiet; then
            echo "El gráfico de Hábitat ya estaba corregido."
          else
            git commit -m "Restaurar fechas y línea estimada en Hábitat"
            git pull --rebase origin migracion-github-actions
            git push origin HEAD:migracion-github-actions
          fi
