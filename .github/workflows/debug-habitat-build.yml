name: Diagnosticar construcción Hábitat

on:
  workflow_dispatch:
  push:
    branches:
      - migracion-github-actions
    paths:
      - ".github/workflows/debug-habitat-build.yml"
      - "scripts/discover_habitat_public_vc_source.py"
      - "scripts/inspect_habitat_investments_bundle.py"

permissions:
  contents: write

concurrency:
  group: habitat-build-debug
  cancel-in-progress: true

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Descubrir fuente pública de AFP Hábitat
        id: discover
        continue-on-error: true
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          mkdir -p data/rolling90
          set -o pipefail
          python scripts/discover_habitat_public_vc_source.py 2>&1 | tee data/rolling90/habitat_source_debug.txt

      - name: Inspeccionar bundle de inversiones
        id: bundle
        continue-on-error: true
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          set -o pipefail
          python scripts/inspect_habitat_investments_bundle.py 2>&1 | tee data/rolling90/habitat_bundle_debug.txt

      - name: Ejecutar y capturar registro
        id: build
        continue-on-error: true
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          set -o pipefail
          python scripts/run_habitat_exact_pipeline.py 2>&1 | tee data/rolling90/habitat_build_debug.txt

      - name: Añadir resultados
        run: |
          printf '\nDISCOVERY_OUTCOME=%s\n' "${{ steps.discover.outcome }}" >> data/rolling90/habitat_source_debug.txt
          printf '\nBUNDLE_OUTCOME=%s\n' "${{ steps.bundle.outcome }}" >> data/rolling90/habitat_bundle_debug.txt
          printf '\nBUILD_OUTCOME=%s\n' "${{ steps.build.outcome }}" >> data/rolling90/habitat_build_debug.txt
          printf 'COMMIT_SHA=%s\n' "$GITHUB_SHA" >> data/rolling90/habitat_source_debug.txt
          printf 'COMMIT_SHA=%s\n' "$GITHUB_SHA" >> data/rolling90/habitat_bundle_debug.txt
          printf 'COMMIT_SHA=%s\n' "$GITHUB_SHA" >> data/rolling90/habitat_build_debug.txt

      - name: Guardar diagnóstico
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rolling90/habitat_source_debug.txt data/rolling90/habitat_bundle_debug.txt data/rolling90/habitat_build_debug.txt
          git commit -m "Registrar bundle y diagnóstico de Hábitat" || exit 0
          git pull --rebase origin migracion-github-actions
          git push origin HEAD:migracion-github-actions
