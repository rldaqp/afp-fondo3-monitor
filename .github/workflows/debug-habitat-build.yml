name: Diagnosticar motor gap-aware Hábitat

on:
  workflow_dispatch:
  push:
    branches:
      - migracion-github-actions
    paths:
      - ".github/workflows/debug-habitat-build.yml"

permissions:
  contents: write

concurrency:
  group: habitat-gap-aware-debug
  cancel-in-progress: true

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar motor y capturar salida
        id: build
        continue-on-error: true
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          mkdir -p data/rolling90
          set -o pipefail
          python scripts/run_habitat_exact_pipeline.py 2>&1 | tee data/rolling90/habitat_gap_aware_debug.txt

      - name: Registrar resultado
        run: |
          printf '\nWORKFLOW_OUTCOME=%s\n' "${{ steps.build.outcome }}" >> data/rolling90/habitat_gap_aware_debug.txt
          printf 'COMMIT_SHA=%s\n' "$GITHUB_SHA" >> data/rolling90/habitat_gap_aware_debug.txt

      - name: Guardar diagnóstico y salidas si existen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rolling90/habitat_gap_aware_debug.txt
          test ! -d public/habitat || git add public/habitat
          git commit -m "Registrar diagnóstico del motor gap-aware Hábitat" || exit 0
          git pull --rebase origin migracion-github-actions
          git push origin HEAD:migracion-github-actions
