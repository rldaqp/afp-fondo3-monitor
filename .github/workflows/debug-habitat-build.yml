name: Extraer fuentes del servicio Hábitat

on:
  workflow_dispatch:
  push:
    branches:
      - migracion-github-actions
    paths:
      - ".github/workflows/debug-habitat-build.yml"
      - "scripts/fetch_habitat_service_sources.py"

permissions:
  contents: write

concurrency:
  group: habitat-service-source
  cancel-in-progress: true

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar requests
        run: python -m pip install requests

      - name: Extraer fuentes originales del source map
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: python scripts/fetch_habitat_service_sources.py

      - name: Guardar fuentes seleccionadas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rolling90/habitat_service_sources.txt
          git commit -m "Guardar fuentes públicas del servicio Hábitat" || exit 0
          git pull --rebase origin migracion-github-actions
          git push origin HEAD:migracion-github-actions
