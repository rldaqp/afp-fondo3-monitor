name: Extraer contrato del servicio Hábitat

on:
  workflow_dispatch:
  push:
    branches:
      - migracion-github-actions
    paths:
      - ".github/workflows/debug-habitat-build.yml"
      - "scripts/extract_habitat_service_contract.py"
      - "data/rolling90/habitat_bundle_debug.txt"

permissions:
  contents: write

concurrency:
  group: habitat-service-contract
  cancel-in-progress: true

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Extraer servicio y componentes consumidores
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          python scripts/extract_habitat_service_contract.py

      - name: Guardar contrato
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rolling90/habitat_service_contract.txt
          git commit -m "Extraer contrato público de valor cuota Hábitat" || exit 0
          git pull --rebase origin migracion-github-actions
          git push origin HEAD:migracion-github-actions
