name: Probar histórico Variables SPP

on:
  workflow_dispatch:
  push:
    branches:
      - migracion-github-actions
    paths:
      - ".github/workflows/debug-habitat-build.yml"
      - "scripts/probe_sbs_variables_history.py"

permissions:
  contents: write

concurrency:
  group: sbs-variables-history-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias mínimas
        run: python -m pip install requests beautifulsoup4 lxml

      - name: Inspeccionar formularios y navegación histórica
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: python scripts/probe_sbs_variables_history.py

      - name: Guardar resultados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rolling90/sbs_variables_history_probe.json
          git commit -m "Registrar navegación histórica de Variables SPP" || exit 0
          git pull --rebase origin migracion-github-actions
          git push origin HEAD:migracion-github-actions
