name: Resumir endpoints Hábitat

on:
  workflow_dispatch:
  push:
    branches:
      - migracion-github-actions
    paths:
      - ".github/workflows/debug-habitat-build.yml"
      - "scripts/summarize_habitat_bundle_debug.py"
      - "data/rolling90/habitat_bundle_debug.txt"

permissions:
  contents: write

concurrency:
  group: habitat-endpoint-summary
  cancel-in-progress: true

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Reducir diagnóstico a endpoints y contratos
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          python scripts/summarize_habitat_bundle_debug.py

      - name: Guardar resumen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rolling90/habitat_endpoint_summary.txt
          git commit -m "Resumir endpoints públicos de Hábitat" || exit 0
          git pull --rebase origin migracion-github-actions
          git push origin HEAD:migracion-github-actions
