name: Recuperar capturas SBS julio Hábitat

on:
  workflow_dispatch:
  push:
    branches:
      - migracion-github-actions
    paths:
      - ".github/workflows/debug-sbs-archives.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar archivos web
        run: |
          cat > /tmp/recover.py <<'PY'
          import gzip
          import io
          import json
          import re
          import urllib.parse
          import urllib.request

          TARGETS = [
              "https://www.sbs.gob.pe/app/spp/variablesSPP_net/PagSS/variables_spp.aspx",
              "http://www.sbs.gob.pe/app/spp/variablesSPP_net/PagSS/variables_spp.aspx",
              "https://www.sbs.gob.pe/app/spp/variablesSPP/variables_spp.asp",
              "http://www.sbs.gob.pe/app/spp/variablesSPP/variables_spp.asp",
          ]

          def get(url, headers=None, timeout=45):
              req = urllib.request.Request(url, headers=headers or {"User-Agent":"Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=timeout) as response:
                  return response.read(), dict(response.headers)

          print("=== WAYBACK CDX ===")
          captures = []
          for target in TARGETS:
              query = urllib.parse.urlencode({
                  "url": target,
                  "from": "20260701",
                  "to": "20260712",
                  "output": "json",
                  "filter": "statuscode:200",
                  "fl": "timestamp,original,digest,statuscode,mimetype",
                  "collapse": "digest",
              })
              url = "https://web.archive.org/cdx/search/cdx?" + query
              try:
                  body, _ = get(url)
                  print(target, body.decode("utf-8", "replace")[:5000])
                  data = json.loads(body)
                  for row in data[1:]:
                      captures.append((row[0], row[1]))
              except Exception as exc:
                  print("WAYBACK ERROR", target, type(exc).__name__, str(exc))

          for timestamp, original in captures:
              replay = f"https://web.archive.org/web/{timestamp}id_/{original}"
              try:
                  body, _ = get(replay)
                  text = body.decode("utf-8", "replace")
                  print("REPLAY", timestamp, original, "bytes", len(body))
                  for date in re.findall(r"Informaci(?:ó|&oacute;)n al\s+(\d{2}/\d{2}/2026)", text, flags=re.I):
                      print("DATE", date)
                  open(f"wayback_{timestamp}.html", "wb").write(body)
              except Exception as exc:
                  print("REPLAY ERROR", timestamp, type(exc).__name__, str(exc))

          print("=== COMMON CRAWL ===")
          try:
              body, _ = get("https://index.commoncrawl.org/collinfo.json")
              indexes = json.loads(body)
          except Exception as exc:
              print("COLLINFO ERROR", type(exc).__name__, str(exc))
              indexes = []

          # Consultar índices 2026, empezando por los más cercanos a julio.
          selected = [item for item in indexes if "2026" in item.get("id", "")][:12]
          cc_records = []
          for item in selected:
              api = item["cdx-api"]
              for target in TARGETS:
                  url = api + "?" + urllib.parse.urlencode({"url": target, "output": "json", "filter": "status:200"})
                  try:
                      body, _ = get(url)
                      lines = body.decode("utf-8", "replace").splitlines()
                      matches = []
                      for line in lines:
                          if not line.strip():
                              continue
                          row = json.loads(line)
                          ts = str(row.get("timestamp", ""))
                          if "20260701" <= ts[:8] <= "20260712":
                              matches.append(row)
                      if matches:
                          print("CC INDEX", item["id"], target, json.dumps(matches, ensure_ascii=False)[:10000])
                          cc_records.extend(matches)
                  except Exception as exc:
                      print("CC ERROR", item.get("id"), type(exc).__name__, str(exc))

          for index, row in enumerate(cc_records):
              try:
                  headers = {"Range": f"bytes={row['offset']}-{int(row['offset']) + int(row['length']) - 1}", "User-Agent":"Mozilla/5.0"}
                  body, _ = get("https://data.commoncrawl.org/" + row["filename"], headers=headers, timeout=90)
                  decoded = gzip.GzipFile(fileobj=io.BytesIO(body)).read()
                  split = decoded.split(b"\r\n\r\n", 2)
                  payload = split[-1]
                  if payload.startswith(b"HTTP/"):
                      payload = payload.split(b"\r\n\r\n", 1)[-1]
                  path = f"commoncrawl_{index}_{row.get('timestamp','')}.html"
                  open(path, "wb").write(payload)
                  text = payload.decode("utf-8", "replace")
                  print("CC PAYLOAD", path, len(payload), re.findall(r"Informaci(?:ó|&oacute;)n al\s+(\d{2}/\d{2}/2026)", text, flags=re.I))
              except Exception as exc:
                  print("CC FETCH ERROR", index, type(exc).__name__, str(exc))
          PY
          python /tmp/recover.py | tee archive_report.txt

      - name: Guardar capturas encontradas
        uses: actions/upload-artifact@v4
        with:
          name: sbs-archive-captures
          path: |
            archive_report.txt
            wayback_*.html
            commoncrawl_*.html
          if-no-files-found: warn
          retention-days: 1
